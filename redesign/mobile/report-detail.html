<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report · ProctiraERP Mobile</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body data-tab="services">
<div class="phone">
  <header class="appbar">
    <button class="ab-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="ab-title">
      <h1>Report</h1>
      <div class="ab-sub">Generated 1 Jun 2026 · 06:12</div>
    </div>
  </header>
  <div class="screen">

    <div class="m-card pad" style="display:flex;align-items:center;gap:12px">
      <span class="mi-icon" style="width:44px;height:44px;border-radius:14px;background:var(--green-50);color:var(--green-600);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:var(--fs-md);font-weight:700">Class Attendance Summary</span>
        <span style="display:block;font-size:var(--fs-xs);color:var(--text-3)">Grade VIII A · May 2026 · PDF · 1.2 MB</span>
      </span>
      <span class="pill green plain">Ready</span>
    </div>

    <div class="m-card pad">
      <div style="font-size:var(--fs-xs);font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Attendance by week</div>
      <svg viewBox="0 0 326 150" role="img" aria-label="Bar chart: weekly attendance, W1 93.2%, W2 96.4%, W3 92.5%, W4 94.1%" style="width:100%;height:auto;display:block">
        <line x1="8" y1="124" x2="318" y2="124" stroke="var(--border)" stroke-width="1"/>
        <rect x="28"  y="36.8" width="48" height="87.2" rx="8" fill="var(--brand-200)"/>
        <rect x="104" y="22.4" width="48" height="101.6" rx="8" fill="var(--brand-600)"/>
        <rect x="180" y="40"   width="48" height="84"   rx="8" fill="var(--brand-200)"/>
        <rect x="256" y="32.8" width="48" height="91.2" rx="8" fill="var(--brand-400)"/>
        <text x="52"  y="28" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-2)" font-family="Inter, sans-serif">93.2</text>
        <text x="128" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="var(--brand-700)" font-family="Inter, sans-serif">96.4</text>
        <text x="204" y="31" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-2)" font-family="Inter, sans-serif">92.5</text>
        <text x="280" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-2)" font-family="Inter, sans-serif">94.1</text>
        <text x="52"  y="142" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-3)" font-family="Inter, sans-serif">W1</text>
        <text x="128" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-3)" font-family="Inter, sans-serif">W2</text>
        <text x="204" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-3)" font-family="Inter, sans-serif">W3</text>
        <text x="280" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-3)" font-family="Inter, sans-serif">W4</text>
      </svg>
    </div>

    <h2 class="sec">Key figures</h2>
    <div class="m-list">
      <div class="m-item">
        <span class="mi-icon" style="background:var(--brand-50);color:var(--brand-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <span class="mi-body"><span class="mi-title">Working days</span></span>
        <span class="mi-end" style="font-weight:800;font-variant-numeric:tabular-nums">24</span>
      </div>
      <div class="m-item">
        <span class="mi-icon" style="background:var(--green-50);color:var(--green-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
        <span class="mi-body"><span class="mi-title">Average attendance</span></span>
        <span class="mi-end" style="font-weight:800;font-variant-numeric:tabular-nums">94.1%</span>
      </div>
      <div class="m-item">
        <span class="mi-icon" style="background:var(--red-50);color:var(--red-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
        <span class="mi-body"><span class="mi-title">Chronic absentees</span><span class="mi-sub">Below 75% this month</span></span>
        <span class="mi-end" style="font-weight:800;font-variant-numeric:tabular-nums">2</span>
      </div>
      <div class="m-item">
        <span class="mi-icon" style="background:var(--amber-50);color:var(--amber-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.79 13.88 17 23l-5-3-5 3 1.21-9.12"/></svg></span>
        <span class="mi-body"><span class="mi-title">Best week</span><span class="mi-sub">4–8 May · 96.4%</span></span>
        <span class="mi-end" style="font-weight:800;font-variant-numeric:tabular-nums">W2</span>
      </div>
    </div>

  </div>
  <div class="m-cta" style="bottom:78px">
    <button class="m-btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Share PDF</button>
    <button class="m-btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download</button>
  </div>
</div>
<script src="mobile.js"></script>
</body>
</html>
