<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan documents · ProctiraERP Mobile</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/app.css">
<link rel="stylesheet" href="mobile.css">
<style>
  .viewfinder {
    position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 3 / 3.6;
    background: linear-gradient(160deg, #1B2236 0%, #0E1426 60%, #0A0F21 100%);
    box-shadow: var(--sh-md);
  }
  .vf-caption {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font-size: var(--fs-xs); font-weight: 600; color: rgba(255,255,255,.85); letter-spacing: .01em;
  }
  .cap-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 26px; }
  .cap-side {
    width: 50px; height: 50px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--sh-xs);
  }
  .cap-side svg { width: 20px; height: 20px; }
  .shutter {
    width: 74px; height: 74px; border-radius: 50%; cursor: pointer; border: none;
    background: var(--brand-600);
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--brand-200), 0 12px 26px color-mix(in srgb, var(--brand-600) 45%, transparent);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .shutter svg { width: 27px; height: 27px; }
  .gal-thumb {
    background: linear-gradient(135deg, var(--teal-500), #0F766E); color: #fff; border: none;
  }
</style>
</head>
<body data-tab="services">
<div class="phone">
  <header class="appbar">
    <a class="ab-back" href="services.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
    <div class="ab-title">
      <h1>Scan documents</h1>
      <div class="ab-sub">Aarav Sharma · IDN-10000</div>
    </div>
    <button class="ab-action" aria-label="Scan settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div class="screen">

    <div class="viewfinder">
      <svg viewBox="0 0 320 384" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <!-- corner brackets -->
        <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9">
          <path d="M30 56 v-18 a8 8 0 0 1 8-8 h18"/>
          <path d="M264 30 h18 a8 8 0 0 1 8 8 v18"/>
          <path d="M290 308 v18 a8 8 0 0 1-8 8 h-18"/>
          <path d="M56 334 h-18 a8 8 0 0 1-8-8 v-18"/>
        </g>
        <!-- detected document outline -->
        <g>
          <rect x="58" y="68" width="204" height="238" rx="6" fill="rgba(255,255,255,.07)" stroke="var(--green-500)" stroke-width="2.5" stroke-dasharray="10 7"/>
          <!-- faux certificate content -->
          <g opacity=".5" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round">
            <line x1="92" y1="104" x2="228" y2="104"/>
            <line x1="110" y1="122" x2="210" y2="122"/>
          </g>
          <g opacity=".3" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
            <line x1="80" y1="158" x2="240" y2="158"/>
            <line x1="80" y1="176" x2="240" y2="176"/>
            <line x1="80" y1="194" x2="216" y2="194"/>
            <line x1="80" y1="212" x2="240" y2="212"/>
            <line x1="80" y1="230" x2="190" y2="230"/>
          </g>
          <circle cx="216" cy="272" r="17" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity=".55"/>
          <!-- corner handles on detection -->
          <g fill="var(--green-500)">
            <circle cx="58" cy="68" r="5"/><circle cx="262" cy="68" r="5"/>
            <circle cx="262" cy="306" r="5"/><circle cx="58" cy="306" r="5"/>
          </g>
        </g>
      </svg>
      <div class="vf-caption">Align the certificate within the frame</div>
    </div>

    <div class="cap-row">
      <button class="cap-side gal-thumb" aria-label="Open gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      </button>
      <button class="shutter" aria-label="Capture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </button>
      <button class="cap-side" aria-label="Toggle flash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>

    <h2 class="sec">Recent scans</h2>
    <div class="m-list">
      <div class="m-item">
        <span class="mi-icon" style="background:var(--green-50);color:var(--green-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
        <span class="mi-body"><span class="mi-title">Birth certificate.pdf</span><span class="mi-sub">1.2 MB · scanned 09:12 today</span></span>
        <span class="mi-end"><span class="pill green plain">Uploaded ✓</span></span>
      </div>
      <div class="m-item">
        <span class="mi-icon" style="background:var(--amber-50);color:var(--amber-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
        <span class="mi-body"><span class="mi-title">TC.pdf</span><span class="mi-sub">860 KB · scanned 09:18 today</span></span>
        <span class="mi-end"><span class="pill amber plain">Queued for sync</span></span>
      </div>
    </div>

    <p class="m-note">Scans are compressed on device and upload automatically when you're online.</p>

  </div>
</div>
<script src="mobile.js"></script>
</body>
</html>
