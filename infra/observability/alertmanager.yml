# Alertmanager routing and receivers.
#
# Routing tree
#  - severity=critical          → pagerduty   (24x7 on-call)
#  - severity=warning           → slack       (#proctira-alerts)
#  - everything else            → email       (ops@proctira.org)
#
# Replace receiver URLs / keys with values from a secret manager before
# deploying. The placeholders below are intentionally non-functional.
global:
  resolve_timeout: 5m
  smtp_from: alertmanager@proctira.org
  smtp_smarthost: smtp.proctira.org:587
  smtp_require_tls: true

route:
  receiver: default-email
  group_by:
    - alertname
    - service
    - tenant_id
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: pagerduty-critical
      group_wait: 0s
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity = "warning"
      receiver: slack-warnings
      repeat_interval: 6h
      continue: true

    - matchers:
        - team = "security"
      receiver: slack-security
      continue: true

inhibit_rules:
  # Suppress noisy availability alerts when a service is fully down.
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - alertname =~ "ServiceErrorRate.*|ServiceP95LatencyHigh|ServiceP99LatencyHigh"
    equal: ['service']

receivers:
  - name: default-email
    email_configs:
      - to: ops@proctira.org
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: REPLACE_ME_PAGERDUTY_INTEGRATION_KEY
        send_resolved: true
        description: '{{ .CommonLabels.alertname }} on {{ .CommonLabels.service }}'
        details:
          severity: '{{ .CommonLabels.severity }}'
          team: '{{ .CommonLabels.team }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'

  - name: slack-warnings
    slack_configs:
      - api_url: REPLACE_ME_SLACK_WEBHOOK_URL
        channel: '#proctira-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          *Service*: {{ .CommonLabels.service }}
          *Severity*: {{ .CommonLabels.severity }}
          *Description*: {{ .CommonAnnotations.description }}
          *Runbook*: {{ .CommonAnnotations.runbook_url }}

  - name: slack-security
    slack_configs:
      - api_url: REPLACE_ME_SLACK_SECURITY_WEBHOOK_URL
        channel: '#proctira-security-alerts'
        send_resolved: true
        title: '[SECURITY] {{ .CommonLabels.alertname }}'
        text: |
          *Service*: {{ .CommonLabels.service }}
          *Description*: {{ .CommonAnnotations.description }}
          *Runbook*: {{ .CommonAnnotations.runbook_url }}

templates: []
