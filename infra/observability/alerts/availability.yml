# Availability alerts.
#
# Definitions
#  - SLI: fraction of HTTP requests answered without a 5xx in the last 5m.
#  - SLO: 99.9% successful responses over a 30-day window.
#  - Hard down: scrape `up` reports 0 for more than 2 minutes.
groups:
  - name: availability
    interval: 30s
    rules:
      - alert: ServiceErrorRateHigh
        expr: |
          (
            sum by (service) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          team: engineering
          slo: availability
        annotations:
          summary: '{{ $labels.service }} 5xx rate above 1% over 5m'
          description: |
            Service {{ $labels.service }} has returned 5xx responses for more than 1%
            of requests during the last 5 minutes (current: {{ $value | humanizePercentage }}).
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#error-rate-high'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      # PRC-M313: ServiceDown only sees jobs that exist; a gateway that vanished
      # from discovery entirely produces no `up` series, so alert on absence too.
      # #555 review #8: keyed on the `service` label, not `job`. In Kubernetes
      # the gateway is scraped by the `kubernetes-pods` job (service comes from
      # app.kubernetes.io/name), while a static `api-gateway` job may still list
      # an unreachable target. `== 1` makes the alert fire when no job has a
      # healthy gateway scrape, whichever job (static or discovered) exists.
      - alert: GatewayScrapeAbsent
        expr: absent(up{service="api-gateway"} == 1)
        for: 5m
        labels:
          severity: critical
          team: ops
          slo: availability
        annotations:
          summary: 'api-gateway has no healthy scrape target'
          description: |
            No scrape job (static or Kubernetes pod discovery) has reported a
            successful `up{service="api-gateway"}` sample for 5 minutes: the
            gateway is down everywhere or is not being discovered at all.
          runbook_url: 'https://runbooks.proctira.org/services/api-gateway.md#service-down'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      - alert: ServiceDown
        expr: up{job!~"prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          team: ops
          slo: availability
        annotations:
          summary: '{{ $labels.service }} is down'
          description: |
            Prometheus has been unable to scrape {{ $labels.service }} for at least
            2 minutes. The service may be crashed, deadlocked, or unreachable.
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#service-down'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      # PRC-L473: pg-backup / phi-retention run as Kubernetes CronJobs with no
      # HTTP surface, so the HTTP-based alerts above never see a failed run.
      # kube_job_failed comes from kube-state-metrics (see prometheus.yml's
      # kube-state-metrics scrape job); this fires once a failed backup or
      # retention Job's condition is reported.
      - alert: DrCronJobFailed
        expr: kube_job_failed{job_name=~"proctira-.*(pg-backup|phi-retention).*"} == 1
        for: 0m
        labels:
          severity: critical
          team: ops
          slo: availability
        annotations:
          summary: 'DR CronJob {{ $labels.job_name }} failed'
          description: |
            The disaster-recovery Job {{ $labels.job_name }} (pg-backup or
            phi-retention) reported a failed condition. This alert depends on
            kube-state-metrics being scraped in the target cluster (see the
            kube-state-metrics job in prometheus.yml); without it the Job can
            fail silently with no page.
          runbook_url: 'https://runbooks.proctira.org/services/dr-jobs.md#cronjob-failed'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      - alert: ServiceErrorRateCritical
        expr: |
          (
            sum by (service) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: engineering
          slo: availability
        annotations:
          summary: '{{ $labels.service }} 5xx rate above 5% over 5m'
          description: |
            Service {{ $labels.service }} is failing more than 5% of requests
            (current: {{ $value | humanizePercentage }}). Page on-call.
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#error-rate-critical'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'
