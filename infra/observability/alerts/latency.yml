# Latency alerts.
#
# Definitions
#  - SLI: P95 of http_request_duration_seconds over a 5m window.
#  - SLO: P95 latency below 500ms (read paths) or 1s (write paths).
groups:
  - name: latency
    interval: 30s
    rules:
      - alert: ServiceP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: engineering
          slo: latency
        annotations:
          summary: "{{ $labels.service }} P95 latency above 500ms"
          description: |
            Service {{ $labels.service }} P95 latency is {{ $value | humanizeDuration }} over
            the last 5 minutes (SLO: < 500ms).
          runbook_url: "https://runbooks.proctira.org/services/{{ $labels.service }}.md#latency-high"
          dashboard_url: "https://grafana.proctira.org/d/proctira-service-overview"

      - alert: ServiceP99LatencyHigh
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: critical
          team: engineering
          slo: latency
        annotations:
          summary: "{{ $labels.service }} P99 latency above 2s"
          description: |
            Service {{ $labels.service }} P99 latency is {{ $value | humanizeDuration }}
            over the last 5 minutes. Sustained tail latency, page on-call.
          runbook_url: "https://runbooks.proctira.org/services/{{ $labels.service }}.md#latency-critical"
          dashboard_url: "https://grafana.proctira.org/d/proctira-service-overview"
