# Critical journey burn alerts (G-502).
# Complements availability/latency with journey-oriented labels for on-call.
# Expressions remain service-level until route labels are exported.
groups:
  - name: critical_journeys
    interval: 30s
    rules:
      - alert: ParentPortalJourneyErrorBudgetBurn
        expr: |
          (
            sum(rate(http_requests_total{service="api-gateway",status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="api-gateway"}[5m]))
          ) > 0.02
        for: 10m
        labels:
          severity: warning
          team: engineering
          slo: parent-portal-journey
          journey: parent-portal
        annotations:
          summary: 'Parent portal journey error budget burning on api-gateway'
          description: |
            api-gateway 5xx rate is above 2% for 10m. Parent messaging / consent / fees
            journeys may be impacted. See docs/observability/SLO_CRITICAL_JOURNEYS.md.
          runbook_url: 'https://runbooks.proctira.org/services/api-gateway.md#error-rate-high'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-slo-tracking'

      - alert: AuthLoginJourneyErrorBudgetBurn
        expr: |
          (
            sum(rate(http_requests_total{service=~"auth|api-gateway",status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service=~"auth|api-gateway"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          team: engineering
          slo: auth-login-journey
          journey: auth-login
        annotations:
          summary: 'Auth / login journey error budget burning'
          description: |
            Combined auth + api-gateway 5xx rate above 1% for 5m.
            See docs/observability/SLO_CRITICAL_JOURNEYS.md.
          runbook_url: 'https://runbooks.proctira.org/services/auth.md#error-rate-high'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-slo-tracking'
