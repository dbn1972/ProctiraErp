# Saturation alerts.
#
# Definitions
#  - SLI: process CPU usage and resident memory relative to allocated quota.
#  - SLO: keep CPU < 85% and memory < 90% under steady state.
groups:
  - name: saturation
    interval: 30s
    rules:
      - alert: ProcessCPUHigh
        # rate(process_cpu_seconds_total[5m]) gives core-seconds per second.
        # Threshold of 0.85 corresponds to 85% of one core; multi-core services
        # should override the threshold via service-specific rules.
        expr: |
          rate(process_cpu_seconds_total[5m]) > 0.85
        for: 5m
        labels:
          severity: warning
          team: ops
          slo: saturation
        annotations:
          summary: '{{ $labels.service }} CPU above 85% for 5m'
          description: |
            Process CPU on {{ $labels.service }} is at {{ $value | humanize }} cores
            (>85% of one core) over the last 5 minutes. Consider horizontal scaling.
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#cpu-saturation'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      - alert: ProcessMemoryHigh
        # SLI: resident memory relative to the pod's allocated memory *limit*
        # (the quota the kernel OOM-kills against), NOT the V8 heap total.
        # RSS routinely exceeds nodejs_heap_size_total_bytes (native allocations,
        # buffers, code), so dividing by heap total made this alert near-always
        # true. kube_pod_container_resource_limits{resource="memory"} is exported
        # by kube-state-metrics for every pod with a memory limit set.
        expr: |
          (
            container_memory_working_set_bytes{container!="",container!="POD"}
            /
            on (namespace, pod, container) group_left()
              kube_pod_container_resource_limits{resource="memory"}
          ) > 0.9
        for: 5m
        labels:
          severity: warning
          team: ops
          slo: saturation
        annotations:
          summary: '{{ $labels.container }} memory usage above 90% of limit'
          description: |
            Working-set memory on {{ $labels.container }} (pod {{ $labels.pod }}) is at
            {{ $value | humanizePercentage }} of its configured memory limit.
            Risk of OOM kill and restart.
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#memory-saturation'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'

      - alert: EventLoopLagHigh
        expr: |
          nodejs_eventloop_lag_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          team: engineering
          slo: saturation
        annotations:
          summary: '{{ $labels.service }} event loop lag > 100ms'
          description: |
            Node.js event loop lag on {{ $labels.service }} has exceeded 100ms for
            5 minutes. The service is CPU-bound or blocked on sync I/O.
          runbook_url: 'https://runbooks.proctira.org/services/{{ $labels.service }}.md#event-loop-lag'
          dashboard_url: 'https://grafana.proctira.org/d/proctira-service-overview'
