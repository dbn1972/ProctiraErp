# Prometheus configuration for the ProctiraERP Unified Platform.
#
# - Scrapes every backend service /metrics endpoint every 15s.
# - Loads alert rules from ./alerts/*.yml.
# - Forwards firing alerts to the Alertmanager service on port 9093.
#
# When run via docker-compose.observability.yml the service hostnames
# below resolve through the shared docker network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: proctira
    env: dev

rule_files:
  - alerts/availability.yml
  - alerts/latency.yml
  - alerts/error_rate.yml
  - alerts/saturation.yml
  - alerts/queue_lag.yml
  - alerts/critical_journeys.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ─── Edge / Gateway ────────────────────────────────────────────────────────
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000']
        labels:
          service: api-gateway
          team: engineering

  # ─── Core domain services ──────────────────────────────────────────────────
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:3001']
        labels:
          service: auth
          team: security

  - job_name: institution
    metrics_path: /metrics
    static_configs:
      - targets: ['institution:3002']
        labels:
          service: institution
          team: engineering

