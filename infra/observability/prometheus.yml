# Prometheus configuration for the ProctiraERP Unified Platform (G-725).
#
# Honest scrape inventory — every target below is a process that actually
# registers `@proctira/observability` and serves GET /metrics:
#
#   - api-gateway (docker-compose.yml)            :3000  — mounts every domain
#     plugin in-process, so gateway metrics carry `route` labels for all
#     /api/v1/* domains (fees, health, scholarship, hostel, …).
#   - etl-worker  (docker-compose.yml)            :3010
#   - 9 standalone backend services (NON-PROD lab, :3020–3028) live in
#     scrape-lab/lab-services.yml and load ONLY when the lab services compose
#     runs (PRC-M313); the canonical stack must not carry permanently-down
#     targets that keep ServiceDown firing.
#
# Next.js apps (web, portals, admin console) expose /api/health only — they are
# monitored via the gateway's http_* metrics and the availability probes, not
# scraped. Anything else listed here would be a permanently-down target.
#
# Loads alert rules from ./alerts/*.yml and forwards to Alertmanager :9093.
# Hostnames resolve through the shared `proctira` docker network; Kubernetes
# deployments swap static_configs for the kubernetes_sd_configs block at the
# bottom (pods carry prometheus.io/scrape annotations from the Helm chart).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: proctira
    # Prometheus has no env expansion; per-environment values are set by the
    # deployment (kustomize patch / Helm values), not by editing this file.
    env: dev

rule_files:
  - alerts/availability.yml
  - alerts/latency.yml
  - alerts/error_rate.yml
  - alerts/saturation.yml
  - alerts/queue_lag.yml
  - alerts/critical_journeys.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# PRC-M313: optional scrape jobs. The observability compose mounts
# ${PROMETHEUS_EXTRA_SCRAPE_DIR:-./scrape.d} here (empty for the canonical
# stack; set it to ./scrape-lab with the lab services compose).
scrape_config_files:
  - scrape.d/*.yml

scrape_configs:
  # ─── Edge / Gateway ────────────────────────────────────────────────────────
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000']
        labels:
          service: api-gateway
          team: engineering

  # ─── ETL ───────────────────────────────────────────────────────────────────
  - job_name: etl
    metrics_path: /metrics
    static_configs:
      - targets: ['etl-worker:3010']
        labels:
          service: etl
          team: ops

  # ─── Self-monitoring ───────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
          team: ops

  # ─── Kubernetes (Helm deployments) ─────────────────────────────────────────
  # Pods rendered by infrastructure/helm/proctira-service carry
  # prometheus.io/scrape|port|path annotations (Fastify services only). The
  # chart injects METRICS_BEARER_TOKEN from the proctira-metrics Secret. Mount
  # the same external-secret value in the Prometheus namespace at the path
  # below; the Secret is never placed in annotations or this config.
  - job_name: kubernetes-pods
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/proctira-metrics/token
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [proctira-staging, proctira-production]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
