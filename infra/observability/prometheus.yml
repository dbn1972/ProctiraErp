# Prometheus configuration for the ProctiraERP Unified Platform (G-725).
#
# Honest scrape inventory — every target below is a process that actually
# registers `@proctira/observability` and serves GET /metrics:
#
#   - api-gateway (docker-compose.yml)            :3000  — mounts every domain
#     plugin in-process, so gateway metrics carry `route` labels for all
#     /api/v1/* domains (fees, health, scholarship, hostel, …).
#   - etl-worker  (docker-compose.yml)            :3010
#   - 9 standalone backend services
#     (infrastructure/docker/docker-compose.services.yml) :3020–3028
#
# Next.js apps (web, portals, admin console) expose /api/health only — they are
# monitored via the gateway's http_* metrics and the availability probes, not
# scraped. Anything else listed here would be a permanently-down target.
#
# Loads alert rules from ./alerts/*.yml and forwards to Alertmanager :9093.
# Hostnames resolve through the shared `proctira` docker network; Kubernetes
# deployments swap static_configs for the kubernetes_sd_configs block at the
# bottom (pods carry prometheus.io/scrape annotations from the Helm chart).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: proctira
    # Prometheus has no env expansion; per-environment values are set by the
    # deployment (kustomize patch / Helm values), not by editing this file.
    env: dev

rule_files:
  - alerts/availability.yml
  - alerts/latency.yml
  - alerts/error_rate.yml
  - alerts/saturation.yml
  - alerts/queue_lag.yml
  - alerts/critical_journeys.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ─── Edge / Gateway ────────────────────────────────────────────────────────
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000']
        labels:
          service: api-gateway
          team: engineering

  # ─── ETL ───────────────────────────────────────────────────────────────────
  - job_name: etl
    metrics_path: /metrics
    static_configs:
      - targets: ['etl-worker:3010']
        labels:
          service: etl
          team: ops

  # ─── Standalone backend services (docker-compose.services.yml) ─────────────
  - job_name: institution
    metrics_path: /metrics
    static_configs:
      - targets: ['institution-service:3020']
        labels: { service: institution, team: engineering }

  - job_name: student
    metrics_path: /metrics
    static_configs:
      - targets: ['student-service:3021']
        labels: { service: student, team: engineering }

  - job_name: staff
    metrics_path: /metrics
    static_configs:
      - targets: ['staff-service:3022']
        labels: { service: staff, team: engineering }

  - job_name: assessment
    metrics_path: /metrics
    static_configs:
      - targets: ['assessment-service:3023']
        labels: { service: assessment, team: engineering }

  - job_name: attendance
    metrics_path: /metrics
    static_configs:
      - targets: ['attendance-service:3024']
        labels: { service: attendance, team: engineering }

  - job_name: examination
    metrics_path: /metrics
    static_configs:
      - targets: ['examination-service:3025']
        labels: { service: examination, team: engineering }

  - job_name: workflow
    metrics_path: /metrics
    static_configs:
      - targets: ['workflow-service:3026']
        labels: { service: workflow, team: engineering }

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:3027']
        labels: { service: notification, team: engineering }

  - job_name: report
    metrics_path: /metrics
    static_configs:
      - targets: ['report-service:3028']
        labels: { service: report, team: engineering }

  # ─── Self-monitoring ───────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
          team: ops

  # ─── Kubernetes (Helm deployments) ─────────────────────────────────────────
  # Pods rendered by infrastructure/helm/proctira-service carry
  # prometheus.io/scrape|port|path annotations (Fastify services only). This
  # job is inert outside a cluster (no API server → no targets).
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [proctira-staging, proctira-production]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
