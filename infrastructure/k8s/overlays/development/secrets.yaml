# Development-only placeholder secrets (G-703). Never apply to staging/prod;
# those overlays pull real values through an ExternalSecret.
apiVersion: v1
kind: Secret
metadata:
  name: proctira-secrets
  labels:
    app.kubernetes.io/part-of: proctira-platform
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://proctira:proctira_dev@postgres:5432/proctira'
  REDIS_URL: 'redis://redis:6379'
  KAFKA_BROKERS: 'kafka:9092'
  RABBITMQ_URL: 'amqp://proctira:proctira_dev@rabbitmq:5672'
  # 48 chars so the gateway length gate passes even when NODE_ENV is flipped.
  JWT_SECRET: 'dev-only-jwt-secret-not-for-production-0123456789ab'
  COOKIE_SECRET: 'dev-only-cookie-secret-not-for-production-0123456789'
  S3_ACCESS_KEY: 'minioadmin'
  S3_SECRET_KEY: 'minioadmin'
