# G-703 / G-724: real secrets come from the cluster secret store via
# external-secrets-operator (https://external-secrets.io). The store name and
# remote keys are cluster conventions; adjust `secretStoreRef` per cluster.
#
# W1-DATA-01 (REQUIRED): the remote value for DATABASE_URL MUST be a connection
# string for the non-owner runtime role `proctira_app` (NOSUPERUSER,
# NOBYPASSRLS, owns no application tables). Never point pods at the migrator /
# table-owner (`proctira`) or a BYPASSRLS backup role. Deploy proves this via
# tools/scripts/assert-runtime-database-role.sh against the actual secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: proctira-secrets
  labels:
    app.kubernetes.io/part-of: proctira-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proctira-production
  target:
    name: proctira-secrets
    creationPolicy: Owner
  data:
    # W1-DATA-01: must resolve to postgresql://proctira_app:…@…/… (not migrator).
    - secretKey: DATABASE_URL
      remoteRef: { key: proctira/production/database-url }
    - secretKey: REDIS_URL
      remoteRef: { key: proctira/production/redis-url }
    - secretKey: KAFKA_BROKERS
      remoteRef: { key: proctira/production/kafka-brokers }
    - secretKey: RABBITMQ_URL
      remoteRef: { key: proctira/production/rabbitmq-url }
    - secretKey: JWT_SECRET
      remoteRef: { key: proctira/production/jwt-secret }
    - secretKey: JWT_SECRET_PREVIOUS
      remoteRef: { key: proctira/production/jwt-secret-previous }
    - secretKey: COOKIE_SECRET
      remoteRef: { key: proctira/production/cookie-secret }
    - secretKey: PHI_ENCRYPTION_KEY
      remoteRef: { key: proctira/production/phi-encryption-key }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: proctira/production/s3-access-key }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: proctira/production/s3-secret-key }
