apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proctira

resources:
  - ../../base
  - external-secret.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml

# W1-OPS-08 — pin all service images via shared image-tag component
# W1-OPS-16 — do NOT include components/split-domain-services (canonical in-process)
components:
  - ../../components/image-tag

patches:
  # ---------------------------------------------------------------------------
  # W1-OPS-17 — Production replicas / HPA (must match production-replica-policy)
  # Canonical policy: infrastructure/ops/production-replica-policy.yaml
  # ---------------------------------------------------------------------------
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: etl-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: registration-portal
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: public-website
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: admin-console
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: developer-portal
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: HorizontalPodAutoscaler
      name: web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
  - target:
      kind: HorizontalPodAutoscaler
      name: etl-worker
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 10
  # Production ConfigMap overrides
  - target:
      kind: ConfigMap
      name: proctira-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: production
      - op: replace
        path: /data/LOG_LEVEL
        value: warn
      - op: replace
        path: /data/TENANT_BASE_DOMAIN
        value: proctira.io
