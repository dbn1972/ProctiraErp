apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proctira

resources:
  - ../../base
  - external-secret.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml

# W1-OPS-08 — pin all service images via shared image-tag component
# W1-OPS-16 — do NOT include components/split-domain-services (canonical in-process)
components:
  - ../../components/image-tag

patches:
  # Production replicas — canonical services only
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  # Production HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  # Production ConfigMap overrides
  - target:
      kind: ConfigMap
      name: proctira-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: production
      - op: replace
        path: /data/LOG_LEVEL
        value: warn
      - op: replace
        path: /data/TENANT_BASE_DOMAIN
        value: proctira.io
