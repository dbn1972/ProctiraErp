# W1-OPS-17 — PDBs coherent with production-replica-policy.yaml
# minAvailable < replicas so voluntary disruptions remain possible.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: proctira
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
