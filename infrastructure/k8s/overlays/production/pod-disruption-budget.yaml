# W1-OPS-17 — PDBs coherent with production-replica-policy.yaml
# minAvailable < replicas so voluntary disruptions remain possible.
#
# PRC-L567: strategic-merge PATCHES (kustomization.yaml `patches: - path:`) over
# the base PDBs of the same name, not extra resources. Two PDBs selecting the
# same pods make the eviction API refuse every eviction, so node drains broke.
# etl-worker has no base PDB and stays a resource (etl-worker-pdb.yaml).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: proctira
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: proctira
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registration-portal
  namespace: proctira
  labels:
    app.kubernetes.io/name: registration-portal
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registration-portal
---
