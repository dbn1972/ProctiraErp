apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: proctira
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: proctira
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registration-portal-pdb
  namespace: proctira
  labels:
    app.kubernetes.io/name: registration-portal
    app.kubernetes.io/part-of: proctira-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registration-portal
---
# W1-OPS-16: PDBs for split-domain services removed from production overlay.
# Reintroduce only with components/split-domain-services (lab).
