# G-703 / G-724: real secrets come from the cluster secret store via
# external-secrets-operator (https://external-secrets.io). The store name and
# remote keys are cluster conventions; adjust `secretStoreRef` per cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: proctira-secrets
  labels:
    app.kubernetes.io/part-of: proctira-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proctira-staging
  target:
    name: proctira-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: proctira/staging/database-url }
    - secretKey: REDIS_URL
      remoteRef: { key: proctira/staging/redis-url }
    - secretKey: KAFKA_BROKERS
      remoteRef: { key: proctira/staging/kafka-brokers }
    - secretKey: RABBITMQ_URL
      remoteRef: { key: proctira/staging/rabbitmq-url }
    - secretKey: JWT_SECRET
      remoteRef: { key: proctira/staging/jwt-secret }
    - secretKey: JWT_SECRET_PREVIOUS
      remoteRef: { key: proctira/staging/jwt-secret-previous }
    - secretKey: COOKIE_SECRET
      remoteRef: { key: proctira/staging/cookie-secret }
    - secretKey: PHI_ENCRYPTION_KEY
      remoteRef: { key: proctira/staging/phi-encryption-key }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: proctira/staging/s3-access-key }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: proctira/staging/s3-secret-key }
