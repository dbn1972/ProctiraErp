apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-worker
  namespace: proctira
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/part-of: proctira-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: etl-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-worker
        app.kubernetes.io/part-of: proctira-platform
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: etl-worker
          image: proctira/etl-worker:sha-pending
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 3010
              protocol: TCP
          env:
            - name: ETL_WORKER_PORT
              value: '3010'
            - name: ETL_WORKER_HOST
              value: '0.0.0.0'
            # PRC-M279: explicit least-privilege keys instead of the whole platform Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: proctira-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: proctira-secrets
                  key: KAFKA_BROKERS
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: proctira-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: proctira-secrets
                  key: RABBITMQ_URL
          envFrom:
            - configMapRef:
                name: proctira-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
