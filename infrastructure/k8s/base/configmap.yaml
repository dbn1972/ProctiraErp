apiVersion: v1
kind: ConfigMap
metadata:
  name: proctira-config
  namespace: proctira
  labels:
    app.kubernetes.io/part-of: proctira-platform
data:
  NODE_ENV: 'production'
  LOG_LEVEL: 'info'
  JWT_ISSUER: 'proctira-platform'
  JWT_AUDIENCE: 'proctira-api'
  # Non-secret duration; JWT_ACCESS_TOKEN_EXPIRES_IN remains a legacy app alias.
  JWT_ACCESS_TTL: '15m'
  RATE_LIMIT_WINDOW_MS: '60000'
  RATE_LIMIT_MAX_REQUESTS: '100'
  TENANT_BASE_DOMAIN: 'proctira.io'
  TENANT_HEADER_NAME: 'x-tenant-id'
  S3_REGION: 'us-east-1'
  S3_FORCE_PATH_STYLE: 'true'
  # PRC-M524: left empty at base; every deployed overlay must patch these to
  # the real tenant/portal domains and the ingress controller CIDR (the
  # gateway's CORS plugin takes a literal origin list; no wildcard-subdomain
  # matching). The api-gateway refuses to boot in a deployed environment
  # (NODE_ENV other than development/test, or APP_ENV=staging/production)
  # when either value is empty or CORS_ORIGINS contains `*`
  # (apps/api-gateway/src/config.ts resolveCorsOrigins/resolveTrustedProxyCidrs).
  CORS_ORIGINS: ''
  TRUSTED_PROXY_CIDRS: ''
# G-703: the `proctira-secrets` Secret is NOT shipped from base. Each overlay
# must supply it — development uses overlays/development/secrets.yaml (local
# placeholders), staging/production use an ExternalSecret
# (overlays/<env>/external-secret.yaml) that pulls from the cluster secret store.
# The api-gateway refuses to boot in production with a missing/placeholder
# JWT_SECRET (apps/api-gateway/src/config.ts).
