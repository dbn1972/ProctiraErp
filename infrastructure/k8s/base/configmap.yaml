apiVersion: v1
kind: ConfigMap
metadata:
  name: proctira-config
  namespace: proctira
  labels:
    app.kubernetes.io/part-of: proctira-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  JWT_ISSUER: "proctira-platform"
  JWT_AUDIENCE: "proctira-api"
  JWT_ACCESS_TOKEN_EXPIRES_IN: "15m"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  TENANT_BASE_DOMAIN: "proctira.io"
  TENANT_HEADER_NAME: "x-tenant-id"
  S3_REGION: "us-east-1"
  S3_FORCE_PATH_STYLE: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: proctira-secrets
  namespace: proctira
  labels:
    app.kubernetes.io/part-of: proctira-platform
type: Opaque
stringData:
  # These values MUST be overridden in each environment.
  # In production, use sealed-secrets or external-secrets-operator.
  DATABASE_URL: "postgresql://proctira:CHANGE_ME@postgres:5432/proctira"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  RABBITMQ_URL: "amqp://proctira:CHANGE_ME@rabbitmq:5672"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  COOKIE_SECRET: "CHANGE_ME_IN_PRODUCTION"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
