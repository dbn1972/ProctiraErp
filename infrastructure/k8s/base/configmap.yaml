apiVersion: v1
kind: ConfigMap
metadata:
  name: proctira-config
  namespace: proctira
  labels:
    app.kubernetes.io/part-of: proctira-platform
data:
  NODE_ENV: 'production'
  LOG_LEVEL: 'info'
  JWT_ISSUER: 'proctira-platform'
  JWT_AUDIENCE: 'proctira-api'
  JWT_ACCESS_TOKEN_EXPIRES_IN: '15m'
  RATE_LIMIT_WINDOW_MS: '60000'
  RATE_LIMIT_MAX_REQUESTS: '100'
  TENANT_BASE_DOMAIN: 'proctira.io'
  TENANT_HEADER_NAME: 'x-tenant-id'
  S3_REGION: 'us-east-1'
  S3_FORCE_PATH_STYLE: 'true'
# G-703: the `proctira-secrets` Secret is NOT shipped from base. Each overlay
# must supply it — development uses overlays/development/secrets.yaml (local
# placeholders), staging/production use an ExternalSecret
# (overlays/<env>/external-secret.yaml) that pulls from the cluster secret store.
# The api-gateway refuses to boot in production with a missing/placeholder
# JWT_SECRET (apps/api-gateway/src/config.ts).
