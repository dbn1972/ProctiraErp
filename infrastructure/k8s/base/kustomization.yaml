apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proctira

resources:
  - namespace.yaml
  - configmap.yaml
  # Frontend applications
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  - registration-portal/deployment.yaml
  - registration-portal/service.yaml
  - public-website/deployment.yaml
  - public-website/service.yaml
  - admin-console/deployment.yaml
  - admin-console/service.yaml
  - developer-portal/deployment.yaml
  - developer-portal/service.yaml
  # API Gateway (canonical — in-process domains; W1-OPS-16)
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - api-gateway/hpa.yaml
  # ETL Worker
  - etl-worker/deployment.yaml
  - etl-worker/service.yaml
  - etl-worker/hpa.yaml
  # Ingress
  - ingress.yaml

# Split-domain Deployments (institution/student/…) live under
# ../components/split-domain-services — NON-PROD / lab only (W1-OPS-16).

commonLabels:
  app.kubernetes.io/part-of: proctira-platform
  app.kubernetes.io/managed-by: kustomize
