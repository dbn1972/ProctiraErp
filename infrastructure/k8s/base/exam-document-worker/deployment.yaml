apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-document-worker
  namespace: proctira
  labels:
    app.kubernetes.io/name: exam-document-worker
    app.kubernetes.io/part-of: proctira-platform
    app.kubernetes.io/component: worker
spec:
  # PRC-H051: durable queue consumer for exam document generation jobs.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: exam-document-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exam-document-worker
        app.kubernetes.io/part-of: proctira-platform
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Allow in-flight job to drain before SIGKILL (worker awaits handler).
      terminationGracePeriodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: exam-document-worker
          image: proctira/exam-document-worker:sha-pending
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: health
              containerPort: 3025
              protocol: TCP
          env:
            - name: EXAM_DOCUMENT_WORKER_PORT
              value: '3025'
            - name: EXAM_DOCUMENT_WORKER_HOST
              value: '0.0.0.0'
            - name: QUEUE_BACKEND
              value: 'rabbitmq'
          envFrom:
            - configMapRef:
                name: proctira-config
            - secretRef:
                name: proctira-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Fails when the broker connection is down (computeReadiness).
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
