apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proctira-ingress
  namespace: proctira
  labels:
    app.kubernetes.io/part-of: proctira-platform
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
    # Rate limiting at ingress level
    nginx.ingress.kubernetes.io/limit-rps: '50'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, PATCH, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Tenant-ID,X-Correlation-ID'
    # Compression negotiation (Task 55.6 / Requirement 39):
    # The web app and api-gateway emit pre-compressed `.br` and `.gz`
    # siblings during build and the upstream (Next.js standalone /
    # @fastify/static) selects the right encoding based on the
    # client's `Accept-Encoding`. The ingress must:
    #   1. forward `Accept-Encoding` to the upstream untouched
    #      (default NGINX behavior — kept here as documentation)
    #   2. preserve the upstream's `Content-Encoding` and `Vary`
    #      response headers so caches do not collapse the gzip /
    #      brotli / identity variants into a single cache entry
    #   3. NOT recompress upstream responses (would break the
    #      negotiation and waste CPU on already-compressed payloads)
    # `Vary: Accept-Encoding` is added defensively in case any upstream
    # forgets to set it.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      gzip off;
      proxy_set_header Accept-Encoding $http_accept_encoding;
      add_header Vary "Accept-Encoding" always;
    # TLS via cert-manager
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - '*.proctira.io'
        - 'proctira.io'
      secretName: proctira-tls
  rules:
    # API Gateway — handles all /api/* traffic
    - host: '*.proctira.io'
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
    # Web application — main authenticated app
    - host: '*.proctira.io'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    # Registration portal — public registration
    - host: 'register.proctira.io'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registration-portal
                port:
                  name: http
    # Public website — marketing/landing pages
    - host: 'proctira.io'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-website
                port:
                  name: http
    # Admin console
    - host: 'admin.proctira.io'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-console
                port:
                  name: http
    # Developer portal
    - host: 'developers.proctira.io'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: developer-portal
                port:
                  name: http
