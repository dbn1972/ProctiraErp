apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-portal
  namespace: proctira
  labels:
    app.kubernetes.io/name: developer-portal
    app.kubernetes.io/part-of: proctira-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: developer-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: developer-portal
        app.kubernetes.io/part-of: proctira-platform
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: developer-portal
          image: proctira/developer-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
              protocol: TCP
          env:
            - name: PORT
              value: '3005'
            - name: HOSTNAME
              value: '0.0.0.0'
            - name: NODE_ENV
              value: 'production'
          envFrom:
            - configMapRef:
                name: proctira-config
            - secretRef:
                name: proctira-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
