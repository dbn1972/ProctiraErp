apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: proctira
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/part-of: proctira-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-service
        app.kubernetes.io/part-of: proctira-platform
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: report-service
          image: proctira/report-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3028
              protocol: TCP
          env:
            - name: PORT
              value: '3028'
            - name: HOST
              value: '0.0.0.0'
            - name: SERVICE_NAME
              value: 'report-service'
          envFrom:
            - configMapRef:
                name: proctira-config
            - secretRef:
                name: proctira-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
