# =============================================================================
# Development environment overrides
# =============================================================================
# Usage: helm install proctira ./proctira-platform -f values-development.yaml

global:
  environment: development
  domain: proctira.localhost
  nodeEnv: development
  logLevel: debug

ingress:
  enabled: false

apiGateway:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podDisruptionBudget:
    enabled: false

web:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  podDisruptionBudget:
    enabled: false

etlWorker:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

registrationPortal:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

