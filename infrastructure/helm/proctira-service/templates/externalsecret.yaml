{{- if eq (include "proctira-service.externalSecretRendered" .) "true" }}
{{- $sharedKeys := include "proctira-service.externalSecretKeys" . | fromJsonArray }}
# Requires External Secrets Operator (external-secrets.io) in the cluster.
# Materialises a plain Secret consumed by the Deployment via envFrom, so no
# provider credentials or secret values ever live in this chart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "proctira-service.fullname" . }}
  labels:
    {{- include "proctira-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "proctira-service.externalSecretTarget" . }}
    creationPolicy: Owner
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.externalSecret.dataFrom | nindent 4 }}
  {{- end }}
  {{- if or .Values.externalSecret.data $sharedKeys }}
  data:
    {{- range $sharedKeys }}
    # PRC-M279: allowlisted key from the shared bundle.
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.sharedRemoteKey }}
        property: {{ . }}
    {{- end }}
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
