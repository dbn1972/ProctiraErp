# Default values for proctira-service (overridden per env + --set from deploy.yml).
environment: development

image:
  # W1-OPS-08 — canonical <registry>/<owner>/proctira/<service>; never mutable :latest.
  # deploy.yml and rollback.yml --set image.repository via tools/scripts/image-repository.sh.
  # Default is non-runnable until that override and image.tag=sha-<gitsha> (or digest).
  repository: ghcr.io/owner/proctira/api-gateway
  tag: sha-pending
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  name: api-gateway
  type: ClusterIP
  port: 80
  targetPort: 3000

replicaCount: 1
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    # W1-OPS-09 progressive baseline: never drop ready pods before replacements.
    maxUnavailable: 0

# ---------------------------------------------------------------------------
# Progressive delivery hook (W1-OPS-09). Off by default — RollingUpdate above
# is the ship path. When a canary controller (Flagger / Argo Rollouts / mesh)
# is installed, enable canary to stamp annotations controllers can select.
# ---------------------------------------------------------------------------
progressiveDelivery:
  canary:
    enabled: false
    weight: 10
    # Extra annotations merged onto the Deployment metadata (not pod template).
    annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probe defaults preserve legacy /health for split/lab services. The canonical
# api-gateway profile separates cheap liveness from schema-aware readiness.
healthPath: /health
livenessPath: /health
readinessPath: /health
startupPath: /health
serviceProfiles:
  api-gateway:
    livenessPath: /health/live
    readinessPath: /health/ready
    startupPath: /health/live
    metrics: true
  web: { healthPath: /api/health, metrics: false }
  registration-portal: { healthPath: /api/health, metrics: false }
  admin-console: { healthPath: /api/health, metrics: false }
  developer-portal: { healthPath: /api/health, metrics: false }
  install-wizard: { healthPath: /api/health, metrics: false }
  public-website: { healthPath: /api/health, metrics: false }

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Gives slow cold starts (Next.js, Prisma engine) time before liveness kicks in.
startupProbe:
  periodSeconds: 5
  failureThreshold: 24

# Plain (non-secret) env vars rendered inline.
env: {}

# Names of pre-existing Secrets to mount via envFrom (DATABASE_URL, JWT_SECRET...).
envFromSecrets: []
# ---------------------------------------------------------------------------
# PRC-M011 — api-gateway auth boot policy. The gateway image runs with
# NODE_ENV=production, so it refuses to boot unless Keycloak is configured
# (KEYCLOAK_ISSUER + KEYCLOAK_CLIENT_ID) and KEYCLOAK_REDIRECT_URI /
# NEXT_PUBLIC_WEB_URL are explicit, non-localhost URLs. Non-secret ids/URLs
# are set per environment here; each renders only for service.name=api-gateway
# and only when non-empty. KEYCLOAK_CLIENT_SECRET is a secret: put it in the
# env Secret (envFromSecrets / externalSecret), never in values. See
# docs/runbooks/api-gateway.md "Auth boot prerequisites".
# ---------------------------------------------------------------------------
gatewayAuth:
  # KEYCLOAK_ISSUER, e.g. https://auth.<domain>/realms/proctira
  keycloakIssuer: ''
  # KEYCLOAK_CLIENT_ID (the repo realm defines `proctira-gateway`)
  keycloakClientId: ''
  # KEYCLOAK_REALM (optional; the gateway defaults to `proctira`)
  keycloakRealm: ''
  # KEYCLOAK_AUDIENCE (optional; tokens must carry it in aud/azp)
  keycloakAudience: ''
  # KEYCLOAK_REDIRECT_URI, e.g. https://api.<domain>/api/v1/auth/callback
  keycloakRedirectUri: ''
  # NEXT_PUBLIC_WEB_URL: web origin the gateway redirects to after sign-in
  webUrl: ''

# ---------------------------------------------------------------------------
# Pod hardening (G-724). Images run as uid 1001 (nodejs/nextjs users) with a
# read-only root FS; /tmp is an emptyDir mounted by the Deployment.
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ''
  annotations: {}
  automountToken: false

podAnnotations: {}

# W1-SEC-07: production/staging override the Secret and scrape peer below.
# The same token value must be mounted into Prometheus as credentials_file;
# never place it in this values file or pod annotations.
metrics:
  enabled: true
  path: /metrics
  bearerTokenSecret:
    name: ''
    key: token
  networkPolicy:
    enabled: false
    namespace: monitoring
    podSelector:
      matchLabels: {}

# ---------------------------------------------------------------------------
# Availability (G-724). Off by default so single-node dev clusters stay simple;
# values-production.yaml turns them on.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# NetworkPolicy (G-724). Default-deny beyond same-namespace + DNS; list the
# ingress-controller namespaces and any external egress CIDRs. Metrics ingress
# is a separate pod-selected peer under metrics.networkPolicy.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  ingressNamespaces: []
  egressCIDRs: []
  extraIngress: []
  extraEgress: []

# ---------------------------------------------------------------------------
# ExternalSecret (G-724, opt-in). Requires External Secrets Operator.
# ---------------------------------------------------------------------------
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ''
    kind: ClusterSecretStore
  # Secret name ESO writes; defaults to <fullname>-env.
  targetName: ''
  # Either pull a whole provider object ...
  dataFrom: []
  # ... or map individual keys.
  data: []
  #  - secretKey: DATABASE_URL
  #    remoteKey: proctira/production/api-gateway
  #    property: DATABASE_URL
  # PRC-M279: least privilege per workload. When `sharedRemoteKey` is set,
  # only the keys listed under `serviceKeys[service.name]` are copied out of
  # that provider object (one data entry per key, never the whole bundle).
  # A service missing from the map fails the render (fail closed); an empty
  # list renders no ExternalSecret and no secret envFrom at all.
  #
  # #555 review #3: the gateway runs every domain package in-process, so its
  # list covers every secret those packages read in production.
  # tools/scripts/check-gateway-secret-allowlist.mjs (actionlint workflow)
  # fails CI when gateway code reads a secret-bearing env var that is in
  # neither serviceKeys nor optionalServiceKeys. Every serviceKeys entry must
  # exist in the shared bundle: ESO reports a sync error for a missing
  # property, the pod does not start, and `helm --atomic` rolls back. That
  # turns a missing key into a deploy-time failure, not a request-time one.
  sharedRemoteKey: ''
  serviceKeys:
    api-gateway:
      - DATABASE_URL
      - REDIS_URL
      - KAFKA_BROKERS
      - RABBITMQ_URL
      - JWT_SECRET
      - JWT_SECRET_PREVIOUS
      - COOKIE_SECRET
      - PHI_ENCRYPTION_KEY
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      # Production-required by mounted packages (fail closed without them).
      - KEYCLOAK_CLIENT_SECRET
      - KEYCLOAK_ADMIN_CLIENT_SECRET
      - SCHOLARSHIP_DOC_URL_SECRET
      - TRANSCRIPT_SIGNING_SECRET
      - SIS_BOARD_EXPORT_SIGNING_SECRET
      - REPORT_DOWNLOAD_SIGNING_SECRET
      - LMS_FILE_SIGNING_SECRET
      - ADMISSIONS_OFFER_SIGNING_SECRET
      - ETL_CONNECTOR_SECRET_KEY
      - WEBHOOK_SIGNING_KMS_KEY_ID
    etl-worker: [DATABASE_URL, KAFKA_BROKERS, REDIS_URL, RABBITMQ_URL]
    # NEW-g3_infra_tools-001 / PRC-M279: durable exam-document consumer. Reads
    # only the PG URL (examination/document/blob repos) and the broker URL; it
    # never signs JWTs or decrypts PHI, so no JWT_SECRET / PHI_ENCRYPTION_KEY.
    exam-document-worker: [DATABASE_URL, RABBITMQ_URL]
    web: []
    registration-portal: []
    admin-console: []
  # Mode-dependent secrets the gateway reads only when the matching feature is
  # configured. They are NOT rendered (a missing property would fail ESO sync
  # for every deployment). When a cluster enables the feature, copy the keys
  # into serviceKeys for that environment's values file.
  optionalServiceKeys:
    api-gateway:
      # PHI envelope encryption in KMS mode (instead of PHI_ENCRYPTION_KEY).
      - PHI_KMS_KEY_ID
      - PHI_KMS_WRAPPED_ROOT_KEY
      # Transcript signing via KMS (instead of TRANSCRIPT_SIGNING_SECRET).
      - TRANSCRIPT_SIGNING_KMS_KEY_REF
      - TRANSCRIPT_SIGNING_KEY_ID
      # Read replica and Kafka SASL, when used.
      - POSTGRES_READ_REPLICA_URL
      - KAFKA_SASL_USERNAME
      - KAFKA_SASL_PASSWORD
    developer-portal: []
    install-wizard: []
    public-website: []
    dr-tools: [DATABASE_URL, S3_ACCESS_KEY, S3_SECRET_KEY]
    # W1-OPS-16 lab split-domain services: backend runtime keys, no PHI key.
    institution:
      &labKeys [
        DATABASE_URL,
        REDIS_URL,
        KAFKA_BROKERS,
        RABBITMQ_URL,
        JWT_SECRET,
        JWT_SECRET_PREVIOUS,
      ]
    student: *labKeys
    staff: *labKeys
    assessment: *labKeys
    attendance: *labKeys
    examination: *labKeys
    workflow: *labKeys
    notification: *labKeys
    report: *labKeys

extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
