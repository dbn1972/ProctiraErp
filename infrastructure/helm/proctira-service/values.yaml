# Default values for proctira-service (overridden per env + --set from deploy.yml).
environment: development

image:
  repository: ghcr.io/proctira/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: api-gateway
  type: ClusterIP
  port: 80
  targetPort: 3000

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

env: {}
