environment: staging
replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Exercise the same authenticated direct-pod scrape path used in production.
metrics:
  enabled: true
  path: /metrics
  bearerTokenSecret:
    name: proctira-metrics
    key: token
  networkPolicy:
    enabled: true
    namespace: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus

networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
  egressCIDRs:
    - cidr: 0.0.0.0/0
      except:
        - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
