# =============================================================================
# Staging environment overrides
# =============================================================================
# Usage: helm install proctira ./proctira-platform -f values-staging.yaml

topology:
  mode: in-process

global:
  environment: staging
  domain: staging.proctira.io
  nodeEnv: production
  logLevel: info

ingress:
  enabled: true
  hosts:
    api: 'api.staging.proctira.io'
    web: '*.staging.proctira.io'
    register: 'register.staging.proctira.io'
    public: 'staging.proctira.io'
    admin: 'admin.staging.proctira.io'
    developers: 'developers.staging.proctira.io'
  tls:
    enabled: true
    secretName: proctira-staging-tls

apiGateway:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

etlWorker:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

registrationPortal:
  replicaCount: 2

publicWebsite:
  replicaCount: 2

adminConsole:
  replicaCount: 1

developerPortal:
  replicaCount: 1

# -- Backend domain services (staging overrides)
institutionService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

studentService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

staffService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

assessmentService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

attendanceService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

examinationService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

workflowService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

notificationService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

reportService:
  enabled: false
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

config:
  tenantBaseDomain: staging.proctira.io

# W1-OPS-19 — sandbox: explicit dry-run (RETENTION_DRY_RUN=1); never inherit unset.
dr:
  enabled: true
  phiRetention:
    apply: false
