config:
  tenantBaseDomain: proctira.io
  rateLimitMaxRequests: "200"

# -- Infrastructure scalability settings (production)
kafka:
  replicationFactor: 3
  partitionCount: 12
  minInsyncReplicas: 2
  retentionMs: "604800000"  # 7 days
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

redis:
  cluster:
    enabled: true
    replicas: 3
  sentinel:
    enabled: true
    quorum: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgresql:
  primary:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
  readReplicas:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
  readReplicaUrl: "${POSTGRES_READ_REPLICA_URL}"

# Use external-secrets-operator in production
secrets:
  existingSecret: proctira-prod-secrets
