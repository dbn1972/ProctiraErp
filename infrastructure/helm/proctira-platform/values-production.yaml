# =============================================================================
# Production environment overrides
# =============================================================================
# Usage: helm install proctira ./proctira-platform -f values-production.yaml
#
# IMPORTANT: Secrets should be managed via external-secrets-operator or
# sealed-secrets. Set secrets.existingSecret to reference a pre-created secret.

topology:
  mode: in-process # W1-OPS-16 canonical

global:
  environment: production
  domain: proctira.io
  nodeEnv: production
  logLevel: warn

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/limit-rps: '100'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    api: 'api.proctira.io'
    web: '*.proctira.io'
    register: 'register.proctira.io'
    public: 'proctira.io'
    admin: 'admin.proctira.io'
    developers: 'developers.proctira.io'
  tls:
    enabled: true
    secretName: proctira-prod-tls

apiGateway:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 1Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

web:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 65
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

# W1-OPS-17 — HA floors aligned with infrastructure/ops/production-replica-policy.yaml
