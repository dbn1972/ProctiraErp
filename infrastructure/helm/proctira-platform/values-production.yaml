  # keycloakRedirectUri: https://api.proctira.io/api/v1/auth/callback); none may
  # point at localhost. KEYCLOAK_CLIENT_SECRET goes in existingSecret proctira-prod-secrets.
  auth:
    keycloakIssuer: ''
    keycloakClientId: proctira-gateway
    keycloakRedirectUri: ''
    webUrl: ''
  rateLimitMaxRequests: '200'

# -- Infrastructure scalability settings (production)
kafka:
  replicationFactor: 3
  partitionCount: 12
  minInsyncReplicas: 2
  retentionMs: '604800000' # 7 days
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 4Gi

redis:
  cluster:
    enabled: true
    replicas: 3
  sentinel:
    enabled: true
    quorum: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

postgresql:
  primary:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 4Gi
  readReplicas:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 4Gi
  readReplicaUrl: '${POSTGRES_READ_REPLICA_URL}'

# Use external-secrets-operator in production.
# W1-DATA-01: the Secret referenced by existingSecret MUST expose DATABASE_URL
# as postgresql://proctira_app:… (non-owner, NOSUPERUSER, NOBYPASSRLS). Helm
# does not rewrite the URL — operators / ExternalSecret remote keys own this.
# Deploy proves it via tools/scripts/assert-runtime-database-role.sh.
secrets:
  existingSecret: proctira-prod-secrets

# W1-OPS-04 — production backups: encrypt at rest + documented offsite + WORM.
# Operator must provision the S3 bucket with Object Lock enabled and place the
# age recipient + S3 credentials in secrets.existingSecret (proctira-prod-secrets).
# Live vault upload is NOT proven by this overlay alone — see OPS_W1_OPS_04_COMPLETE.md.
# W1-OPS-19 — production PHI retention enforces deletion (not dry-run).
dr:
  enabled: true
  # PRC-M599: deploy-platform-helm.sh overrides this with the CI-built sha at
  # deploy time; pin a non-mutable placeholder for a direct install against
  # this file alone.
  image:
    tag: sha-pending
  backup:
    encrypt:
      enabled: true
    offsite:
      enabled: true
      # Documented production offsite target (operator-owned bucket/prefix).
      uri: s3://proctira-prod-pg-backups/logical/
      sse: AES256
      objectLock:
        mode: GOVERNANCE
        retainDays: 30
  phiRetention:
    apply: true
