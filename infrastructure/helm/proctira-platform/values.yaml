# =============================================================================
# ProctiraERP Unified Platform — Helm Values
# =============================================================================
# Override these values per environment using -f values-<env>.yaml or --set flags.

# -- Global settings applied to all services
global:
  # -- Container image registry
  imageRegistry: ''
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Namespace override (defaults to release namespace)
  namespaceOverride: ''
  # -- Environment name (development, staging, production)
  environment: production
  # -- Platform domain (used for ingress and tenant resolution)
  domain: proctira.io
  # -- Node environment
  nodeEnv: production
  # -- Log level (debug, info, warn, error)
  logLevel: info

# -- Multi-tenancy configuration
multiTenancy:
  # -- Enable namespace-per-tenant isolation
  enabled: false
  # -- Base domain for tenant subdomains
  baseDomain: proctira.io
  # -- Header name for tenant identification
  headerName: x-tenant-id

# -- Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Compression negotiation (Task 55.6 / Requirement 39):
    # Disable NGINX-side gzip so upstream pre-compressed `.br` / `.gz`
    # selections survive intact. Forward `Accept-Encoding` and
    # advertise `Vary: Accept-Encoding` so caches keep encoded and
    # identity variants distinct.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      gzip off;
      proxy_set_header Accept-Encoding $http_accept_encoding;
      add_header Vary "Accept-Encoding" always;
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: proctira-tls
  hosts:
    api: 'api.proctira.io'
    web: '*.proctira.io'
    register: 'register.proctira.io'
    public: 'proctira.io'
    admin: 'admin.proctira.io'
    developers: 'developers.proctira.io'

# -- API Gateway service
apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: proctira/api-gateway
    tag: '' # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  env:
    PORT: '3000'
    HOST: '0.0.0.0'
  # -- Rolling update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# -- Web frontend service
web:
  enabled: true
  replicaCount: 2
  image:
    repository: proctira/web
    tag: ''
    pullPolicy: IfNotPresent
