# -- Shared configuration (injected as ConfigMap)
config:
  jwtIssuer: proctira-platform
  jwtAudience: proctira-api
  jwtAccessTokenExpiresIn: '15m'
  rateLimitWindowMs: '60000'
  rateLimitMaxRequests: '100'
  tenantBaseDomain: proctira.io
  tenantHeaderName: x-tenant-id
  s3Region: us-east-1
  s3ForcePathStyle: 'true'

# -- Secrets (use external-secrets-operator in production)
secrets:
  # -- Database connection string (app role; RLS-bound)
  databaseUrl: ''
  # -- Connection string for the BYPASSRLS backup role (G-707). pg_dump as the
  # app role fails under FORCE RLS; see docs/BACKUP_RESTORE.md §3.3.
  backupDatabaseUrl: ''
  # -- W1-OPS-04: age public key for encrypting logical backups at rest.
  backupAgeRecipient: ''
  # -- Redis connection string
  redisUrl: ''
  # -- Kafka broker addresses
  kafkaBrokers: ''
  # -- RabbitMQ connection string
  rabbitmqUrl: ''
  # -- JWT signing secret
  jwtSecret: ''
  # -- Cookie signing secret
  cookieSecret: ''
  # -- S3 access key
  s3AccessKey: ''
  # -- S3 secret key
  s3SecretKey: ''
  # -- Use existing secret instead of creating one
  existingSecret: ''

# -- Service account configuration
serviceAccount:
  create: true
  name: ''
  annotations: {}

# -- Disaster recovery (G-707): scheduled backups + PHI retention.
# Both CronJobs run infrastructure/docker/Dockerfile.dr-tools. With
# dr.backup.encrypt.enabled the CronJob writes age-encrypted artifacts to the
# PVC and optionally pushes a second copy to BACKUP_OFFSITE_URI (S3 SSE). The
# PVC is local retention only — not the sole copy when offsite is enabled.
# Weekly restore drill (.github/workflows/restore-drill.yml) proves the scripts.
dr:
  enabled: true
  # -- IANA time zone for the cron schedules (Kubernetes >= 1.27)
  timeZone: 'UTC'
  # -- Key inside the platform Secret holding the Postgres URL the jobs use.
  # Must reference a role with BYPASSRLS (secrets.backupDatabaseUrl); the app
  # role's DATABASE_URL cannot take a complete dump under FORCE RLS.
  databaseUrlSecretKey: BACKUP_DATABASE_URL
  image:
    repository: proctira/dr-tools
    tag: '' # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  backup:
    enabled: true
    # -- Daily at 02:00 (matches the RPO table in docs/BACKUP_RESTORE.md)
    schedule: '0 2 * * *'
    # -- Prune dumps older than this many days from the volume
    retentionDays: 30
    activeDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 7
    failedJobsHistoryLimit: 3
    # -- Reuse an operator-managed PVC instead of creating one
    existingClaim: ''
    storage:
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClassName: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    # -- W1-OPS-04: encrypt dumps at rest (age). Requires secrets.backupAgeRecipient.
    encrypt:
      enabled: false
      secretKey: BACKUP_AGE_RECIPIENT
    # -- W1-OPS-04: push encrypted artifact to object storage (second copy).
    offsite:
      enabled: false
      uri: '' # s3://bucket/proctira/pg-backups/
      sse: AES256
      sseKmsKeyId: ''
  phiRetention:
    enabled: true
    # -- Weekly, Sunday 03:30
    schedule: '30 3 * * 0'
    # -- false = dry-run (counts only). Flip only after policy sign-off.
