{{- /*
PRC-L565 — DNS-01 ClusterIssuer for the wildcard `*.proctira.io` certificate.

Rendered ONLY when `.Values.certManager.clusterIssuer.enabled` is true. The
wildcard host in `ingress.hosts.web` cannot be satisfied by the HTTP-01
challenge, so a DNS-01 solver is required. This issuer uses Route 53 via IRSA
(a projected service-account role) so no static AWS credentials are stored in
the cluster.

Fails closed: when enabled, the Route 53 hosted zone ID and the IRSA role ARN
are mandatory (`required`). They are WAITING_ON_INPUT (decision register ## 41,
Topic 25), so the issuer stays disabled by default and in production until both
values are supplied together.
*/ -}}
{{- if .Values.certManager.clusterIssuer.enabled -}}
{{- $ci := .Values.certManager.clusterIssuer -}}
{{- $dns01 := $ci.dns01 | default dict -}}
{{- $role := $dns01.role | default dict -}}
{{- $hostedZoneID := required "certManager.clusterIssuer.dns01.hostedZoneID is required when the ClusterIssuer is enabled (PRC-L565 WAITING_ON_INPUT: Route 53 hosted zone ID)" $dns01.hostedZoneID -}}
{{- $roleArn := required "certManager.clusterIssuer.dns01.role.roleArn is required when the ClusterIssuer is enabled (PRC-L565 WAITING_ON_INPUT: IRSA role ARN, no static keys)" $role.roleArn -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $ci.name | quote }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ $ci.acmeServer | quote }}
    email: {{ $ci.email | quote }}
    privateKeySecretRef:
      name: {{ $ci.privateKeySecretRef | quote }}
    solvers:
      - selector:
          dnsZones:
            - {{ trimPrefix "*." (index .Values.ingress.hosts "web") | quote }}
        dns01:
          route53:
            region: {{ $dns01.region | quote }}
            hostedZoneID: {{ $hostedZoneID | quote }}
            # IRSA: cert-manager's ServiceAccount assumes this role to write
            # the _acme-challenge TXT records. Only this `role` is set, so no
            # static AWS credential fields are ever stored in the cluster.
            role: {{ $roleArn | quote }}
{{- end -}}
