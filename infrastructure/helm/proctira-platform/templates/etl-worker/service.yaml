{{- if .Values.etlWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proctira.fullname" . }}-etl-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.etlWorker.service.type }}
  selector:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.etlWorker.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
