apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proctira.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
  # Non-secret duration; the gateway still accepts the legacy env alias.
  JWT_ACCESS_TTL: {{ .Values.config.jwtAccessTokenExpiresIn | quote }}
  RATE_LIMIT_WINDOW_MS: {{ .Values.config.rateLimitWindowMs | quote }}
  RATE_LIMIT_MAX_REQUESTS: {{ .Values.config.rateLimitMaxRequests | quote }}
  TENANT_BASE_DOMAIN: {{ .Values.config.tenantBaseDomain | quote }}
  TENANT_HEADER_NAME: {{ .Values.config.tenantHeaderName | quote }}
  {{- with .Values.config.tenantFallbackSlug }}
  # PRC-H027: web BFF tenant when the Host has no tenant subdomain (dev/single-tenant only).
  TENANT_FALLBACK_SLUG: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.auth }}
  # PRC-M011: api-gateway auth boot prerequisites (non-secret ids/URLs).
  {{- with .keycloakIssuer }}
  KEYCLOAK_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .keycloakClientId }}
  KEYCLOAK_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .keycloakRealm }}
  KEYCLOAK_REALM: {{ . | quote }}
  {{- end }}
  {{- with .keycloakAudience }}
  KEYCLOAK_AUDIENCE: {{ . | quote }}
  {{- end }}
  {{- with .keycloakRedirectUri }}
  KEYCLOAK_REDIRECT_URI: {{ . | quote }}
  {{- end }}
  {{- with .webUrl }}
  NEXT_PUBLIC_WEB_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  S3_REGION: {{ .Values.config.s3Region | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.config.s3ForcePathStyle | quote }}
  {{- if .Values.config.tracing }}
  {{- if .Values.config.tracing.otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.tracing.otlpEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.tracing.otlpTracesEndpoint }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.tracing.otlpTracesEndpoint | quote }}
  {{- end }}
  {{- if .Values.config.tracing.enabled }}
  TRACING_ENABLED: {{ .Values.config.tracing.enabled | quote }}
  {{- end }}
  {{- if .Values.config.tracing.headers }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.config.tracing.headers | quote }}
  {{- end }}
  {{- end }}
