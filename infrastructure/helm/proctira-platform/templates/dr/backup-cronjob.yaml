{{- if and .Values.dr.enabled .Values.dr.backup.enabled }}
{{/*
  W1-OPS-04 — production backups must encrypt at rest, push a documented offsite
  second copy, and declare Object Lock / independent retention. Sandbox may leave
  encrypt/offsite off. Unset / disabled production controls fail closed here.
*/}}
{{- if eq .Values.global.environment "production" }}
{{- if not .Values.dr.backup.encrypt.enabled }}
{{- fail "W1-OPS-04: production backups require dr.backup.encrypt.enabled=true (age at rest). Sandbox may leave encrypt off." }}
{{- end }}
{{- if not .Values.dr.backup.offsite.enabled }}
{{- fail "W1-OPS-04: production backups require dr.backup.offsite.enabled=true with a documented s3:// URI." }}
{{- end }}
{{- $offsiteUri := .Values.dr.backup.offsite.uri | default "" | trim }}
{{- if or (eq $offsiteUri "") (not (hasPrefix "s3://" $offsiteUri)) }}
{{- fail "W1-OPS-04: production dr.backup.offsite.uri must be a non-empty s3://bucket/prefix/ target." }}
{{- end }}
{{- $ol := .Values.dr.backup.offsite.objectLock | default dict }}
{{- $lockMode := $ol.mode | default "" | upper }}
{{- if and (ne $lockMode "GOVERNANCE") (ne $lockMode "COMPLIANCE") }}
{{- fail "W1-OPS-04: production dr.backup.offsite.objectLock.mode must be GOVERNANCE or COMPLIANCE (immutable / WORM)." }}
{{- end }}
{{- $lockRetain := $ol.retainDays | default 0 | int }}
{{- $pvcRetain := .Values.dr.backup.retentionDays | int }}
{{- if lt $lockRetain $pvcRetain }}
{{- fail "W1-OPS-04: production objectLock.retainDays must be >= dr.backup.retentionDays (independent offsite retention floor)." }}
{{- end }}
{{- if lt $pvcRetain 1 }}
{{- fail "W1-OPS-04: production dr.backup.retentionDays must be >= 1." }}
{{- end }}
{{- end }}
# G-707 / W1-OPS-04 — scheduled logical PostgreSQL backup (pg_dump custom format)
# with on-volume retention pruning, optional/required age encrypt + offsite sync.
# Uses the dr-tools image so restore-drill scripts match production CronJobs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "proctira.fullname" . }}-pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/component: disaster-recovery
spec:
  schedule: {{ .Values.dr.backup.schedule | quote }}
  {{- with .Values.dr.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.dr.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.dr.backup.failedJobsHistoryLimit }}
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.dr.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: disaster-recovery
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "proctira.serviceAccountName" . }}
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: {{ include "proctira.image" (dict "global" .Values.global "image" .Values.dr.image "appVersion" .Chart.AppVersion) }}
              imagePullPolicy: {{ .Values.dr.image.pullPolicy }}
              command: ["bash", "tools/scripts/pg-backup.sh"]
              env:
                - name: BACKUP_DIR
                  value: /backups
                - name: BACKUP_RETENTION_DAYS
                  value: {{ .Values.dr.backup.retentionDays | quote }}
                {{- if .Values.dr.backup.encrypt.enabled }}
                - name: BACKUP_ENCRYPT
                  value: "1"
                - name: BACKUP_AGE_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "proctira.secretName" . }}
                      key: {{ .Values.dr.backup.encrypt.secretKey }}
                {{- end }}
                {{- if .Values.dr.backup.offsite.enabled }}
                - name: BACKUP_REQUIRE_OFFSITE
                  value: "1"
                - name: BACKUP_OFFSITE_URI
                  value: {{ .Values.dr.backup.offsite.uri | quote }}
                - name: BACKUP_S3_SSE
                  value: {{ .Values.dr.backup.offsite.sse | quote }}
                {{- with .Values.dr.backup.offsite.sseKmsKeyId }}
                - name: BACKUP_S3_SSE_KMS_KEY_ID
                  value: {{ . | quote }}
                {{- end }}
                {{- with .Values.dr.backup.offsite.objectLock }}
                {{- if .mode }}
                - name: BACKUP_S3_OBJECT_LOCK_MODE
                  value: {{ .mode | upper | quote }}
                - name: BACKUP_S3_OBJECT_LOCK_RETAIN_DAYS
                  value: {{ .retainDays | quote }}
                {{- end }}
                {{- end }}
                {{- if .Values.secrets.s3AccessKey }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "proctira.secretName" . }}
                      key: S3_ACCESS_KEY
                {{- end }}
                {{- if .Values.secrets.s3SecretKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "proctira.secretName" . }}
                      key: S3_SECRET_KEY
                {{- end }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.config.s3Region | default "us-east-1" | quote }}
                {{- end }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "proctira.secretName" . }}
                      key: {{ .Values.dr.databaseUrlSecretKey }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.dr.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.dr.backup.existingClaim | default (printf "%s-backups" (include "proctira.fullname" .)) }}
            - name: tmp
              emptyDir: {}
{{- end }}
