{{- if and .Values.dr.enabled .Values.dr.backup.enabled (not .Values.dr.backup.existingClaim) }}
# G-707 — durable volume for logical backups + drill evidence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "proctira.fullname" . }}-backups
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/component: disaster-recovery
spec:
  accessModes:
    - {{ .Values.dr.backup.storage.accessMode }}
  {{- with .Values.dr.backup.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dr.backup.storage.size }}
{{- end }}
