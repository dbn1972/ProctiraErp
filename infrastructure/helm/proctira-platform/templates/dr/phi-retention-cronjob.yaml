{{- if and .Values.dr.enabled .Values.dr.phiRetention.enabled }}
{{/*
  W1-OPS-19 — PHI retention must not silently default to dry-run.
  - apply must be an explicit bool (unset → fail closed).
  - production requires apply=true (enforcing deletion).
  - sandbox/staging/dev set apply=false → RETENTION_DRY_RUN=1 (explicit dry-run).
*/}}
{{- if not (kindIs "bool" .Values.dr.phiRetention.apply) }}
{{- fail "W1-OPS-19: dr.phiRetention.apply must be an explicit boolean (true=enforce deletion / RETENTION_DRY_RUN=0, false=sandbox dry-run / RETENTION_DRY_RUN=1). Unset mode is refuse." }}
{{- end }}
{{- if and (eq .Values.global.environment "production") (not .Values.dr.phiRetention.apply) }}
{{- fail "W1-OPS-19: production PHI retention must set dr.phiRetention.apply=true (enforcing deletion). For dry-run use staging/development with apply=false." }}
{{- end }}
# G-707 / W1-OPS-19 — scheduled PHI / minor-data retention job.
# Production: apply=true → RETENTION_DRY_RUN=0 (enforces deletion).
# Sandbox: apply=false → RETENTION_DRY_RUN=1 (explicit dry-run only).
# Evidence (summary.json) lands on the backups volume next to the dumps.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "proctira.fullname" . }}-phi-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/component: disaster-recovery
spec:
  schedule: {{ .Values.dr.phiRetention.schedule | quote }}
  {{- with .Values.dr.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: phi-retention
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: disaster-recovery
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "proctira.serviceAccountName" . }}
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: phi-retention
              image: {{ include "proctira.image" (dict "global" .Values.global "image" .Values.dr.image "appVersion" .Chart.AppVersion) }}
              imagePullPolicy: {{ .Values.dr.image.pullPolicy }}
              command: ["node", "tools/scripts/phi-retention-job.mjs"]
              env:
                - name: ARTIFACT_DIR
                  value: /backups/evidence/phi-retention
                - name: RETENTION_DRY_RUN
                  value: {{ ternary "0" "1" .Values.dr.phiRetention.apply | quote }}
                - name: PHI_RETENTION_DAYS
                  value: {{ .Values.dr.phiRetention.phiRetentionDays | quote }}
                - name: MINOR_PHI_RETENTION_DAYS
                  value: {{ .Values.dr.phiRetention.minorPhiRetentionDays | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "proctira.secretName" . }}
                      key: {{ .Values.dr.databaseUrlSecretKey }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.dr.phiRetention.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.dr.backup.existingClaim | default (printf "%s-backups" (include "proctira.fullname" .)) }}
            - name: tmp
              emptyDir: {}
{{- end }}
