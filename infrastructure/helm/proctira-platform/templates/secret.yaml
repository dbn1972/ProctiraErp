{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proctira.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.kafkaBrokers }}
  KAFKA_BROKERS: {{ .Values.secrets.kafkaBrokers | quote }}
  {{- end }}
  {{- if .Values.secrets.rabbitmqUrl }}
  RABBITMQ_URL: {{ .Values.secrets.rabbitmqUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.cookieSecret }}
  COOKIE_SECRET: {{ .Values.secrets.cookieSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKey }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretKey }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- end }}
{{- end }}
