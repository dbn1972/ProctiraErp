{{- if .Values.examDocumentWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proctira.fullname" . }}-exam-document-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/name: exam-document-worker
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.examDocumentWorker.service.type }}
  selector:
    app.kubernetes.io/name: exam-document-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: health
      port: {{ .Values.examDocumentWorker.service.port }}
      targetPort: health
      protocol: TCP
{{- end }}
