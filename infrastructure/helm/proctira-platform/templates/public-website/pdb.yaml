{{- if and .Values.publicWebsite.enabled .Values.publicWebsite.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "proctira.fullname" . }}-public-website
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/name: public-website
spec:
  minAvailable: {{ .Values.publicWebsite.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: public-website
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
