{{- if .Values.notificationService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proctira.fullname" . }}-notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.notificationService.service.type }}
  selector:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.notificationService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
