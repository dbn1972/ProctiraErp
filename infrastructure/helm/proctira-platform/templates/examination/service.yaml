{{- if .Values.examinationService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proctira.fullname" . }}-examination-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proctira.labels" . | nindent 4 }}
    app.kubernetes.io/name: examination-service
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.examinationService.service.type }}
  selector:
    app.kubernetes.io/name: examination-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.examinationService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
