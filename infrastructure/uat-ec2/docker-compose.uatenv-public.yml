# =============================================================================
# ProctiraERP UAT — optional public TLS listener (NOT used by default)
# =============================================================================
# Added by uatenv_compose only when UATENV_PUBLIC_TLS=1 is set in
# secrets/uatenv.env, after the owner has provided a DNS name, a security-group
# rule and a certificate (docs/testing/uat/UAT_ENVIRONMENT.md, "Public
# exposure"). UATENV_PUBLIC_BIND and UATENV_TLS_* live in the same file. The
# proxy then also listens on 29090 with TLS (uatenv-render.mjs emits
# `listen 29090 ssl` under the same conditions), publishes it on
# UATENV_PUBLIC_BIND:443 and refuses Keycloak /admin and /realms/master there.
# =============================================================================
services:
  proxy:
    ports:
      - '${UATENV_PUBLIC_BIND:?Set UATENV_PUBLIC_BIND (interface for the public listener)}:443:29090'
    volumes:
      - ${UATENV_TLS_CERT:?Set UATENV_TLS_CERT}:/etc/nginx/tls/fullchain.pem:ro
      - ${UATENV_TLS_KEY:?Set UATENV_TLS_KEY}:/etc/nginx/tls/privkey.pem:ro
