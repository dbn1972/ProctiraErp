# =============================================================================
# ProctiraERP UAT — optional public TLS listener (NOT used by default)
# =============================================================================
# Added by uatenv_compose only when UATENV_PUBLIC_TLS=1 is exported, after the
# owner has provided a DNS name, a security-group rule and a certificate
# (docs/testing/uat/UAT_ENVIRONMENT.md, "Public exposure"). The proxy then also
# listens on 29090 with TLS (uatenv-render.mjs emits `listen 29090 ssl` when
# UATENV_TLS_CERT / UATENV_TLS_KEY are set) and publishes it on
# UATENV_PUBLIC_BIND:443.
# =============================================================================
services:
  proxy:
    ports:
      - '${UATENV_PUBLIC_BIND:?Set UATENV_PUBLIC_BIND (interface for the public listener)}:443:29090'
    volumes:
      - ${UATENV_TLS_CERT:?Set UATENV_TLS_CERT}:/etc/nginx/tls/fullchain.pem:ro
      - ${UATENV_TLS_KEY:?Set UATENV_TLS_KEY}:/etc/nginx/tls/privkey.pem:ro
