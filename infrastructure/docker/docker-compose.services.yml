# =============================================================================
# ProctiraERP — Split-service compose (NON-PROD / LAB ONLY) — W1-OPS-16
# =============================================================================
# *** NOT FOR PRODUCTION ***
#
# Canonical production topology is the in-process API gateway (root
# docker-compose.yml + Helm proctira-service / platform with topology.mode=
# in-process). Domain packages mount inside apps/api-gateway; standalone
# services here do not receive product traffic when prefixes are superseded.
#
# This file is retained for microservice experiments and future cutover labs.
# See docs/DEPLOYMENT_TOPOLOGY.md and docs/audits/OPS_W1_OPS_16_TOPOLOGY.md.
#
# Usage (lab only):
#   docker compose -f infrastructure/docker/docker-compose.services.yml up
#
# Prerequisites:
#   - Infrastructure services (postgres, redis, kafka, rabbitmq) must be running
#     via the root docker-compose.yml or externally provisioned.
#
# All configuration is driven by environment variables. Copy .env.example to
# .env at the monorepo root and override values as needed.
#
# PRC-L474: hardened to match the canonical docker-compose.yml's pattern
# (PRC-M311) — ports bind to BIND_ADDRESS (default 127.0.0.1, not 0.0.0.0),
# credential-bearing vars require an explicit value (${VAR:?...}), this
# lab-only file defaults NODE_ENV to development (not production), sandbox
# providers require explicit opt-in (ALLOW_SANDBOX_PROVIDERS default 0), and
# every service has a healthcheck + depends_on: condition: service_healthy
# where it talks to postgres/redis directly.
# =============================================================================

name: proctira-services

services:
  # ---------------------------------------------------------------------------
  # Backend Domain Services (independently deployable)
  # ---------------------------------------------------------------------------
  institution-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend-service
      args:
        SERVICE_NAME: institution
        SERVICE_PORT: 3020
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3020
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (see .env.example)}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (see .env.example)}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_ISSUER: ${JWT_ISSUER:-proctira-platform}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3020:3020'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:3020/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proctira

