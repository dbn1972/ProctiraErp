# =============================================================================
# ProctiraERP Unified Platform — Microservices Deployment Compose
# =============================================================================
# This compose file deploys backend services as independent microservices.
# Use this when running the platform in a distributed/microservice topology
# rather than the monolithic api-gateway mode.
#
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.services.yml up
#
# Prerequisites:
#   - Infrastructure services (postgres, redis, kafka, rabbitmq) must be running
#     via the root docker-compose.yml or externally provisioned.
#
# All configuration is driven by environment variables. Copy .env.example to
# .env at the monorepo root and override values as needed.
# =============================================================================

name: proctira-services

services:
  # ---------------------------------------------------------------------------
  # Backend Domain Services (independently deployable)
  # ---------------------------------------------------------------------------
  institution-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend-service
      args:
        SERVICE_NAME: institution
        SERVICE_PORT: 3020
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3020
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-proctira-platform}
    ports:
      - '3020:3020'
    networks:
      - proctira

