    build: !reset null
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm --filter @proctira/public-website dev"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./:/app
      - proctira-node-modules:/app/node_modules

  admin-console:
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm --filter @proctira/admin-console dev"
    environment:
