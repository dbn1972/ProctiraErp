    build: !reset null
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile && pnpm --filter @proctira/developer-portal dev"
    environment:
      NODE_ENV: development
