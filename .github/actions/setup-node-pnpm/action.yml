# =============================================================================
# Composite action — Node.js + pnpm (+ optional install)
# =============================================================================
# Shared by reusable-setup.yml and caller workflows so setup stays DRY.
# W1-OPS-24: composite is the in-job reusable unit; the workflow_call wrapper
# exists so CI can still `uses: ./.github/workflows/reusable-setup.yml`.
# =============================================================================

name: Setup Node + pnpm
description: Install pnpm, set up Node.js with pnpm store cache, optionally pnpm install

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'
  pnpm-version:
    description: pnpm version
    required: false
    default: '10.33.2'
  install-dependencies:
    description: Whether to run pnpm install --frozen-lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        TURBO_TOKEN: ${{ env.TURBO_TOKEN }}
        TURBO_TEAM: ${{ env.TURBO_TEAM }}
