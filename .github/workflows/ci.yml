# =============================================================================
# CI Pipeline - ProctiraERP Unified Platform
# =============================================================================
# Runs on every push and pull request to main/develop branches.
# Stages: lint → type-check → unit test → build → integration test
# Uses Turborepo remote caching and affected-module detection for selective builds.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which packages/apps changed to enable selective builds
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Affected Modules
    runs-on: ubuntu-latest
    outputs:
      packages-changed: ${{ steps.filter.outputs.packages }}
      apps-changed: ${{ steps.filter.outputs.apps }}
      infra-changed: ${{ steps.filter.outputs.infra }}
      has-backend-changes: ${{ steps.filter.outputs.backend }}
      has-frontend-changes: ${{ steps.filter.outputs.frontend }}
      has-shared-changes: ${{ steps.filter.outputs.shared }}
      secondary-apps-changed: ${{ steps.filter.outputs.secondary_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # W1-OPS-05 residual: infra-only PRs must still run the unit→
          # integration/tenant-isolation chain (db/tools/docs already in
          # shared/backend via #181). Job ifs + aggregate read infra-changed.
          # W1-OPS-12: secondary Next apps have dedicated Playwright smokes
          # (not covered by apps/web e2e-backend-ready / lighthouse).
          filters: |
            packages:
              - 'packages/**'
            apps:
              - 'apps/**'
            infra:
              - 'infrastructure/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
              - 'apps/api-gateway/**'
              - 'apps/etl-worker/**'
              - 'db/**'
              - 'tools/tenant-isolation-tests/**'
              - 'tools/dod-checks/**'
              - 'tools/scripts/**'
            frontend:
              - 'packages/ui/**'
              - 'apps/web/**'
              - 'apps/registration-portal/**'
            secondary_apps:
              - 'apps/admin-console/**'
              - 'apps/developer-portal/**'
              - 'apps/install-wizard/**'
              - 'apps/public-website/**'
              - 'apps/registration-portal/**'
              - '.github/workflows/ci.yml'
              - 'tools/scripts/run-secondary-apps-e2e.sh'
              - 'tools/scripts/ci-aggregate-gate.mjs'
              - 'tools/scripts/ci-aggregate-gate.test.mjs'
            shared:
              - 'packages/shared/**'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - '.eslintrc*'
              - 'db/**'
              - 'tools/**'
              - 'docs/**'

  # ---------------------------------------------------------------------------
  # Lint - ESLint + Prettier check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages-changed == 'true' || needs.detect-changes.outputs.apps-changed == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true' || needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head (not the merge commit). Shallow depth is fine
          # here — turbo affected filters live in typecheck/unit/build/integration
          # and resolve merge-base via W1-OPS-22.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (tip-changed sources only)
        run: |
          # Tip-only: lint the TS/JS files touched in HEAD, not entire
          # packages. Touching a package config (e.g. lighthouserc.cjs) must
          # not fail the PR on pre-existing debt elsewhere in that package.
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' \
              | grep -vE '(^|/)(dist|\.next|coverage|node_modules)/' \
              || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No tip TS/JS sources; skipping ESLint."
            exit 0
          fi
          echo "Linting ${#FILES[@]} tip file(s):"
          printf '  %s\n' "${FILES[@]}"
          pnpm exec eslint --no-error-on-unmatched-pattern "${FILES[@]}"

      - name: Run accessibility ESLint scan (icon-only buttons)
        run: pnpm run lint:a11y

      - name: Run contrast gate (Requirement 37 AC 2 — light + dark modes)
        run: pnpm run check:contrast

      - name: Run brand-neutrality ESLint scan (no-hardcoded-brand-strings)
        run: pnpm run lint:brand

      - name: Check hardcoded brand strings (non-TypeScript assets)
        run: pnpm run check:brand-strings

      - name: Check formatting (repo-wide, G-733)
        run: pnpm run format:check

  # ---------------------------------------------------------------------------
  # Type Check - TypeScript compilation
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages-changed == 'true' || needs.detect-changes.outputs.apps-changed == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true' || needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # W1-OPS-22: check out the PR head (not the merge commit). Full history
          # + base refs let turbo filter against merge-base with the target branch
          # instead of tip-only HEAD~1 (which omits earlier commits in a PR).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch turbo filter base refs (W1-OPS-22)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin main

      - name: Resolve turbo filter base (W1-OPS-22)
        id: turbo
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/scripts/resolve-turbo-filter-base.mjs --github-output

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking (affected packages)
        run: pnpm turbo run typecheck --filter='${{ steps.turbo.outputs.filter }}'

  # ---------------------------------------------------------------------------
  # Unit Tests - Vitest + fast-check property tests
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, typecheck]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.packages-changed == 'true' ||
       needs.detect-changes.outputs.apps-changed == 'true' ||
       needs.detect-changes.outputs.has-shared-changes == 'true' ||
       needs.detect-changes.outputs.infra-changed == 'true') &&
      needs.lint.result != 'failure' &&
      needs.lint.result != 'cancelled' &&
      needs.typecheck.result != 'failure' &&
      needs.typecheck.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
        with:
          # W1-OPS-22: check out the PR head (not the merge commit). Full history
          # + base refs let turbo filter against merge-base with the target branch
          # instead of tip-only HEAD~1 (which omits earlier commits in a PR).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch turbo filter base refs (W1-OPS-22)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin main

      - name: Resolve turbo filter base (W1-OPS-22)
        id: turbo
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/scripts/resolve-turbo-filter-base.mjs --github-output

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # W3-TEST-03: unit job must not silently "pass" skipped *.live.test.ts
      # suites. Exclude them here; integration-test runs them with DATABASE_URL
      # and assert-live-test-execution.mjs enforces a minimum executed count.
      - name: Run unit tests (affected packages, exclude live Postgres suites)
        run: pnpm turbo run test --filter='${{ steps.turbo.outputs.filter }}' -- --exclude '**/*.live.test.ts' --coverage
        env:
          CI: true
          ALLOW_LIVE_TEST_SKIP: '1'

      # W3-TEST-04: fail closed when unit job did not emit coverage artifacts
      # or aggregate percentages fall below baseline floors.
      - name: Assert unit-test coverage gate (W3-TEST-04)
        run: pnpm test:coverage:assert
        env:
          CI: true
          REQUIRE_COVERAGE_GATE: '1'

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage/'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build - Production build of affected packages
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.packages-changed == 'true' ||
       needs.detect-changes.outputs.apps-changed == 'true' ||
       needs.detect-changes.outputs.has-shared-changes == 'true' ||
       needs.detect-changes.outputs.infra-changed == 'true') &&
      needs.unit-test.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # W1-OPS-22: check out the PR head (not the merge commit). Full history
          # + base refs let turbo filter against merge-base with the target branch
          # instead of tip-only HEAD~1 (which omits earlier commits in a PR).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch turbo filter base refs (W1-OPS-22)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin main

      - name: Resolve turbo filter base (W1-OPS-22)
        id: turbo
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/scripts/resolve-turbo-filter-base.mjs --github-output

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        run: pnpm turbo run build --filter='${{ steps.turbo.outputs.filter }}'
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist/
            apps/*/.next/
            packages/*/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Bundle Budget Gate (Requirement 39 AC 1 — Design §J — task 60.6)
  # ---------------------------------------------------------------------------
  # Runs `pnpm check:bundle` against the Next.js build produced for
  # `apps/web`. The gate fails the pipeline when any of the named routes
  # (`/auth/signin`, `/app/dashboard`, `/app/attendance`) ships more than
  # 500 KB gzip in initial chunks. Implemented in
  # `tools/scripts/check-bundle.mjs`; per-route output is kept in the CI
  # log for change-by-change tracking and the JSON report + bundle
  # visualizer HTML (when emitted) are archived as PR-reviewable artifacts.
  # ---------------------------------------------------------------------------
  bundle-budget:
    name: Bundle Budget (Requirement 39 AC 1)
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.has-frontend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head (not the merge commit). Shallow depth is fine
          # here — turbo affected filters live in typecheck/unit/build/integration
          # and resolve merge-base via W1-OPS-22.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web (production)
        run: pnpm --filter @proctira/web build
        env:
          NODE_ENV: production
          ANALYZE: 'true'

      - name: Run bundle budget gate
        # Exits non-zero when any named route's initial chunks exceed
        # 500 KB gzip — that failure propagates here and fails the job,
        # satisfying the second bullet of task 60.6 ("Fail the build on
        # any over-budget chunk").
        run: pnpm run check:bundle --no-build

      - name: Generate bundle budget JSON report
        if: always()
        run: pnpm run check:bundle --no-build --json --quiet > bundle-budget.json
        continue-on-error: true

      - name: Archive bundle budget JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          path: bundle-budget.json
          retention-days: 30

      - name: Archive bundle visualizer HTML (when emitted)
        # The Next.js bundle analyzer (enabled via ANALYZE=true) emits
        # client.html and nodejs.html under `.next/analyze/`. The Vite
        # SPA build emits `dist/bundle-analysis.html`. Upload whichever
        # exists so reviewers can inspect chunk sizes per PR (task 60.6
        # — "Enable bundle visualizer in CI").
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-visualizer
          path: |
            apps/web/.next/analyze/
            apps/web/dist/bundle-analysis.html
            apps/web/dist/bundle-stats.html
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Lighthouse Gate (Requirement 39 AC 2 — Property F-10 — Design §J)
  # ---------------------------------------------------------------------------
  # Runs `pnpm -F @proctira/web check:lighthouse` after the Next.js
  # production build. The gate audits the routes named in Requirement 39
  # (`/auth/signin`, `/app/dashboard`, `/app/attendance`) under two
  # profiles — desktop and simulated 3G mobile (1.6 Mbps downlink, 750 ms
  # RTT, 4× CPU slowdown). Categories collected: accessibility (axe-core),
  # performance, best-practices, seo. The build fails when any category
  # score drops below: Accessibility 0.95, Performance 0.80, Best
  # Practices 0.90, SEO 0.90 (Property F-10).
  #
  # Authenticated routes are evaluated only when the workflow exposes a
  # session cookie via `LHCI_AUTH_COOKIE` (a JSON-encoded array suitable
  # for Puppeteer `page.setCookie`). Without it the wrapper logs a
  # warning and audits the anonymous `/login` surface only — matching the
  # spec's implementation note for task 55.7.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse Gate (Property F-10)
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.has-frontend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true'
    env:
      LHCI_PORT: '3001'
      LHCI_BASE_URL: 'http://localhost:3001'
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head (not the merge commit). Shallow depth is fine
          # here — turbo affected filters live in typecheck/unit/build/integration
          # and resolve merge-base via W1-OPS-22.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web (production)
        run: pnpm --filter @proctira/web build
        env:
          NODE_ENV: production

      - name: Start apps/web (production)
        run: |
          pnpm --filter @proctira/web start --port "$LHCI_PORT" > /tmp/web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /login to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$LHCI_BASE_URL/login" -o /dev/null; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "apps/web did not become ready on $LHCI_BASE_URL" >&2
          tail -n 200 /tmp/web.log >&2 || true
          exit 1

      - name: Run Lighthouse gate (desktop + mobile-3g)
        run: pnpm --filter @proctira/web check:lighthouse --strict

      - name: Stop apps/web
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then kill "$WEB_PID" 2>/dev/null || true; fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tools/scripts/.lighthouseci/
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration Tests - Requires infrastructure services
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.has-backend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true' || needs.detect-changes.outputs.infra-changed == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The bootstrap role is a superuser and therefore bypasses RLS.
          # Provision below creates:
          #   - proctira: NOSUPERUSER NOBYPASSRLS table owner (Prisma + apply-sql)
          #   - proctira_app: non-owner runtime role used by DATABASE_URL suites
          #     (W1-DATA-01 — ENABLE RLS constrains non-owners without FORCE)
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # W1-OPS-22: check out the PR head (not the merge commit). Full history
          # + base refs let turbo filter against merge-base with the target branch
          # instead of tip-only HEAD~1 (which omits earlier commits in a PR).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch turbo filter base refs (W1-OPS-22)
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin main

      - name: Resolve turbo filter base (W1-OPS-22)
        id: turbo
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/scripts/resolve-turbo-filter-base.mjs --github-output

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision migrator + runtime roles and database (W1-DATA-10)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Canonical role bootstrap — no hand-written CREATE ROLE in CI.
          BOOTSTRAP_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
          MIGRATOR_PASSWORD=proctira_test \
          APP_ROLE_PASSWORD=proctira_app_test \
          BOOTSTRAP_DB_NAME=proctira_test \
          BOOTSTRAP_EXTENSIONS=1 \
          BOOTSTRAP_PIN_MIGRATOR_ATTRIBUTES=1 \
            bash tools/scripts/bootstrap-db-roles.sh
          PGPASSWORD=proctira_test psql -h localhost -U proctira -d proctira_test -Atc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls THEN 'ERROR: migrator role bypasses RLS' ELSE 'migrator role OK: NOSUPERUSER NOBYPASSRLS' END FROM pg_roles WHERE rolname = current_user" \
            | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '^migrator role OK'
          PGPASSWORD=proctira_app_test psql -h localhost -U proctira_app -d proctira_test -Atc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls THEN 'ERROR: app role bypasses RLS' ELSE 'app role OK: RLS enforced' END FROM pg_roles WHERE rolname = current_user" \
            | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '^app role OK'

      - name: Run database migrations
        run: pnpm --filter @proctira/database run prisma:migrate:deploy
        env:
          # DDL as table owner (migrator).
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test

      # G-002: domain SQL (db/sql/001–N) after Prisma so raw-SQL modules use Postgres
      - name: Apply domain SQL schemas
        run: bash tools/scripts/apply-sql.sh
        env:
          MIGRATOR_DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          # G-705: demo seed files are opt-in; CI wants them, production never sets this.
          APPLY_SEEDS: '1'
          # W1-DATA-06 COMPLETE: create + VALIDATE + repair (prod/CI default ON).
          APPLY_STRICT_FKS: '1'

      - name: Prove zero unvalidated tenant_id FKs (live catalog)
        run: node tools/scripts/check-strict-tenant-fks.mjs --live --require-live
        env:
          MIGRATOR_DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test

      # G-807: backend packages only define `test`, so `test:e2e` below never
      # reached them and every pg-*-repository / *.live.test.ts suite silently
      # skipped in CI (they self-skip without DATABASE_URL). Run the backend
      # suites here against the migrated database so Postgres persistence,
      # RLS and tenant binding are verified on every PR.
      - name: Run backend Postgres repository suites
        run: pnpm turbo run test --filter='./packages/backend/*' --force --continue
        env:
          # W1-DATA-01: runtime suites must use the non-owner app role.
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true
          REQUIRE_LIVE_TESTS: '1'

      # W3-TEST-04: dedicated pg-gate runner asserts pg-* suites did not skip
      # when DATABASE_URL is present (complements W3-TEST-03 live gate).
      - name: Assert backend pg repository suites executed (W3-TEST-04)
        run: pnpm test:pg:gate
        env:
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          CI: true
          FORBID_TEST_SKIPS: '1'
          PG_TEST_MIN_EXECUTED: '25'
          PG_TEST_MAX_ALLOWED_SKIPS: '1'
          NODE_ENV: test

      # W3-TEST-03: collect *.live.test.ts JSON and fail if any skipped or
      # executed count is below LIVE_TEST_MIN_EXECUTED.
      - name: Assert live Postgres suites executed (W3-TEST-03)
        run: pnpm test:live:gate
        env:
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          CI: true
          REQUIRE_LIVE_TESTS: '1'
          LIVE_TEST_MIN_EXECUTED: '10'
          NODE_ENV: test

      - name: Run integration tests
        run: pnpm turbo run test:e2e --filter='${{ steps.turbo.outputs.filter }}'
        env:
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/test-results/'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Definition-of-Done — Charter Compliance Release Gate
  # ---------------------------------------------------------------------------
  # Charter §32 (Definition of Done). Runs the seven automated checks in
  # tools/dod-checks/ as a release gate; a non-zero exit blocks the merge.
  # The detailed workflow definition-of-done.yml runs the same job in
  # isolation when only DoD-relevant paths change; this entry keeps the
  # gate present in the affected-modules pipeline as well.
  # ---------------------------------------------------------------------------
  dod-checks:
    name: Definition of Done (Charter §32)
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.packages-changed == 'true' ||
       needs.detect-changes.outputs.apps-changed == 'true' ||
       needs.detect-changes.outputs.has-shared-changes == 'true' ||
       needs.detect-changes.outputs.infra-changed == 'true') &&
      needs.unit-test.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head (not the merge commit). Shallow depth is fine
          # here — turbo affected filters live in typecheck/unit/build/integration
          # and resolve merge-base via W1-OPS-22.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Definition-of-Done checks
        run: pnpm run check:dod

      - name: Run DoD check unit tests
        run: pnpm run check:dod:test

      - name: Page-wise regression matrix is complete and current (G-804)
        run: node tools/scripts/page-regression-matrix.mjs --check

      # W3-D6: fail closed when the aggregator did not emit a complete report
      # or when the committed baseline pack is missing/incoherent.
      - name: Assert DoD evidence artifacts (W3-D6)
        if: always()
        run: pnpm run check:dod:evidence

      - name: Upload DoD JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dod-report
          path: tools/dod-checks/reports/dod-report.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Tenant Isolation Verification - Release Gate
  # ---------------------------------------------------------------------------
  # This job runs the comprehensive tenant isolation test suite and MUST pass
  # before any release. It verifies data isolation across all layers:
  # query scoping, auth boundaries, HTTP, event routing, search, cache, and
  # reports. The gate is implemented as a dedicated package
  # (@proctira/tenant-isolation-tests) under tools/tenant-isolation-tests.
  # Charter: Section 39 (Tenant Isolation Verification)
  # ---------------------------------------------------------------------------
  tenant-isolation:
    name: Tenant Isolation Verification (Release Gate)
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.detect-changes.outputs.packages-changed == 'true' ||
       needs.detect-changes.outputs.apps-changed == 'true' ||
       needs.detect-changes.outputs.has-shared-changes == 'true' ||
       needs.detect-changes.outputs.infra-changed == 'true') &&
      needs.unit-test.result == 'success'
    # W1-OPS-06: live RLS tests (src/integration/rls-live.test.ts) require a
    # migrated Postgres with the non-superuser app role — same posture as
    # integration-test. Without this service the suite skipped vacuously.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The bootstrap role is a superuser and therefore bypasses RLS. The
          # suites connect as `proctira`, a NOSUPERUSER / NOBYPASSRLS owner
          # provisioned below, so tenant-isolation assertions are real (the
          # production posture; FORCE RLS applies to owners).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head (not the merge commit). Shallow depth is fine
          # here — turbo affected filters live in typecheck/unit/build/integration
          # and resolve merge-base via W1-OPS-22.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision migrator + non-owner runtime roles (W1-DATA-10)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          BOOTSTRAP_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
          MIGRATOR_PASSWORD=proctira_test \
          APP_ROLE_PASSWORD=proctira_app_test \
          BOOTSTRAP_DB_NAME=proctira_test \
          BOOTSTRAP_EXTENSIONS=1 \
          BOOTSTRAP_PIN_MIGRATOR_ATTRIBUTES=1 \
            bash tools/scripts/bootstrap-db-roles.sh
          PGPASSWORD=proctira_test psql -h localhost -U proctira -d proctira_test -Atc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls THEN 'ERROR: migrator role bypasses RLS' ELSE 'migrator role OK: NOSUPERUSER NOBYPASSRLS' END FROM pg_roles WHERE rolname = current_user" \
            | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '^migrator role OK'
          PGPASSWORD=proctira_app_test psql -h localhost -U proctira_app -d proctira_test -Atc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls THEN 'ERROR: app role bypasses RLS' ELSE 'app role OK: RLS enforced' END FROM pg_roles WHERE rolname = current_user" \
            | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '^app role OK'

      - name: Run database migrations
        run: pnpm --filter @proctira/database run prisma:migrate:deploy
        env:
          # DDL as table owner (migrator).
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test

      - name: Apply domain SQL schemas
        run: bash tools/scripts/apply-sql.sh
        env:
          MIGRATOR_DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          APPLY_SEEDS: '1'
          # W1-DATA-06 COMPLETE: create + VALIDATE + repair (prod/CI default ON).
          APPLY_STRICT_FKS: '1'

      - name: Prove zero unvalidated tenant_id FKs (live catalog)
        run: node tools/scripts/check-strict-tenant-fks.mjs --live --require-live
        env:
          MIGRATOR_DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test

      - name: Run unit isolation tests
        run: pnpm test:tenant-isolation:unit
        env:
          CI: true

      - name: Run integration isolation tests (incl. live Postgres RLS)
        run: pnpm test:tenant-isolation:integration
        env:
          # W1-DATA-01: live RLS suites must use non-owner proctira_app.
          DATABASE_URL: postgresql://proctira_app:proctira_app_test@localhost:5432/proctira_test
          CI: true

      - name: Run queue/event isolation tests
        run: pnpm test:tenant-isolation:queue
        env:
          CI: true

      - name: Run search isolation tests
        run: pnpm test:tenant-isolation:search
        env:
          CI: true

      - name: Run cache isolation tests
        run: pnpm test:tenant-isolation:cache
        env:
          CI: true

      - name: Run report isolation tests
        run: pnpm test:tenant-isolation:report
        env:
          CI: true

      - name: Run E2E isolation tests
        run: pnpm test:tenant-isolation:e2e
        env:
          CI: true

      - name: Upload tenant isolation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-results
          path: |
            tools/tenant-isolation-tests/test-results/
            tools/tenant-isolation-tests/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Restore Drill Evidence — ops gate (W3-OPS-C6)
  # ---------------------------------------------------------------------------
  # Tip-committed backup/restore drill evidence must be present and coherent
  # on every PR. Does not re-run Postgres (see restore-drill.yml); fails closed
  # when the pack is missing, lacks required W1-OPS-20 fields (timestamp /
  # encryption / offsiteTarget), claims production restore, or lacks a CI
  # cross-ref.
  # ---------------------------------------------------------------------------
  restore-drill-evidence:
    name: Restore Drill Evidence (W3-OPS-C6 / W1-OPS-20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify restore-drill evidence pack (fail closed)
        run: bash tools/scripts/check-restore-drill-evidence.sh

  # ---------------------------------------------------------------------------
  # Prisma ↔ SQL schema drift — data gate (W1-DATA-04 COMPLETE)
  # ---------------------------------------------------------------------------
  # Always-on, fail-closed catalog parity: every Prisma model vs SQL corpus
  # (columns/types/nullability/defaults/PK/unique/check/FK/index) plus one
  # declared schema authority per table. Auth session models must stay
  # SQL-backed. No Postgres required for the static gate; fresh-DB CI that
  # runs prisma migrate + apply-sql inherits the same corpus.
  # ---------------------------------------------------------------------------
  prisma-sql-drift:
    name: Prisma SQL Drift (W1-DATA-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit-test Prisma↔SQL drift gate
        run: node --test tools/scripts/check-prisma-sql-drift.test.mjs

      - name: Fail on Prisma↔SQL catalog drift
        run: node tools/scripts/check-prisma-sql-drift.mjs

  # ---------------------------------------------------------------------------
  # Strict tenant FKs — data gate (W1-DATA-06 COMPLETE)
  # ---------------------------------------------------------------------------
  # Fail closed when apply-sql.sh is invoked in CI without APPLY_STRICT_FKS=1
  # (unless STRICT_FK_SKIP_JUSTIFIED), when VALIDATE/repair migrations are
  # missing, or when apply-sql no longer defaults ON for CI/production.
  # Static only — live catalog proof runs in integration-test / tenant-isolation
  # after APPLY_STRICT_FKS=1 apply.
  # ---------------------------------------------------------------------------
  strict-tenant-fks:
    name: Strict Tenant FKs (W1-DATA-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit-test strict tenant FK gate
        run: node --test tools/scripts/check-strict-tenant-fks.test.mjs

      - name: Fail when APPLY_STRICT_FKS / VALIDATE / repair posture is skipped
        run: node tools/scripts/check-strict-tenant-fks.mjs

  # ---------------------------------------------------------------------------
  # Leading tenant_id indexes — data gate (W1-DATA-16)
  # ---------------------------------------------------------------------------
  # Fail closed when tenant-scoped tables lack a leading tenant_id index /
  # UNIQUE / PK (unless documented in tenant-id-index-allowlist.json).
  # No Postgres required — static SQL corpus scan.
  # ---------------------------------------------------------------------------
  tenant-id-indexes:
    name: Tenant ID Indexes (W1-DATA-16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit-test leading tenant_id index gate
        run: node --test tools/scripts/check-tenant-id-indexes.test.mjs

      - name: Fail when tenant-scoped tables lack leading tenant_id indexes
        run: node tools/scripts/check-tenant-id-indexes.mjs

  # ---------------------------------------------------------------------------
  # Migration lock/statement timeouts + online DDL hazard gate (W1-DATA-17)
  # ---------------------------------------------------------------------------
  # Fail closed when apply-sql / prisma migrate wrappers omit session
  # lock_timeout + statement_timeout, when post-baseline DDL has long-lock
  # hazards without a maintenance-window waiver, or when the lock-contention
  # recovery drill fails. Postgres service required for the live drill.
  # ---------------------------------------------------------------------------
  migration-timeouts:
    name: Migration Timeouts (W1-DATA-17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install psql client
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Unit-test migration timeout + DDL hazard + recovery contracts
        run: node --test tools/scripts/check-migration-timeouts.test.mjs tools/scripts/migration-lock-recovery-drill.test.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Fail when migration apply paths omit timeouts or ship unwaived DDL hazards
        run: node tools/scripts/check-migration-timeouts.mjs

      - name: Lock-contention recovery drill (fail → resume)
        run: node tools/scripts/migration-lock-recovery-drill.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # ---------------------------------------------------------------------------
  # CODEOWNERS fail-closed gate — security governance (W1-SEC-13)
  # ---------------------------------------------------------------------------
  # Blocks silent fake @org/team handles unless PROCTIRA_CODEOWNERS_TEAMS_READY=1.
  # Organization-owned repos require READY=1. Personal-account interim ownership
  # is allowed only with documented intended team slugs in comments.
  # No GitHub App / org admin token required for the static contract.
  # ---------------------------------------------------------------------------
  codeowners-gate:
    name: Codeowners Gate (W1-SEC-13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit-test CODEOWNERS gate
        run: node --test tools/scripts/check-codeowners.test.mjs

      - name: Fail closed on CODEOWNERS team / readiness contract
        env:
          # Repo/org Actions variable; unset on personal-account interim.
          PROCTIRA_CODEOWNERS_TEAMS_READY: ${{ vars.PROCTIRA_CODEOWNERS_TEAMS_READY }}
          # User vs Organization — org without READY=1 fails closed.
          GITHUB_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: node tools/scripts/check-codeowners.mjs

  # ---------------------------------------------------------------------------
  # Runtime table privilege catalog — data gate (W1-DATA-11 COMPLETE)
  # ---------------------------------------------------------------------------
  # Fail closed when public tables are unclassified, 050 restores blanket
  # TABLE DEFAULT PRIVILEGES, or apply-sql omits privilege catalog sync.
  # No Postgres required — static catalog + SQL contract scan.
  # ---------------------------------------------------------------------------
  runtime-table-privileges:
    name: Runtime Table Privileges (W1-DATA-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit-test runtime privilege catalog gate
        run: node --test tools/scripts/check-runtime-table-privileges.test.mjs

      - name: Fail when runtime privileges are unclassified or blanket-defaulted
        run: node tools/scripts/check-runtime-table-privileges.mjs

  # ---------------------------------------------------------------------------
  # Secondary Apps Playwright — path-filtered (W1-OPS-12)
  # ---------------------------------------------------------------------------
  # Runs ungated Chromium smokes for Next secondary apps that are not covered
  # by apps/web e2e-backend-ready / visual-regression. Backend-gated describes
  # still skip without E2E_BACKEND_READY (honest residuals — see audit doc).
  # Does not expand the apps/web lighthouse/bundle frontend filter.
  # ---------------------------------------------------------------------------
  secondary-apps-e2e:
    name: Secondary Apps Playwright (W1-OPS-12)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.secondary-apps-changed == 'true'
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: apps
        with:
          filters: |
            admin-console:
              - 'apps/admin-console/**'
            developer-portal:
              - 'apps/developer-portal/**'
            install-wizard:
              - 'apps/install-wizard/**'
            public-website:
              - 'apps/public-website/**'
            registration-portal:
              - 'apps/registration-portal/**'
            harness:
              - '.github/workflows/ci.yml'
              - 'tools/scripts/run-secondary-apps-e2e.sh'
              - 'tools/scripts/ci-aggregate-gate.mjs'
              - 'tools/scripts/ci-aggregate-gate.test.mjs'

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secondary-app Playwright smokes (Chromium)
        env:
          CI: '1'
          ADMIN_CONSOLE: ${{ steps.apps.outputs.admin-console }}
          DEVELOPER_PORTAL: ${{ steps.apps.outputs.developer-portal }}
          INSTALL_WIZARD: ${{ steps.apps.outputs.install-wizard }}
          PUBLIC_WEBSITE: ${{ steps.apps.outputs.public-website }}
          REGISTRATION_PORTAL: ${{ steps.apps.outputs.registration-portal }}
          HARNESS: ${{ steps.apps.outputs.harness }}
        run: bash tools/scripts/run-secondary-apps-e2e.sh

      - name: Upload secondary-app Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-apps-playwright-report
          path: |
            apps/admin-console/playwright-report/
            apps/admin-console/test-results/
            apps/developer-portal/playwright-report/
            apps/developer-portal/test-results/
            apps/install-wizard/playwright-report/
            apps/install-wizard/test-results/
            apps/public-website/playwright-report/
            apps/public-website/test-results/
            apps/registration-portal/playwright-report/
            apps/registration-portal/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # CI Aggregate — required merge gate (W1-OPS-05 B2)
  # ---------------------------------------------------------------------------
  # Always runs (even when upstream jobs skip) and fails closed when any
  # required job failed/cancelled or was skipped without a proven path-filter
  # justification. Branch protection should require this job name instead of
  # individual matrix jobs that can cascade-skip to green.
  # ---------------------------------------------------------------------------
  ci-aggregate:
    name: CI Aggregate (Required)
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - lint
      - typecheck
      - unit-test
      - build
      - bundle-budget
      - lighthouse
      - integration-test
      - dod-checks
      - tenant-isolation
      - restore-drill-evidence
      - prisma-sql-drift
      - strict-tenant-fks
      - tenant-id-indexes
      - migration-timeouts
      - codeowners-gate
      - runtime-table-privileges
      - secondary-apps-e2e
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI results (fail closed on failures and unproven skips)
        env:
          PACKAGES_CHANGED: ${{ needs.detect-changes.outputs.packages-changed }}
          APPS_CHANGED: ${{ needs.detect-changes.outputs.apps-changed }}
          SHARED_CHANGED: ${{ needs.detect-changes.outputs.has-shared-changes }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.has-frontend-changes }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.has-backend-changes }}
          INFRA_CHANGED: ${{ needs.detect-changes.outputs.infra-changed }}
          SECONDARY_APPS_CHANGED: ${{ needs.detect-changes.outputs.secondary-apps-changed }}
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUNDLE_BUDGET_RESULT: ${{ needs.bundle-budget.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration-test.result }}
          DOD_CHECKS_RESULT: ${{ needs.dod-checks.result }}
          TENANT_ISOLATION_RESULT: ${{ needs.tenant-isolation.result }}
          RESTORE_DRILL_EVIDENCE_RESULT: ${{ needs.restore-drill-evidence.result }}
          PRISMA_SQL_DRIFT_RESULT: ${{ needs.prisma-sql-drift.result }}
          STRICT_TENANT_FKS_RESULT: ${{ needs.strict-tenant-fks.result }}
          TENANT_ID_INDEXES_RESULT: ${{ needs.tenant-id-indexes.result }}
          MIGRATION_TIMEOUTS_RESULT: ${{ needs.migration-timeouts.result }}
          CODEOWNERS_GATE_RESULT: ${{ needs.codeowners-gate.result }}
          RUNTIME_TABLE_PRIVILEGES_RESULT: ${{ needs.runtime-table-privileges.result }}
          SECONDARY_APPS_E2E_RESULT: ${{ needs.secondary-apps-e2e.result }}
        run: node tools/scripts/ci-aggregate-gate.mjs
