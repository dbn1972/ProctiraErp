# =============================================================================
# CI Pipeline - ProctiraERP Unified Platform
# =============================================================================
# Runs on every push and pull request to protected base branches.
# Stages: detect → lint/type-check → test → build → specialized gates → required.
# Core jobs always report; path-specific jobs may skip only when inapplicable.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

jobs:
  # ---------------------------------------------------------------------------
  # Detect which packages/apps changed to enable selective builds
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Affected Modules
    runs-on: ubuntu-latest
    outputs:
      packages-changed: ${{ steps.filter.outputs.packages }}
      apps-changed: ${{ steps.filter.outputs.apps }}
      infra-changed: ${{ steps.filter.outputs.infra }}
      compose-changed: ${{ steps.filter.outputs.compose }}
      docker-changed: ${{ steps.filter.outputs.docker }}
      k8s-changed: ${{ steps.filter.outputs.k8s }}
      code-changed: ${{ steps.filter.outputs.code }}
      has-backend-changes: ${{ steps.filter.outputs.backend }}
      has-frontend-changes: ${{ steps.filter.outputs.frontend }}
      has-shared-changes: ${{ steps.filter.outputs.shared }}
      tenant-critical-changed: ${{ steps.filter.outputs.tenant-critical }}
      flutter-changed: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            apps:
              - 'apps/**'
            code:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'plugins/**'
              - 'themes/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.eslintrc*'
              - '.prettier*'
              - 'vitest*.{ts,js,mts,mjs}'
            governance:
              - '.github/**'
              - '.kiro/**'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'docs/**'
            infra:
              - 'infrastructure/**'
              - 'infra/**'
              - 'Dockerfile*'
              - '**/Dockerfile*'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            compose:
              - 'docker-compose*.yml'
              - 'infrastructure/**/docker-compose*.yml'
              - 'infra/**/docker-compose*.yml'
            docker:
              - 'Dockerfile*'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
            k8s:
              - 'infrastructure/k8s/**'
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
              - 'apps/api-gateway/**'
              - 'apps/etl-worker/**'
            frontend:
              - 'packages/ui/**'
              - 'apps/admin-console/**'
              - 'apps/developer-portal/**'
              - 'apps/install-wizard/**'
              - 'apps/public-website/**'
              - 'apps/registration-portal/**'
              - 'apps/web/**'
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'pnpm-lock.yaml'
            tenant-critical:
              - 'apps/api-gateway/**'
              - 'packages/backend/**'
              - 'packages/shared/**'
              - 'tools/tenant-isolation-tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            flutter:
              - 'apps/mobile/**'
              - 'packages/flutter-core/**'

  # ---------------------------------------------------------------------------
  # Lint - ESLint + Prettier check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint on affected sources
        if: needs.detect-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Comparison base unavailable; running full ESLint.'
            pnpm lint
            exit 0
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' |
              grep -vE '(^|/)(dist|\.next|coverage|node_modules)/' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No affected TS/JS sources; ESLint is not applicable.'
            exit 0
          fi
          printf 'Linting %s affected source file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          pnpm exec eslint --no-error-on-unmatched-pattern "${files[@]}"

      - name: Run accessibility ESLint scan (icon-only buttons)
        if: needs.detect-changes.outputs.has-frontend-changes == 'true'
        run: pnpm run lint:a11y

      - name: Run contrast gate (Requirement 37 AC 2 — light + dark modes)
        if: needs.detect-changes.outputs.has-frontend-changes == 'true'
        run: pnpm run check:contrast

      - name: Run brand-neutrality ESLint scan (no-hardcoded-brand-strings)
        if: needs.detect-changes.outputs.has-frontend-changes == 'true'
        run: pnpm run lint:brand

      - name: Check hardcoded brand strings (non-TypeScript assets)
        if: needs.detect-changes.outputs.has-frontend-changes == 'true'
        run: pnpm run check:brand-strings

      - name: Explain non-code lint scope
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo 'No code paths changed; ESLint is not applicable.'

      - name: Check formatting (repo-wide, G-733)
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Type Check - TypeScript compilation
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking for affected packages
        if: needs.detect-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            pnpm turbo run typecheck --filter="...[$BASE_SHA]"
          else
            echo 'Comparison base unavailable; running full typecheck.'
            pnpm typecheck
          fi

      - name: Explain non-code typecheck scope
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo 'No code paths changed; TypeScript checking is not applicable.'

  # ---------------------------------------------------------------------------
  # Unit Tests - Vitest + fast-check property tests
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run unit tests for affected packages
        if: needs.detect-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            pnpm turbo run test --filter="...[$BASE_SHA]"
          else
            echo 'Comparison base unavailable; running full unit test suite.'
            pnpm test
          fi
        env:
          CI: true

      - name: Explain non-code test scope
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo 'No code paths changed; unit tests are not applicable.'

      - name: Upload test coverage
        if: always() && needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage/'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build - Production build of affected packages
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        if: needs.detect-changes.outputs.code-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            pnpm turbo run build --filter="...[$BASE_SHA]"
          else
            echo 'Comparison base unavailable; running full workspace build.'
            pnpm build
          fi
        env:
          NODE_ENV: production

      - name: Explain non-code build scope
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo 'No code paths changed; production builds are not applicable.'

      - name: Upload build artifacts
        if: needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist/
            apps/*/.next/
            packages/*/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Bundle Budget Gate (Requirement 39 AC 1 — Design §J — task 60.6)
  # ---------------------------------------------------------------------------
  # Runs `pnpm check:bundle` against the Next.js build produced for
  # `apps/web`. The gate fails the pipeline when any of the named routes
  # (`/auth/signin`, `/app/dashboard`, `/app/attendance`) ships more than
  # 500 KB gzip in initial chunks. Implemented in
  # `tools/scripts/check-bundle.mjs`; per-route output is kept in the CI
  # log for change-by-change tracking and the JSON report + bundle
  # visualizer HTML (when emitted) are archived as PR-reviewable artifacts.
  # ---------------------------------------------------------------------------
  bundle-budget:
    name: Bundle Budget (Requirement 39 AC 1)
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.has-frontend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web (production)
        run: pnpm --filter @proctira/web build
        env:
          NODE_ENV: production
          ANALYZE: 'true'

      - name: Run bundle budget gate
        # Exits non-zero when any named route's initial chunks exceed
        # 500 KB gzip — that failure propagates here and fails the job,
        # satisfying the second bullet of task 60.6 ("Fail the build on
        # any over-budget chunk").
        run: pnpm run check:bundle --no-build

      - name: Generate bundle budget JSON report
        if: always()
        run: pnpm run check:bundle --no-build --json --quiet > bundle-budget.json
        continue-on-error: true

      - name: Archive bundle budget JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          path: bundle-budget.json
          retention-days: 30

      - name: Archive bundle visualizer HTML (when emitted)
        # The Next.js bundle analyzer (enabled via ANALYZE=true) emits
        # client.html and nodejs.html under `.next/analyze/`. The Vite
        # SPA build emits `dist/bundle-analysis.html`. Upload whichever
        # exists so reviewers can inspect chunk sizes per PR (task 60.6
        # — "Enable bundle visualizer in CI").
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-visualizer
          path: |
            apps/web/.next/analyze/
            apps/web/dist/bundle-analysis.html
            apps/web/dist/bundle-stats.html
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Lighthouse Gate (Requirement 39 AC 2 — Property F-10 — Design §J)
  # ---------------------------------------------------------------------------
  # Runs `pnpm -F @proctira/web check:lighthouse` after the Next.js
  # production build. The gate audits the routes named in Requirement 39
  # (`/auth/signin`, `/app/dashboard`, `/app/attendance`) under two
  # profiles — desktop and simulated 3G mobile (1.6 Mbps downlink, 750 ms
  # RTT, 4× CPU slowdown). Categories collected: accessibility (axe-core),
  # performance, best-practices, seo. The build fails when any category
  # score drops below: Accessibility 0.95, Performance 0.80, Best
  # Practices 0.90, SEO 0.90 (Property F-10).
  #
  # Authenticated routes are evaluated only when the workflow exposes a
  # session cookie via `LHCI_AUTH_COOKIE` (a JSON-encoded array suitable
  # for Puppeteer `page.setCookie`). Without it the wrapper logs a
  # warning and audits the anonymous `/login` surface only — matching the
  # spec's implementation note for task 55.7.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse Gate (Property F-10)
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.has-frontend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true'
    env:
      LHCI_PORT: '3001'
      LHCI_BASE_URL: 'http://localhost:3001'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web (production)
        run: pnpm --filter @proctira/web build
        env:
          NODE_ENV: production

      - name: Start apps/web (production)
        run: |
          pnpm --filter @proctira/web start --port "$LHCI_PORT" > /tmp/web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /login to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$LHCI_BASE_URL/login" -o /dev/null; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "apps/web did not become ready on $LHCI_BASE_URL" >&2
          tail -n 200 /tmp/web.log >&2 || true
          exit 1

      - name: Run Lighthouse gate (desktop + mobile-3g)
        run: pnpm --filter @proctira/web check:lighthouse --strict

      - name: Stop apps/web
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then kill "$WEB_PID" 2>/dev/null || true; fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tools/scripts/.lighthouseci/
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Integration Tests - Requires infrastructure services
  # ---------------------------------------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    if: needs.detect-changes.outputs.has-backend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Bootstrap as postgres, then run suites as a NOSUPERUSER /
          # NOBYPASSRLS application role so tenant-isolation assertions are real.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision non-superuser app role and database
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE proctira LOGIN PASSWORD 'proctira_test' NOSUPERUSER NOBYPASSRLS NOCREATEROLE;" \
            -c 'CREATE DATABASE proctira_test OWNER proctira;'
          psql -h localhost -U postgres -d proctira_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
          PGPASSWORD=proctira_test psql -h localhost -U proctira -d proctira_test -Atc \
            "SELECT CASE WHEN rolsuper OR rolbypassrls THEN 'ERROR: test role bypasses RLS' ELSE 'app role OK: RLS enforced' END FROM pg_roles WHERE rolname = current_user" \
            | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '^app role OK'

      - name: Run database migrations
        run: pnpm --filter @proctira/database run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test

      - name: Apply domain SQL schemas
        run: bash tools/scripts/apply-sql.sh
        env:
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test
          APPLY_SEEDS: '1'

      - name: Run backend Postgres repository suites
        run: pnpm turbo run test --filter='./packages/backend/*' --force --continue
        env:
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true

      - name: Run integration tests
        run: pnpm turbo run test:e2e
        env:
          DATABASE_URL: postgresql://proctira:proctira_test@localhost:5432/proctira_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/test-results/'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Definition-of-Done — Charter Compliance Release Gate
  # ---------------------------------------------------------------------------
  # Charter §32 (Definition of Done). Runs the seven automated checks in
  # tools/dod-checks/ as a release gate; a non-zero exit blocks the merge.
  # The detailed workflow definition-of-done.yml runs the same job in
  # isolation when only DoD-relevant paths change; this entry keeps the
  # gate present in the affected-modules pipeline as well.
  # ---------------------------------------------------------------------------
  dod-checks:
    name: Definition of Done (Charter §32)
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Definition-of-Done checks
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm run check:dod

      - name: Run DoD check unit tests
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: pnpm run check:dod:test

      - name: Page-wise regression matrix is complete and current (G-804)
        if: needs.detect-changes.outputs.code-changed == 'true'
        run: node tools/scripts/page-regression-matrix.mjs --check

      - name: Explain non-code Definition-of-Done scope
        if: needs.detect-changes.outputs.code-changed != 'true'
        run: echo 'No code paths changed; Definition-of-Done code checks are not applicable.'

      - name: Upload DoD JSON report
        if: always() && needs.detect-changes.outputs.code-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dod-report
          path: tools/dod-checks/reports/dod-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Tenant Isolation Verification - Release Gate
  # ---------------------------------------------------------------------------
  # This job runs the comprehensive tenant isolation test suite and MUST pass
  # before any release. It verifies data isolation across all layers:
  # query scoping, auth boundaries, HTTP, event routing, search, cache, and
  # reports. The gate is implemented as a dedicated package
  # (@proctira/tenant-isolation-tests) under tools/tenant-isolation-tests.
  # Charter: Section 39 (Tenant Isolation Verification)
  # ---------------------------------------------------------------------------
  tenant-isolation:
    name: Tenant Isolation Verification (Release Gate)
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run unit isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:unit
        env:
          CI: true

      - name: Run integration isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:integration
        env:
          CI: true

      - name: Run queue/event isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:queue
        env:
          CI: true

      - name: Run search isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:search
        env:
          CI: true

      - name: Run cache isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:cache
        env:
          CI: true

      - name: Run report isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:report
        env:
          CI: true

      - name: Run E2E isolation tests
        if: needs.detect-changes.outputs.tenant-critical-changed == 'true'
        run: pnpm test:tenant-isolation:e2e
        env:
          CI: true

      - name: Explain non-tenant-critical scope
        if: needs.detect-changes.outputs.tenant-critical-changed != 'true'
        run: echo 'No tenant-critical paths changed; tenant-isolation suites are not applicable.'

      - name: Upload tenant isolation test results
        if: always() && needs.detect-changes.outputs.tenant-critical-changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-results
          path: |
            tools/tenant-isolation-tests/test-results/
            tools/tenant-isolation-tests/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flutter validation - explicit success when mobile paths are not affected
  # ---------------------------------------------------------------------------
  flutter-validation:
    name: Flutter Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.flutter-changed == 'true'

      - name: Read pinned Flutter revision
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        id: flutter-metadata
        shell: bash
        run: |
          set -euo pipefail
          revision="$(awk -F'"' '/^[[:space:]]+revision:/ { print $2; exit }' apps/mobile/.metadata)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::apps/mobile/.metadata does not contain a full Flutter revision.'
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Install pinned Flutter SDK
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        shell: bash
        env:
          FLUTTER_REVISION: ${{ steps.flutter-metadata.outputs.revision }}
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/flutter"
          git init "$sdk"
          git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$sdk" checkout --detach FETCH_HEAD
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter toolchain
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        run: |
          flutter config --no-analytics
          flutter --version
          dart --version

      - name: Resolve API client dependencies
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: packages/flutter-core/api-client
        run: dart pub get --enforce-lockfile

      - name: Check API client formatting
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: packages/flutter-core/api-client
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze API client
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: packages/flutter-core/api-client
        run: dart analyze --fatal-infos

      - name: Resolve mobile dependencies
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Check mobile Dart formatting
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze mobile app
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos --no-pub

      - name: Run mobile unit and widget tests
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter test --no-pub --reporter=expanded --coverage test

      - name: Run aggregated mobile journeys
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter test --no-pub --reporter=expanded integration_test/app_test.dart

      - name: Run standalone offline-attendance journeys
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter test --no-pub --reporter=expanded integration_test/attendance_offline_test.dart

      - name: Run standalone login journeys
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter test --no-pub --reporter=expanded integration_test/login_flow_test.dart

      - name: Build Android debug application
        if: needs.detect-changes.outputs.flutter-changed == 'true'
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

      - name: Explain non-Flutter scope
        if: needs.detect-changes.outputs.flutter-changed != 'true'
        run: echo 'No Flutter paths changed; mobile validation is not applicable.'

  # ---------------------------------------------------------------------------
  # Infrastructure validation - explicit success when not applicable
  # ---------------------------------------------------------------------------
  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - name: Explain non-infrastructure scope
        if: needs.detect-changes.outputs.infra-changed != 'true'
        run: echo 'No infrastructure paths changed; infrastructure validation is not applicable.'

      - name: Validate Docker Compose configurations
        if: needs.detect-changes.outputs.compose-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(docker-compose*.yml infrastructure/**/docker-compose*.yml infra/**/docker-compose*.yml)
          for file in "${files[@]}"; do
            echo "Validating $file"
            docker compose --env-file .env.example -f "$file" config --quiet
          done

      - name: Validate Dockerfiles
        if: needs.detect-changes.outputs.docker-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'Dockerfile*' '**/Dockerfile' '**/Dockerfile.*')
          for file in "${files[@]}"; do
            echo "Checking $file"
            docker build --check --file "$file" .
          done

      - name: Render every Kustomize target
        if: needs.detect-changes.outputs.k8s-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kustomize"
          mkdir -p "$out"
          targets=(base overlays/development overlays/staging overlays/production)
          for target in "${targets[@]}"; do
            name="${target//\//-}"
            echo "Rendering infrastructure/k8s/$target"
            docker run --rm \
              -v "$PWD:/work:ro" -w /work \
              registry.k8s.io/kustomize/kustomize:v5.0.3@sha256:4e2f582b2ceaaf374013f85cf7462e87ccbe1d796b70e850ef5534e52c90b007 \
              build "infrastructure/k8s/$target" > "$out/$name.yaml"
            test -s "$out/$name.yaml"
          done

      - name: Validate rendered Kubernetes schemas
        if: needs.detect-changes.outputs.k8s-changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/kustomize:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict -summary -kubernetes-version 1.27.0 \
            /manifests/base.yaml \
            /manifests/overlays-development.yaml \
            /manifests/overlays-staging.yaml \
            /manifests/overlays-production.yaml

      - name: Explain delegated infrastructure scope
        if: needs.detect-changes.outputs.infra-changed == 'true' && needs.detect-changes.outputs.compose-changed != 'true' && needs.detect-changes.outputs.docker-changed != 'true' && needs.detect-changes.outputs.k8s-changed != 'true'
        run: echo 'Helm and observability validation are delegated to their dedicated workflows.'

  # ---------------------------------------------------------------------------
  # Stable aggregate check for branch protection
  # ---------------------------------------------------------------------------
  required:
    name: Required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - lint
      - typecheck
      - unit-test
      - build
      - bundle-budget
      - lighthouse
      - integration-test
      - dod-checks
      - tenant-isolation
      - flutter-validation
      - infrastructure-validation
    env:
      DETECT_RESULT: ${{ needs.detect-changes.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      UNIT_RESULT: ${{ needs.unit-test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DOD_RESULT: ${{ needs.dod-checks.result }}
      TENANT_RESULT: ${{ needs.tenant-isolation.result }}
      FLUTTER_RESULT: ${{ needs.flutter-validation.result }}
      INFRA_RESULT: ${{ needs.infrastructure-validation.result }}
      BUNDLE_RESULT: ${{ needs.bundle-budget.result }}
      LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
      INTEGRATION_RESULT: ${{ needs.integration-test.result }}
      FRONTEND_EXPECTED: ${{ needs.detect-changes.outputs.has-frontend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true' }}
      INTEGRATION_EXPECTED: ${{ needs.detect-changes.outputs.has-backend-changes == 'true' || needs.detect-changes.outputs.has-shared-changes == 'true' }}
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local label="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${label} finished with '${result}', expected 'success'."
              failed=1
            fi
          }

          require_optional() {
            local label="$1"
            local expected="$2"
            local result="$3"
            if [ "$expected" = "true" ]; then
              require_success "$label" "$result"
            elif [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::${label} finished with '${result}' while not applicable."
              failed=1
            fi
          }

          require_success 'Detect Affected Modules' "$DETECT_RESULT"
          require_success 'Lint' "$LINT_RESULT"
          require_success 'Type Check' "$TYPECHECK_RESULT"
          require_success 'Unit Tests' "$UNIT_RESULT"
          require_success 'Build' "$BUILD_RESULT"
          require_success 'Definition of Done' "$DOD_RESULT"
          require_success 'Tenant Isolation' "$TENANT_RESULT"
          require_success 'Flutter Validation' "$FLUTTER_RESULT"
          require_success 'Infrastructure Validation' "$INFRA_RESULT"
          require_optional 'Bundle Budget' "$FRONTEND_EXPECTED" "$BUNDLE_RESULT"
          require_optional 'Lighthouse' "$FRONTEND_EXPECTED" "$LIGHTHOUSE_RESULT"
          require_optional 'Integration Tests' "$INTEGRATION_EXPECTED" "$INTEGRATION_RESULT"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo 'All required and applicable CI gates passed.'
