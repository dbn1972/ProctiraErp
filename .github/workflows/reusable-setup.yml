# =============================================================================
# Reusable Setup Workflow - ProctiraERP Unified Platform
# =============================================================================
# Shared setup for Node.js, pnpm, and optional dependency install.
# Called by active workflows (W1-OPS-24) so this file cannot drift unused.
# For in-job reuse, prefer .github/actions/setup-node-pnpm (this workflow wraps
# that composite and smoke-checks the toolchain).
# =============================================================================

name: Reusable Setup

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      pnpm-version:
        description: 'pnpm version'
        required: false
        type: string
        default: '10.33.2'
      install-dependencies:
        description: 'Whether to install dependencies'
        required: false
        type: boolean
        default: true
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          install-dependencies: ${{ inputs.install-dependencies }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Smoke-check toolchain
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          if [ "${{ inputs.install-dependencies }}" = "true" ]; then
            test -d node_modules
          fi
