# =============================================================================
# Deploy Pipeline - ProctiraERP Unified Platform
# =============================================================================
# Gated on successful completion of the CI workflow for the same commit, so
# only commits that pass lint, type-check, unit tests, build, and integration
# tests are deployed. Builds container images for affected services, pushes to
# the registry, and deploys to the appropriate environment via Helm.
#
# Topology (W1-OPS-16): default path is canonical in-process gateway
# (api-gateway + edge apps + etl-worker). Split-domain service names are
# lab-only — pass them explicitly via workflow_dispatch inputs.services.
# See docs/DEPLOYMENT_TOPOLOGY.md.
#
# Image coordinates match release.yml:
#   {CONTAINER_REGISTRY||ghcr.io}/{IMAGE_NAMESPACE||repository_owner}/proctira/service:<tag>
# tools/scripts/image-repository.sh lowercases the host, namespace, and service
# so GHCR accepts the name. Cosign stays on release.yml (same repository).
#
# Triggers:
#   - workflow_run: After CI completes successfully on main/develop
#   - workflow_dispatch: Manual deploy for any ref (with optional service list)
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Comma-separated services to deploy (empty = affected only)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Same registry/namespace inputs as release.yml. The image script lowercases them.
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Only proceed if the upstream CI run succeeded (workflow_run trigger).
  # workflow_dispatch bypasses this gate.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    # PRC-H061: a workflow_run must come from a successful CI *push* run whose
    # head repository is this repository. A fork PR from a branch named `main`
    # also triggers workflow_run with head_branch == 'main'; without these
    # checks it could build/migrate/deploy fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      head-branch: ${{ steps.resolve.outputs.head-branch }}
    steps:
      # PRC-M256: context values reach the shell only through env (never inline in script).
      - name: Resolve commit and branch
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            HEAD_SHA="${RUN_HEAD_SHA}"
            HEAD_BRANCH="${RUN_HEAD_BRANCH}"
          else
            HEAD_SHA="${PUSH_SHA}"
            HEAD_BRANCH="${PUSH_REF_NAME}"
          fi
          # PRC-M256: a SHA is hex; a branch name must not smuggle newlines/quotes into outputs.
          if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head SHA format"
            exit 1
          fi
          if ! [[ "${HEAD_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected branch name format"
            exit 1
          fi
          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "head-branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${HEAD_SHA} from branch ${HEAD_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
      # Defense in depth for PRC-H061: fail (not skip) if the job-level guard
      # is ever weakened, and prove the SHA is on the protected branch.
      - name: Assert trusted push-triggered CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
          HEAD_BRANCH: ${{ steps.resolve.outputs.head-branch }}
        run: |
          if [ "${RUN_EVENT}" != "push" ]; then
            echo "::error::Refusing workflow_run from event '${RUN_EVENT}' (only 'push' may deploy/release)"
            exit 1
          fi
          if [ "${HEAD_REPO}" != "${THIS_REPO}" ]; then
            echo "::error::Refusing workflow_run from head repository '${HEAD_REPO}' (expected '${THIS_REPO}')"
            exit 1
          fi
          # Ancestor check: HEAD_SHA must be reachable from the protected branch.
          STATUS="$(gh api "repos/${THIS_REPO}/compare/${HEAD_BRANCH}...${HEAD_SHA}" --jq .status)"
          case "${STATUS}" in
            identical | behind) echo "${HEAD_SHA} is on ${HEAD_BRANCH}" ;;
            *)
              echo "::error::${HEAD_SHA} is not an ancestor of ${HEAD_BRANCH} (compare status: ${STATUS})"
              exit 1
              ;;
          esac

      # W1-OPS-23: manual deploys must prove the selected SHA passed CI before
      # any migration or rollout job can run.
      - name: Checkout same-SHA CI gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.head-sha }}
          sparse-checkout: |
            tools/scripts/require-same-sha-ci.mjs
          sparse-checkout-cone-mode: false

      - name: Require successful CI on same SHA (manual deploy)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: node tools/scripts/require-same-sha-ci.mjs --sha "${HEAD_SHA}"

  # ---------------------------------------------------------------------------
  # Determine environment and affected services
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      services: ${{ steps.affected.outputs.services }}
      image-tag: ${{ steps.meta.outputs.tag }}
      can-deploy: ${{ steps.registry.outputs.can_deploy }}
      record-base: ${{ steps.affected.outputs.record-base }}
    # #555 review #1: reads the recorded diff base (Deployments API).
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}
          fetch-depth: 0

      - name: Determine environment
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ needs.ci-gate.outputs.head-branch }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${INPUT_ENVIRONMENT}" in
              staging|production) ;;
              *) echo "::error::Unknown environment"; exit 1 ;;
            esac
            echo "environment=${INPUT_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          elif [ "${RUN_EVENT}" = "push" ] && [ "${HEAD_BRANCH}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image tag
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${SHA_SHORT}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      # W1-OPS-15: never soft-succeed a production deploy when registry secrets
      # are absent. Staging may set can_deploy=false so build/deploy skip, but
      # deploy-secrets-gate fails the workflow aggregate (no greenwash).
      - name: Check registry credentials
        id: registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "::error::W1-OPS-15: Production deploy requires REGISTRY_USERNAME and REGISTRY_PASSWORD — refusing silent skip."
            exit 1
          fi
          echo "::error::W1-OPS-15: REGISTRY_USERNAME/REGISTRY_PASSWORD not configured — build/deploy jobs will be skipped; deploy-secrets-gate will fail this workflow."

      - name: Detect affected services
        id: affected
        env:
          MANUAL_SERVICES: ${{ inputs.services }}
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          HEAD_SHA: ${{ needs.ci-gate.outputs.head-sha }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_SERVICES:-}" ]; then
            # PRC-M256 / #555 review #7: format + services.json allowlist check
            # BEFORE anything reaches GITHUB_OUTPUT (a raw newline would inject
            # extra outputs into the secret-bearing build/deploy jobs).
            SERVICES=$(node tools/scripts/detect-affected-services.mjs validate --workflow deploy \
              --services "${MANUAL_SERVICES}")
            echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
            # A subset deploy must not advance the diff base for every service.
            echo "record-base=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PRC-M259 / #555 review #1: diff every commit since the SHA this
          # environment last fully deployed. record-diff-base stores that SHA
          # (a workflow_run headSha is the default-branch tip at trigger time,
          # not what was deployed). Service paths live in tools/scripts/services.json;
          # no record, an API error or a non-ancestor base fans out to every
          # canonical service.
          BASE_SHA=$(node tools/scripts/deploy-diff-base.mjs get --scope "${ENVIRONMENT}")
          echo "Diff base (${ENVIRONMENT}): ${BASE_SHA:-<none; full canonical fan-out>}"
          SERVICES=$(node tools/scripts/detect-affected-services.mjs affected --workflow deploy \
            --base "${BASE_SHA:-}" --head "$HEAD_SHA")
          echo "Affected services: ${SERVICES:-<none>}"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "record-base=true" >> "$GITHUB_OUTPUT"
  # ---------------------------------------------------------------------------
  # W1-OPS-15 — Explicit secrets gate (aggregate fail when deploy was skipped
  # because secrets were missing). Production already fails in prepare; this
  # job catches staging soft-skips so the workflow cannot report success.
  # ---------------------------------------------------------------------------
  deploy-secrets-gate:
    name: Deploy secrets gate (W1-OPS-15)
    runs-on: ubuntu-latest
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    steps:
      - name: Fail closed when required deploy secrets are missing
        env:
          CAN_DEPLOY: ${{ needs.prepare.outputs.can-deploy }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          if [ "$CAN_DEPLOY" = "true" ]; then
            echo "Deploy secrets present for ${ENVIRONMENT} — OK"
            exit 0
          fi
          echo "::error::W1-OPS-15: Deploy secrets missing for ${ENVIRONMENT}. Image build/push and Helm deploy were skipped; failing aggregate (no greenwash)."
          exit 1

  # ---------------------------------------------------------------------------
  # Convert services string to JSON array for matrix
  # ---------------------------------------------------------------------------
  matrix-prep:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.services != '' && needs.prepare.outputs.can-deploy == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Convert services to matrix JSON
        id: set-matrix
        env:
          SERVICES: ${{ needs.prepare.outputs.services }}
        run: |
          # Convert comma-separated to JSON array
          JSON=$(echo "$SERVICES" | jq -R -c 'split(",")')
          echo "matrix={\"service\":${JSON}}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build and push container images
  # ---------------------------------------------------------------------------
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, matrix-prep]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Determine Dockerfile and build args
        id: docker-config
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # PRC-M259: shared manifest (tools/scripts/services.json) for every app.
          node tools/scripts/detect-affected-services.mjs docker-config --service "$SERVICE" >> "$GITHUB_OUTPUT"
      - name: Compute image repository
        id: image-ref
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
        run: |
          set -euo pipefail
          # Canonical repository: ghcr.io/<owner>/proctira/service (lowercased).
          repo="$(bash tools/scripts/image-repository.sh "$REGISTRY" "$IMAGE_NAMESPACE" "$SERVICE")"
          echo "repository=${repo}" >> "$GITHUB_OUTPUT"
          echo "reference=${repo}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ steps.docker-config.outputs.dockerfile }}
          push: true
          # W1-OPS-08 — immutable tag only (no mutable :latest).
          # Owner-qualified path, same as release.yml (namespace lowercased).
          tags: ${{ steps.image-ref.outputs.reference }}
          build-args: ${{ steps.docker-config.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ---------------------------------------------------------------------------
  # UP-P0-02 — Apply target migrations before any application rollout.
  # MIGRATOR_DATABASE_URL is a GitHub Environment secret scoped to this job;
  # it is never rendered into Helm values or mounted into application pods.
  # ---------------------------------------------------------------------------
  migrate-database:
    name: Migrate target database
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, build-images]
    if: needs.prepare.outputs.can-deploy == 'true'
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install migration dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply and verify target schema as migrator
        env:
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL }}
          MIGRATOR_ROLE_EXPECTED: proctira
        run: bash tools/scripts/run-target-database-migrations.sh

  # ---------------------------------------------------------------------------
  # Deploy to target environment via Helm
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ needs.prepare.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, build-images, migrate-database, runtime-role-gate]
    if: needs.prepare.outputs.can-deploy == 'true' && needs.build-images.result == 'success' && needs.migrate-database.result == 'success' && needs.runtime-role-gate.result == 'success'
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v3.14.0'

      - name: Deploy services via Helm
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
          SERVICE_LIST: ${{ needs.prepare.outputs.services }}
          # PRC-H062: secrets reach pods only through External Secrets. The store
          # name is a GitHub *environment variable* (not a secret value).
          EXTERNAL_SECRET_STORE: ${{ vars.EXTERNAL_SECRET_STORE }}
        run: |
          NAMESPACE="proctira-${ENVIRONMENT}"

          # PRC-H062: fail closed. Without a secret store the release would start
          # pods with no DATABASE_URL / JWT_SECRET and be rolled back by --atomic
          # only after a confusing boot failure, or run half-configured.
          if [ -z "${EXTERNAL_SECRET_STORE}" ]; then
            echo "::error::vars.EXTERNAL_SECRET_STORE is not set for the ${ENVIRONMENT} environment (PRC-H062)" >&2
            exit 1
          fi
          SHARED_REMOTE_KEY="proctira/${ENVIRONMENT}/shared"

          IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICE_LIST"

          for SERVICE in "${SERVICE_ARRAY[@]}"; do
            # PRC-H062: durable workers (etl-worker, exam-document-worker) are
            # deployed by the proctira-platform chart (deploy-platform job), not
            # the HTTP-oriented thin chart. The thin chart would mis-port them
            # (targetPort 3000 / /health). They are still built as images above.
            case "${SERVICE}" in
              etl-worker|exam-document-worker)
                echo "Skipping ${SERVICE} in thin-chart deploy (handled by deploy-platform)."
                continue
                ;;
            esac
            echo "Deploying ${SERVICE} to ${ENVIRONMENT}..."
            IMAGE_REPOSITORY="$(bash tools/scripts/image-repository.sh "$REGISTRY" "$IMAGE_NAMESPACE" "$SERVICE")"

            # W1-OPS-09: --atomic auto-rolls back the release on failure;
            # --wait blocks until resources are ready (or timeout).
            # Supported mode: single-wave RollingUpdate maxUnavailable=0.
            # Optional canary annotations: --set progressiveDelivery.canary.enabled=true
            # (hooks only — not a proven prod canary path).
            # PRC-H062 / PRC-M279: per-service key allowlist from the shared
            # bundle; a service missing from serviceKeys fails the render.
            helm upgrade --install "proctira-${SERVICE}" \
              ./infrastructure/helm/proctira-service \
              --namespace "${NAMESPACE}" \
              --create-namespace \
              --set image.repository="${IMAGE_REPOSITORY}" \
              --set image.tag="${IMAGE_TAG}" \
              --set environment="${ENVIRONMENT}" \
              --set service.name="${SERVICE}" \
              --set externalSecret.enabled=true \
              --set-string externalSecret.secretStoreRef.name="${EXTERNAL_SECRET_STORE}" \
              --set-string externalSecret.sharedRemoteKey="${SHARED_REMOTE_KEY}" \
              --values "./infrastructure/helm/proctira-service/values-${ENVIRONMENT}.yaml" \
              --atomic \
              --wait \
              --timeout 300s
          done

      - name: Verify deployment health
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SERVICE_LIST: ${{ needs.prepare.outputs.services }}
        run: |
          NAMESPACE="proctira-${ENVIRONMENT}"

          IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICE_LIST"

          for SERVICE in "${SERVICE_ARRAY[@]}"; do
            case "${SERVICE}" in
              etl-worker|exam-document-worker)
                continue
                ;;
            esac
            echo "Checking rollout status for ${SERVICE}..."
            kubectl rollout status deployment/"proctira-${SERVICE}" \
              --namespace "${NAMESPACE}" \
              --timeout=120s
          done

      - name: Post deployment notification
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "text": "Deployment to ${{ needs.prepare.outputs.environment }}: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*ProctiraERP Deploy*\n• Environment: `${{ needs.prepare.outputs.environment }}`\n• Services: `${{ needs.prepare.outputs.services }}`\n• Tag: `${{ needs.prepare.outputs.image-tag }}`\n• Status: ${{ job.status }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ---------------------------------------------------------------------------
  # PRC-H062 — deploy the proctira-platform chart (pg-backup + phi-retention
  # CronJobs, Ingress, NetworkPolicy, durable workers incl. exam-document-worker).
  # The thin proctira-service chart above ships only app Deployments; the DR /
  # retention / ingress / network-policy objects live ONLY in proctira-platform
  # and were never applied by CI before this job. Same environment gating and
  # fail-closed-on-missing-required-values discipline as the service deploy.
  # ---------------------------------------------------------------------------
  deploy-platform:
    name: Deploy platform infra to ${{ needs.prepare.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, build-images, migrate-database, runtime-role-gate]
    if: needs.prepare.outputs.can-deploy == 'true' && needs.migrate-database.result == 'success' && needs.runtime-role-gate.result == 'success'
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v3.14.0'

      - name: Deploy proctira-platform chart via Helm
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
          # PRC-H062: the DR CronJobs + workers read DATABASE_URL / BACKUP_* /
          # RABBITMQ_URL from a pre-created cluster Secret (ESO / sealed-secrets).
          # The Secret NAME is a GitHub environment *variable*, never a value.
          PLATFORM_EXISTING_SECRET: ${{ vars.PLATFORM_EXISTING_SECRET }}
        run: |
          NAMESPACE="proctira-${ENVIRONMENT}"

          # PRC-H062: fail closed. Without the operator-provisioned Secret the
          # pg-backup / phi-retention CronJobs would start with no DATABASE_URL
          # and silently never run — exactly the gap this job closes.
          if [ -z "${PLATFORM_EXISTING_SECRET}" ]; then
            echo "::error::vars.PLATFORM_EXISTING_SECRET is not set for the ${ENVIRONMENT} environment (PRC-H062)" >&2
            exit 1
          fi

          IMAGE_REPOSITORY_PREFIX="$(bash tools/scripts/image-repository.sh "$REGISTRY" "$IMAGE_NAMESPACE" "")"

          # W1-OPS-09: --atomic rolls back on failure; --wait blocks on readiness.
          # Images for the in-process topology (api-gateway + edge apps + workers)
          # use the same tag the service deploy just pushed.
          helm upgrade --install proctira-platform \
            ./infrastructure/helm/proctira-platform \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set global.environment="${ENVIRONMENT}" \
            --set-string secrets.existingSecret="${PLATFORM_EXISTING_SECRET}" \
            --set-string examDocumentWorker.image.tag="${IMAGE_TAG}" \
            --set-string etlWorker.image.tag="${IMAGE_TAG}" \
            --values "./infrastructure/helm/proctira-platform/values-${ENVIRONMENT}.yaml" \
            --atomic \
            --wait \
            --timeout 600s

      - name: Verify DR CronJobs and workers exist
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          NAMESPACE="proctira-${ENVIRONMENT}"
          # PRC-H062 / NEW-g3_infra_tools-002: assert the previously-undeployed
          # objects are now present in the target namespace (fail the deploy if
          # the chart did not render them).
          kubectl get cronjob -n "${NAMESPACE}" -l app.kubernetes.io/part-of=proctira-platform \
            -o name | grep -qi 'pg-backup' \
            || { echo "::error::pg-backup CronJob missing after platform deploy (PRC-H062)"; exit 1; }
          kubectl get cronjob -n "${NAMESPACE}" -l app.kubernetes.io/part-of=proctira-platform \
            -o name | grep -qi 'phi-retention' \
            || { echo "::error::phi-retention CronJob missing after platform deploy (PRC-H062)"; exit 1; }
          kubectl rollout status deployment \
            -l app.kubernetes.io/name=exam-document-worker \
            --namespace "${NAMESPACE}" --timeout=120s

  # ---------------------------------------------------------------------------
  # #555 review #1 (PRC-M259): record the SHA this environment now runs, so the
  # next deploy diffs from what was actually deployed. Only after every
  # affected service deployed (or nothing was affected), and never for a
  # manual subset, so a partial deploy cannot hide changes from the next run.
  # ---------------------------------------------------------------------------
  record-diff-base:
    name: Record deploy diff base
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, deploy, deploy-platform]
    if: >-
      always() && needs.ci-gate.result == 'success' && needs.prepare.result == 'success' &&
      needs.prepare.outputs.can-deploy == 'true' && needs.prepare.outputs.record-base == 'true' &&
      needs.deploy-platform.result == 'success' &&
      (needs.deploy.result == 'success' ||
      (needs.prepare.outputs.services == '' && needs.deploy.result == 'skipped'))
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}
          sparse-checkout: |
            tools/scripts/deploy-diff-base.mjs
          sparse-checkout-cone-mode: false
      - name: Record diff base
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          HEAD_SHA: ${{ needs.ci-gate.outputs.head-sha }}
        run: node tools/scripts/deploy-diff-base.mjs record --scope "${ENVIRONMENT}" --sha "${HEAD_SHA}"

  # ---------------------------------------------------------------------------
  # W1-DATA-01 — Required runtime role gate against the *actual* DATABASE_URL
  # secret (GitHub environment secret and/or cluster Secret pods mount).
  # Fails closed when the login role is owner/superuser/BYPASSRLS or owns tables.
  # ---------------------------------------------------------------------------
  runtime-role-gate:
    name: Runtime DB role gate (W1-DATA-01)
    runs-on: ubuntu-latest
    needs: [ci-gate, prepare, migrate-database]
    # Run before Helm so an invalid runtime role or lagging schema blocks rollout.
    if: needs.ci-gate.result == 'success' && needs.prepare.result == 'success' && needs.prepare.outputs.can-deploy == 'true' && needs.migrate-database.result == 'success'
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Assert runtime DATABASE_URL is non-owner (W1-DATA-01)
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          RUNTIME_ROLE_GATE_REQUIRED: '1'
          # Prefer GH environment secret when it mirrors the ExternalSecret remote key.
          # If unset, the script resolves the cluster Secret pods mount
          # (proctira-secrets / proctira-prod-secrets).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUNTIME_ROLE_NAMESPACE: proctira-${{ needs.prepare.outputs.environment }}
          RUNTIME_ROLE_EXPECTED: proctira_app
        run: bash tools/scripts/assert-runtime-database-role.sh

      - name: Assert target schema is ready for this application build (UP-P0-02)
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUNTIME_ROLE_NAMESPACE: proctira-${{ needs.prepare.outputs.environment }}
          RUNTIME_ROLE_EXPECTED: proctira_app
        run: bash tools/scripts/assert-runtime-schema-ready.sh
