# =============================================================================
# Workflow Linting - ProctiraERP Unified Platform
# =============================================================================
# Validates GitHub Actions workflow syntax using actionlint. Runs on PRs that
# touch workflow files and on pushes to protected base branches. Catches issues like
# undefined secrets/variables, invalid expressions, and shellcheck warnings
# in run blocks before they hit the queue.
# =============================================================================

name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main, develop, 'release/**']
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          # Pin to a known-good version so workflow lint output is reproducible.
          version: '1.7.7'
          # shellcheck is bundled and runs against `run:` blocks automatically.
          shellcheck: true
