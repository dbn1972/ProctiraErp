# =============================================================================
# Workflow Linting - ProctiraERP Unified Platform
# =============================================================================
# Validates GitHub Actions workflow syntax using actionlint. Runs on PRs that
# touch workflow files and on push to main/develop. Catches issues like
# undefined secrets/variables, invalid expressions, and shellcheck warnings
# in run blocks before they hit the queue.
#
# W1-OPS-24: also calls the reusable-setup workflow and asserts reusable CI
# assets remain wired so they cannot silently disconnect again.
# =============================================================================

name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - 'tools/scripts/assert-reusable-ci-assets.mjs'
      - 'tools/scripts/assert-reusable-ci-assets.test.mjs'
      - 'tools/scripts/validate-observability.mjs'
      - 'tools/scripts/check-action-pins.mjs'
      - 'tools/scripts/check-action-pins.test.mjs'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - 'tools/scripts/assert-reusable-ci-assets.mjs'
      - 'tools/scripts/assert-reusable-ci-assets.test.mjs'
      - 'tools/scripts/validate-observability.mjs'
      - 'tools/scripts/check-action-pins.mjs'
      - 'tools/scripts/check-action-pins.test.mjs'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          # Pin to a known-good version so workflow lint output is reproducible.
          version: '1.7.7'
          # shellcheck is bundled and runs against `run:` blocks automatically.
          shellcheck: true

      - name: Assert reusable CI assets stay wired (W1-OPS-24)
        run: node tools/scripts/assert-reusable-ci-assets.mjs

      - name: Unit-test reusable CI asset gate
        run: node --test tools/scripts/assert-reusable-ci-assets.test.mjs
      # PRC-M257: third-party actions must be pinned to full commit SHAs.
      - name: Assert third-party actions are SHA-pinned
        run: node tools/scripts/check-action-pins.mjs
      - name: Unit-test action pin gate
        run: node --test tools/scripts/check-action-pins.test.mjs

  # Prefer actually calling the reusable workflow (W1-OPS-24).
  reusable-setup:
    name: Reusable Setup (workflow_call)
    uses: ./.github/workflows/reusable-setup.yml
    with:
      install-dependencies: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
