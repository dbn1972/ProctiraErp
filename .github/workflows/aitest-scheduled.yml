# AI test program — scheduled aitest suites (nightly + weekly).
#
# Runs every suite declared in tools/aitest/src/foundation/suite.json and
# tools/aitest/src/tracks/*/suite.json for the cadence, one matrix leg per
# suite, each on its own throwaway stack (compose project
# proctira-aitest-ci-<suite>, loopback port block 34000-34049, gateway and Next
# apps run from this checkout). Live suites never run in PR CI; their unit
# tests do (@proctira/aitest `test`).
#
# A suite fails its leg when it records a failing case; cases listed in a
# track's pending-fixes.json (known defects awaiting a fix PR) are reported as
# pending-fix and do not fail it. Registered in tools/scripts/scheduled-gates.json
# (watched by scheduled-gates-watchdog.yml).
name: aitest scheduled suites
on:
  workflow_dispatch:
    inputs:
      cadence:
        description: Which cadence's suites to run
        type: choice
        options: [nightly, weekly]
        default: nightly
      suite:
        description: Run only this suite id (optional)
        type: string
        required: false
  schedule:
    # Nightly 01:30 UTC, before the 03:30 lint ratchet and the 04:15 e2e nightly.
    - cron: '30 1 * * *'
    # Weekly, Saturday 02:30 UTC: heavy suites (mutation, chaos, full a11y, ...).
    - cron: '30 2 * * 6'
permissions:
  contents: read
concurrency:
  group: aitest-scheduled-${{ github.ref }}-${{ github.event.schedule || inputs.cadence }}
  cancel-in-progress: false
env:
  PNPM_VERSION: '10.33.2'
  NODE_VERSION: '20'
jobs:
  plan:
    name: plan suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
      cadence: ${{ steps.list.outputs.cadence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: List suites for the cadence
        id: list
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CADENCE: ${{ inputs.cadence }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case "$EVENT_SCHEDULE" in
            '30 2 * * 6') CADENCE=weekly ;;
            '30 1 * * *') CADENCE=nightly ;;
            *) CADENCE="${INPUT_CADENCE:-nightly}" ;;
          esac
          SUITES="$(node tools/aitest/bin/list-suites.mjs --cadence "$CADENCE")"
          if [[ -n "${INPUT_SUITE:-}" ]]; then
            if [[ ! "$INPUT_SUITE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::suite must be lowercase kebab-case"
              exit 1
            fi
            SUITES="$(SUITES="$SUITES" ONE="$INPUT_SUITE" node -e '
              const all = JSON.parse(process.env.SUITES);
              if (!all.includes(process.env.ONE)) { console.error(`suite ${process.env.ONE} is not in this cadence`); process.exit(1); }
              process.stdout.write(JSON.stringify([process.env.ONE]));')"
          fi
          echo "cadence=$CADENCE" >> "$GITHUB_OUTPUT"
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
          echo "## aitest $CADENCE: $SUITES" >> "$GITHUB_STEP_SUMMARY"
  suite:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Install psql and Indic fonts (t11 rendering checks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client fonts-noto-core fonts-indic
      # The aitest block sits inside Linux's ephemeral port range; reserve it on
      # this throwaway runner so outgoing connections never take a stack port.
      - name: Reserve the aitest port block
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=34000-34999
      - name: Install Playwright Chromium
        run: pnpm --filter @proctira/aitest exec playwright install --with-deps chromium
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
          AITEST_GUARD_CMD: ''
          AITEST_STATE_DIR: ${{ runner.temp }}/aitest-state
          AITEST_OUT: ${{ runner.temp }}/aitest-out/${{ matrix.suite }}
        run: bash tools/aitest/bin/aitest-ci.sh "$SUITE"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aitest-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/aitest-out/${{ matrix.suite }}/results.md
            ${{ runner.temp }}/aitest-out/${{ matrix.suite }}/results.json
            ${{ runner.temp }}/aitest-out/${{ matrix.suite }}/findings.csv
            ${{ runner.temp }}/aitest-state/failed/
          if-no-files-found: warn
          retention-days: 30
