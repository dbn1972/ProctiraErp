# =============================================================================
# G-501 — Helm template dry-run (proctira-service + proctira-platform)
# =============================================================================
# Aligns with deploy.yml which installs `./infrastructure/helm/proctira-service`
# as release `proctira-${SERVICE}` with deployment name `proctira-${SERVICE}`.
# =============================================================================

name: Helm Template

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/helm/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/helm-template.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: helm-template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-template:
    name: helm template dry-run (G-501)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint + template proctira-service (deploy.yml shape)
        run: |
          set -euo pipefail
          chart=./infrastructure/helm/proctira-service
          helm lint "$chart"
          for SERVICE in api-gateway web student; do
            echo "::group::template proctira-${SERVICE}"
            out="$(mktemp)"
            helm template "proctira-${SERVICE}" "$chart" \
              --namespace "proctira-staging" \
              --set image.repository="ghcr.io/proctira/${SERVICE}" \
              --set image.tag="sha-ci" \
              --set environment=staging \
              --set service.name="${SERVICE}" \
              --values "${chart}/values-staging.yaml" \
              > "$out"
            grep -q "name: proctira-${SERVICE}" "$out"
            grep -q "kind: Deployment" "$out"
            # G-724: hardened pod spec + staging availability/isolation objects.
            grep -q "readOnlyRootFilesystem: true" "$out"
            grep -q "runAsNonRoot: true" "$out"
            grep -q "kind: ServiceAccount" "$out"
            grep -q "kind: PodDisruptionBudget" "$out"
            grep -q "kind: NetworkPolicy" "$out"
            # Next.js apps probe /api/health; Fastify services probe /health.
            if [ "$SERVICE" = "web" ]; then
              grep -q "path: /api/health" "$out"
            else
              grep -q "path: /health" "$out"
            fi
            echo "OK proctira-${SERVICE}"
            echo "::endgroup::"
          done

          echo "::group::production profile renders HPA + ExternalSecret opt-in"
          out="$(mktemp)"
          helm template proctira-api-gateway "$chart" \
            --namespace proctira-production \
            --set service.name=api-gateway \
            --set image.tag=sha-ci \
            --set externalSecret.enabled=true \
            --set externalSecret.secretStoreRef.name=ci-store \
            --values "${chart}/values-production.yaml" \
            > "$out"
          grep -q "kind: HorizontalPodAutoscaler" "$out"
          grep -q "kind: ExternalSecret" "$out"
          grep -q "name: proctira-api-gateway-env" "$out"
          grep -q "topologySpreadConstraints" "$out"
          echo "::endgroup::"

      - name: Lint + template proctira-platform umbrella
        run: |
          set -euo pipefail
          chart=./infrastructure/helm/proctira-platform
          helm lint "$chart" || true
          # Umbrella chart may need secrets placeholders; dry-run with --debug
          # and tolerate missing optional values by setting common stubs.
          helm template proctira "$chart" \
            --namespace proctira-staging \
            --set global.environment=staging \
            --set secrets.jwtSecret=ci-placeholder \
            --set secrets.databaseUrl=postgresql://ci:ci@localhost:5432/ci \
            -f "${chart}/values-staging.yaml" \
            > /tmp/proctira-platform.yaml
          test -s /tmp/proctira-platform.yaml
          grep -q "proctira-platform\|api-gateway\|kind: Deployment" /tmp/proctira-platform.yaml
          echo "OK proctira-platform ($(wc -l < /tmp/proctira-platform.yaml) lines)"

      # G-707 — DR CronJobs must render with the default values: a daily backup,
      # a weekly PHI-retention run (dry-run), and the PVC they share.
      - name: Assert DR CronJobs render (G-707)
        run: |
          set -euo pipefail
          f=/tmp/proctira-platform.yaml
          test "$(grep -c '^kind: CronJob$' "$f")" -ge 2
          grep -q 'name: proctira-proctira-platform-pg-backup\|name: proctira-pg-backup\|pg-backup$' "$f"
          grep -q 'phi-retention' "$f"
          grep -q 'RETENTION_DRY_RUN' "$f"
          grep -q 'kind: PersistentVolumeClaim' "$f"
          grep -q 'dr-tools' "$f"
          echo "OK DR CronJobs: $(grep -c '^kind: CronJob$' "$f")"
