# =============================================================================
# G-501 / P0-12 — Helm template dry-run (proctira-service + proctira-platform)
# =============================================================================
# Aligns with deploy.yml which installs `./infrastructure/helm/proctira-service`
# as release `proctira-${SERVICE}` with deployment name `proctira-${SERVICE}`.
# Logic lives in tools/scripts/helm-template-check.sh (local + CI parity).
# =============================================================================

name: Helm Template

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/helm/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/helm-template.yml'
      - 'tools/scripts/helm-template-check.sh'
  push:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'
      - '.github/workflows/deploy.yml'
      - 'tools/scripts/helm-template-check.sh'

concurrency:
  group: helm-template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-template:
    name: helm template dry-run (P0-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: Lint + template charts (deploy path check)
        run: ./tools/scripts/helm-template-check.sh
