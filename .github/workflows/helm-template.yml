# =============================================================================
# G-501 / P0-12 / W1-OPS-21 — Helm template dry-run
# =============================================================================
# Aligns with deploy.yml which installs `./infrastructure/helm/proctira-service`
# as release `proctira-${SERVICE}` with deployment name `proctira-${SERVICE}`.
# Logic lives in tools/scripts/helm-template-check.sh (local + CI parity).
#
# W1-OPS-21: also run when gateway / ETL / web probe handlers or HEALTHCHECK
# Dockerfiles change — those edits can break chart probe contracts without
# touching infrastructure/helm/**.
# =============================================================================

name: Helm Template

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/helm/**'
      - 'infrastructure/k8s/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/rollback.yml'
      - '.github/workflows/helm-template.yml'
      - 'tools/scripts/helm-template-check.sh'
      # W1-SEC-07 — application/Helm/Prometheus metrics contract
      - 'packages/shared/observability/src/metrics-access.ts'
      - 'packages/shared/observability/src/fastify-plugin.ts'
      - 'apps/api-gateway/src/app.ts'
      - 'apps/api-gateway/src/config.ts'
      - 'infra/observability/prometheus.yml'
      - 'docs/audits/SEC_METRICS_W1_SEC_07.md'
      - 'docs/audits/SEC_W1_SEC_07_COMPLETE.md'
      - 'tools/scripts/deploy-rollback-check.sh'
      - 'tools/scripts/deploy-secrets-gate-check.sh'
      - 'tools/scripts/check-deploy-workflow-contract.mjs'
      - 'tools/scripts/check-deploy-workflow-contract.test.mjs'
      - 'tools/scripts/check-workflow-step-contracts.mjs'
      - 'tools/scripts/check-no-latest-image-tags.sh'
      - 'tools/scripts/check-worker-secret-scope.mjs'
      - 'tools/scripts/check-worker-secret-scope.test.mjs'
      - 'tools/scripts/deploy-secret-wiring.test.mjs'
      # W1-OPS-09 — rollback runbook + COMPLETE evidence
      - 'docs/runbooks/deploy-rollback.md'
      - 'docs/audits/OPS_W1_OPS_09_COMPLETE.md'
      # W1-OPS-21 — probe-contract app + image HEALTHCHECK surfaces
      - 'apps/api-gateway/src/plugins/health.ts'
      - 'apps/api-gateway/src/plugins/health.test.ts'
      - 'apps/api-gateway/Dockerfile'
      - 'apps/etl-worker/src/server.ts'
      - 'apps/etl-worker/src/server.test.ts'
      - 'apps/etl-worker/Dockerfile'
      - 'apps/web/src/app/api/health/**'
      - 'apps/web/Dockerfile'
      - 'infrastructure/docker/Dockerfile.api-gateway'
      - 'infrastructure/docker/Dockerfile.etl-worker'
      - 'infrastructure/docker/Dockerfile.web'
      - 'infrastructure/docker/Dockerfile.backend-service'
      - 'infrastructure/docker/Dockerfile.nextjs-app'
      - 'Dockerfile.fastify-base'
      - 'Dockerfile.web-base'
      # W1-OPS-16 — topology canonical gate inputs
      - 'tools/scripts/check-topology-canonical.sh'
      - 'docs/DEPLOYMENT_TOPOLOGY.md'
      - 'docs/audits/OPS_W1_OPS_16_TOPOLOGY.md'
      # W1-OPS-17 — replica / PDB coherence gate
      - 'tools/scripts/check-replica-policy.sh'
      - 'infrastructure/ops/production-replica-policy.yaml'
      - 'docs/audits/OPS_W1_OPS_17_REPLICAS.md'
      # W1-OPS-04 — backup encrypt / offsite / object-lock prod gate
      - 'tools/scripts/check-backup-prod-gate.sh'
      - 'tools/scripts/backup-crypto.sh'
      - 'tools/scripts/pg-backup.sh'
      - 'docs/BACKUP_RESTORE.md'
      - 'docs/audits/OPS_W1_OPS_04_COMPLETE.md'
  push:
    branches: [main]
    paths:
      - 'infrastructure/helm/**'
      - 'infrastructure/k8s/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/rollback.yml'
      - 'tools/scripts/helm-template-check.sh'
      # W1-SEC-07 — application/Helm/Prometheus metrics contract
      - 'packages/shared/observability/src/metrics-access.ts'
      - 'packages/shared/observability/src/fastify-plugin.ts'
      - 'apps/api-gateway/src/app.ts'
      - 'apps/api-gateway/src/config.ts'
      - 'infra/observability/prometheus.yml'
      - 'docs/audits/SEC_METRICS_W1_SEC_07.md'
      - 'docs/audits/SEC_W1_SEC_07_COMPLETE.md'
      - 'tools/scripts/deploy-rollback-check.sh'
      - 'tools/scripts/deploy-secrets-gate-check.sh'
      - 'tools/scripts/check-deploy-workflow-contract.mjs'
      - 'tools/scripts/check-deploy-workflow-contract.test.mjs'
      - 'tools/scripts/check-workflow-step-contracts.mjs'
      - 'tools/scripts/check-no-latest-image-tags.sh'
      - 'tools/scripts/check-worker-secret-scope.mjs'
      - 'tools/scripts/check-worker-secret-scope.test.mjs'
      - 'tools/scripts/deploy-secret-wiring.test.mjs'
      - 'docs/runbooks/deploy-rollback.md'
      - 'docs/audits/OPS_W1_OPS_09_COMPLETE.md'
      - 'apps/api-gateway/src/plugins/health.ts'
      - 'apps/api-gateway/src/plugins/health.test.ts'
      - 'apps/api-gateway/Dockerfile'
      - 'apps/etl-worker/src/server.ts'
      - 'apps/etl-worker/src/server.test.ts'
      - 'apps/etl-worker/Dockerfile'
      - 'apps/web/src/app/api/health/**'
      - 'apps/web/Dockerfile'
      - 'infrastructure/docker/Dockerfile.api-gateway'
      - 'infrastructure/docker/Dockerfile.etl-worker'
      - 'infrastructure/docker/Dockerfile.web'
      - 'infrastructure/docker/Dockerfile.backend-service'
      - 'infrastructure/docker/Dockerfile.nextjs-app'
      - 'Dockerfile.fastify-base'
      - 'Dockerfile.web-base'
      - 'tools/scripts/check-topology-canonical.sh'
      - 'docs/DEPLOYMENT_TOPOLOGY.md'
      - 'docs/audits/OPS_W1_OPS_16_TOPOLOGY.md'
      - 'tools/scripts/check-replica-policy.sh'
      - 'infrastructure/ops/production-replica-policy.yaml'
      - 'docs/audits/OPS_W1_OPS_17_REPLICAS.md'
      - 'tools/scripts/check-backup-prod-gate.sh'
      - 'tools/scripts/backup-crypto.sh'
      - 'tools/scripts/pg-backup.sh'
      - 'docs/BACKUP_RESTORE.md'
      - 'docs/audits/OPS_W1_OPS_04_COMPLETE.md'

concurrency:
  group: helm-template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-template:
    name: helm template dry-run (P0-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v3.14.0'

      # PRC-L182: deploy-secrets-gate-check parses deploy.yml via the `yaml` package.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '10.33.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit-test deploy workflow contract
        run: node --test tools/scripts/check-deploy-workflow-contract.test.mjs
      - name: Unit-test deploy secret wiring (PRC-H062)
        run: node --test tools/scripts/deploy-secret-wiring.test.mjs
      - name: Unit-test worker secret scope (NEW-g3_infra_tools-001)
        run: node --test tools/scripts/check-worker-secret-scope.test.mjs
      - name: Fail when a workload envFroms the full secret bundle (NEW-g3_infra_tools-001)
        run: node tools/scripts/check-worker-secret-scope.mjs
      - name: Lint + template charts (deploy path check)
        run: |
          ./tools/scripts/helm-template-check.sh
          ./tools/scripts/deploy-rollback-check.sh
          ./tools/scripts/deploy-secrets-gate-check.sh
