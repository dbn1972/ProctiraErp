# G-508 / G-708 / W1-OPS-14 — Supply chain: advisory gate, CycloneDX SBOM,
# image provenance + fail-closed keyless cosign.
#
# Runs on PRs and main (advisory gate + SBOM) and nightly. Image build/sign
# runs on push to main / schedule / dispatch (registry + OIDC available) and
# uses BuildKit provenance (mode=max), SBOM attestation, and keyless cosign
# (GitHub OIDC → Sigstore Fulcio/Rekor). Pull requests only get advisory+SBOM
# and an explicit "signing skipped (PR)" summary — never a silent soft skip.
name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_DIR: /tmp/supply-chain

jobs:
  advisory-gate:
    name: Advisory gate (pnpm audit, high+ fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allowlist self-test
        run: node --test tools/scripts/audit-gate.test.mjs

      - name: W1-OPS-14 provenance / signing regression guard
        run: bash tools/scripts/check-image-provenance-required.sh

      # Hard gate: exits 1 on any high/critical advisory that is not waived in
      # tools/supply-chain/audit-allowlist.json (waivers need reason, owner gap
      # and expiry; expired waivers also fail).
      - name: pnpm audit gate (prod deps, high+)
        run: node tools/scripts/audit-gate.mjs --level high --out "$ARTIFACT_DIR"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-audit
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM (cdxgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX 1.5 SBOM from pnpm-lock.yaml
        run: |
          mkdir -p "$ARTIFACT_DIR"
          npx --yes @cyclonedx/cdxgen@11.11.0 -t pnpm --spec-version 1.5 --no-install-deps \
            -o "$ARTIFACT_DIR/sbom.cdx.json" .

      # Reject an empty or purl-less document so a tooling regression cannot
      # ship a hollow SBOM.
      - name: Validate SBOM shape
        run: |
          node - "$ARTIFACT_DIR/sbom.cdx.json" <<'NODE'
          const fs = require('node:fs');
          const bom = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const components = bom.components ?? [];
          const withPurl = components.filter((c) => typeof c.purl === 'string' && c.purl.startsWith('pkg:npm/'));
          if (bom.bomFormat !== 'CycloneDX') throw new Error(`bomFormat=${bom.bomFormat}`);
          if (components.length < 100) throw new Error(`only ${components.length} components`);
          if (withPurl.length / components.length < 0.95) throw new Error(`only ${withPurl.length}/${components.length} components have npm purls`);
          console.log(`SBOM ok: CycloneDX ${bom.specVersion}, ${components.length} components, ${withPurl.length} with purl`);
          NODE

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ env.ARTIFACT_DIR }}/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  sign-image:
    name: Build, push & cosign api-gateway image
    # W1-OPS-14 — fail-closed on non-PR events. PRs cannot push/OIDC-sign.
    if: github.event_name != 'pull_request'
    needs: [advisory-gate, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      # W1-OPS-08 — canonical proctira/<service> (no hyphen form, no :latest).
      IMAGE: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/proctira/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to custom registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api-gateway
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64
          # W1-OPS-14 — SLSA provenance + BuildKit SBOM (required; never disable).
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      # Keyless: identity = this workflow's OIDC token, recorded in Rekor.
      - name: Sign image digest
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ env.ARTIFACT_DIR }}

      - name: Attach SBOM attestation
        env:
          COSIGN_YES: 'true'
        run: |
          cosign attest --type cyclonedx --predicate "$ARTIFACT_DIR/sbom.cdx.json" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}" | head -c 2000
          echo "signed ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  signing-skipped:
    name: Image signing status (PR residual)
    # Honest residual: PRs cannot push or mint OIDC for keyless cosign.
    if: github.event_name == 'pull_request'
    needs: [advisory-gate, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Explain why signing did not run
        run: |
          {
            echo "## Image signing: skipped (pull_request)"
            echo "- pull_request events cannot push to the registry or mint OIDC tokens for keyless cosign."
            echo "- Advisory gate and CycloneDX SBOM still ran for this ref."
            echo "- Production path (\`push\`/\`schedule\`/\`workflow_dispatch\` + \`release.yml\`) requires provenance + cosign (W1-OPS-14)."
          } >> "$GITHUB_STEP_SUMMARY"
