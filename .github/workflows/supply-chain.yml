# G-508 / G-708 — Supply chain: advisory gate, CycloneDX SBOM, image signing.
#
# Runs on PRs and main (advisory gate + SBOM) and nightly. Image signing runs
# only when an OCI registry is reachable (push to main / manual dispatch) and
# uses keyless cosign (GitHub OIDC → Sigstore Fulcio/Rekor); it is skipped, with
# an explicit summary line, on pull requests from forks and when
# `SUPPLY_CHAIN_SIGN_IMAGES` is not enabled — never silently.
name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_DIR: /tmp/supply-chain

jobs:
  advisory-gate:
    name: Advisory gate (pnpm audit, high+ fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allowlist self-test
        run: node --test tools/scripts/audit-gate.test.mjs

      # Hard gate: exits 1 on any high/critical advisory that is not waived in
      # tools/supply-chain/audit-allowlist.json (waivers need reason, owner gap
      # and expiry; expired waivers also fail).
      - name: pnpm audit gate (prod deps, high+)
        run: node tools/scripts/audit-gate.mjs --level high --out "$ARTIFACT_DIR"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-audit
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM (cdxgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX 1.5 SBOM from pnpm-lock.yaml
        run: |
          mkdir -p "$ARTIFACT_DIR"
          npx --yes @cyclonedx/cdxgen@11.11.0 -t pnpm --spec-version 1.5 --no-install-deps \
            -o "$ARTIFACT_DIR/sbom.cdx.json" .

      # Reject an empty or purl-less document so a tooling regression cannot
      # ship a hollow SBOM.
      - name: Validate SBOM shape
        run: |
          node - "$ARTIFACT_DIR/sbom.cdx.json" <<'NODE'
          const fs = require('node:fs');
          const bom = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const components = bom.components ?? [];
          const withPurl = components.filter((c) => typeof c.purl === 'string' && c.purl.startsWith('pkg:npm/'));
          if (bom.bomFormat !== 'CycloneDX') throw new Error(`bomFormat=${bom.bomFormat}`);
          if (components.length < 100) throw new Error(`only ${components.length} components`);
          if (withPurl.length / components.length < 0.95) throw new Error(`only ${withPurl.length}/${components.length} components have npm purls`);
          console.log(`SBOM ok: CycloneDX ${bom.specVersion}, ${components.length} components, ${withPurl.length} with purl`);
          NODE

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: ${{ env.ARTIFACT_DIR }}/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  sign-image:
    name: Build, push & cosign api-gateway image
    # Signing needs registry push + OIDC. PRs (incl. forks) cannot get either.
    if: >-
      github.event_name != 'pull_request' &&
      vars.SUPPLY_CHAIN_SIGN_IMAGES == 'true'
    needs: [advisory-gate, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      IMAGE: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/proctira-api-gateway
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to custom registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api-gateway
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64
          provenance: false

      - uses: sigstore/cosign-installer@v3

      # Keyless: identity = this workflow's OIDC token, recorded in Rekor.
      - name: Sign image digest
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-cyclonedx
          path: ${{ env.ARTIFACT_DIR }}

      - name: Attach SBOM attestation
        env:
          COSIGN_YES: 'true'
        run: |
          cosign attest --type cyclonedx --predicate "$ARTIFACT_DIR/sbom.cdx.json" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}" | head -c 2000
          echo "signed ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  signing-skipped:
    name: Image signing status
    if: >-
      github.event_name == 'pull_request' ||
      vars.SUPPLY_CHAIN_SIGN_IMAGES != 'true'
    needs: [advisory-gate, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Explain why signing did not run
        run: |
          {
            echo "## Image signing: skipped"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- pull_request events cannot push to the registry or mint OIDC tokens for keyless cosign."
            fi
            if [ "${{ vars.SUPPLY_CHAIN_SIGN_IMAGES }}" != "true" ]; then
              echo "- repository variable \`SUPPLY_CHAIN_SIGN_IMAGES\` is not \`true\`; set it (and \`CONTAINER_REGISTRY\` / registry secrets if not GHCR) to enable."
            fi
            echo "- Advisory gate and SBOM still ran and passed for this ref."
          } >> "$GITHUB_STEP_SUMMARY"
