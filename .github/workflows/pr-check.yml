# =============================================================================
# PR Check - ProctiraERP Unified Platform
# =============================================================================
# Lightweight checks that run on every PR to provide fast feedback.
# Validates commit messages, PR size, and runs affected-only checks.
# =============================================================================

name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Validate PR metadata
  # ---------------------------------------------------------------------------
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "PR size: ${TOTAL} lines (${ADDITIONS}+/${DELETIONS}-)"
          if [ "$TOTAL" -gt 1000 ]; then
            echo "::warning::Large PR detected (${TOTAL} lines changed). Consider splitting into smaller PRs."
          fi

  # ---------------------------------------------------------------------------
  # Affected module summary
  # ---------------------------------------------------------------------------
  affected-summary:
    name: Affected Modules
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List affected packages
        id: affected
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Affected Packages'
            echo
            echo 'The following packages will be rebuilt:'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          packages="$(pnpm turbo run build --filter="...[$BASE_SHA]" --dry=json | jq -r '.packages[]')"
          if [ -z "$packages" ]; then
            echo '- No build packages affected.' >> "$GITHUB_STEP_SUMMARY"
          else
            while IFS= read -r package; do
              echo "- \`${package}\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$packages"
          fi
