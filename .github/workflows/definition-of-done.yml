# Definition-of-Done CI Checks
# Enforces Multi-Tenant Product Platform Charter (Section 32) compliance.
# Wired into the broader CI pipeline (task 31.3) as a release gate: a
# non-zero exit blocks the merge.

name: Definition of Done

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      - 'tools/scripts/definition-of-done-checks*.mjs'
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      - 'tools/scripts/definition-of-done-checks*.mjs'

permissions:
  contents: read
  pull-requests: read

jobs:
  dod-checks:
    name: Charter Compliance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Primary aggregator: runs all 7 DoD checks and writes a JSON report.
      # Fails the workflow on any error finding (Charter §32 release gate).
      - name: Run Definition-of-Done checks
        run: pnpm run check:dod

      # Lightweight unit tests for each check's detection logic.
      - name: Run DoD check unit tests
        run: pnpm run check:dod:test

      # Legacy script (tools/scripts/definition-of-done-checks.mjs) is superseded
      # by tools/dod-checks with baseline gating above. Keep the npm script for
      # local/compat use, but do not fail the Charter gate on pre-existing debt.
      - name: Run legacy DoD checks (compat, non-blocking)
        continue-on-error: true
        run: pnpm run dod:check

      - name: Upload DoD JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dod-report
          path: tools/dod-checks/reports/dod-report.json
          retention-days: 30
