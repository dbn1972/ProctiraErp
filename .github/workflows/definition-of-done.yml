# Definition-of-Done CI Checks
# Enforces Multi-Tenant Product Platform Charter (Section 32) compliance.
# Wired into the broader CI pipeline (task 31.3) as a release gate: a
# non-zero exit blocks the merge.

name: Definition of Done

on:
  pull_request:
    # integration/**: merge-train PRs get the same Charter §32 gate as main.
    branches: [main, develop, 'integration/**']
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      # PRC-L184: legacy tools/scripts/definition-of-done-checks.mjs removed;
      # dod:check / dod:test alias the supported tools/dod-checks package.
      - 'tools/scripts/dod-script-wiring.test.mjs'
      - 'tools/scripts/check-dod-baseline-ratchet.mjs'
      - 'tools/scripts/check-dod-baseline-ratchet.test.mjs'
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      # PRC-L184: legacy tools/scripts/definition-of-done-checks.mjs removed;
      # dod:check / dod:test alias the supported tools/dod-checks package.
      - 'tools/scripts/dod-script-wiring.test.mjs'
      - 'tools/scripts/check-dod-baseline-ratchet.mjs'
      - 'tools/scripts/check-dod-baseline-ratchet.test.mjs'

permissions:
  contents: read
  pull-requests: read

jobs:
  dod-checks:
    name: Charter Compliance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRC-M551: tools/dod-checks/reports/baseline.json may only shrink
      # versus the base revision (totals, per-check counts, error fingerprints).
      # Event values pass via env (PRC-M256) and are SHA-validated.
      - name: DoD baseline never increases (PRC-M551)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [[ ! "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
            BASE="$PUSH_BEFORE_SHA"
          else
            git fetch --no-tags --depth=1 origin main
            BASE="$(git rev-parse FETCH_HEAD)"
          fi
          [[ "$BASE" =~ ^[0-9a-fA-F]{40}$ ]] \
            || { echo "Invalid DoD ratchet base SHA" >&2; exit 1; }
          git cat-file -e "${BASE}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$BASE"
          node --test tools/scripts/check-dod-baseline-ratchet.test.mjs
          node tools/scripts/check-dod-baseline-ratchet.mjs --base "$BASE"

      # Primary aggregator: runs all 7 DoD checks and writes a JSON report.
      # Fails the workflow on any error finding (Charter §32 release gate).
      - name: Run Definition-of-Done checks
        run: pnpm run check:dod

      # Lightweight unit tests for each check's detection logic.
      - name: Run DoD check unit tests
        run: pnpm run check:dod:test

      # W3-D6: fail closed when dod-report.json is missing or incomplete.
      - name: Assert DoD evidence artifacts (W3-D6)
        if: always()
        run: pnpm run check:dod:evidence

      - name: Upload DoD JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dod-report
          path: tools/dod-checks/reports/dod-report.json
          if-no-files-found: error
          retention-days: 30
