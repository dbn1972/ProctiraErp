# Definition-of-Done CI Checks
# Enforces Multi-Tenant Product Platform Charter (Section 32) compliance.
# Wired into the broader CI pipeline (task 31.3) as a release gate: a
# non-zero exit blocks the merge.

name: Definition of Done

on:
  pull_request:
    # integration/**: merge-train PRs get the same Charter §32 gate as main.
    branches: [main, develop, 'integration/**']
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      # PRC-L184: legacy tools/scripts/definition-of-done-checks.mjs removed;
      # dod:check / dod:test alias the supported tools/dod-checks package.
      - 'tools/scripts/dod-script-wiring.test.mjs'
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - 'packages/eslint-plugin-proctira/**'
      - 'apps/**'
      - 'tools/dod-checks/**'
      # PRC-L184: legacy tools/scripts/definition-of-done-checks.mjs removed;
      # dod:check / dod:test alias the supported tools/dod-checks package.
      - 'tools/scripts/dod-script-wiring.test.mjs'

permissions:
  contents: read
  pull-requests: read

jobs:
  dod-checks:
    name: Charter Compliance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Primary aggregator: runs all 7 DoD checks and writes a JSON report.
      # Fails the workflow on any error finding (Charter §32 release gate).
      - name: Run Definition-of-Done checks
        run: pnpm run check:dod

      # Lightweight unit tests for each check's detection logic.
      - name: Run DoD check unit tests
        run: pnpm run check:dod:test

      # W3-D6: fail closed when dod-report.json is missing or incomplete.
      - name: Assert DoD evidence artifacts (W3-D6)
        if: always()
        run: pnpm run check:dod:evidence

      - name: Upload DoD JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dod-report
          path: tools/dod-checks/reports/dod-report.json
          if-no-files-found: error
          retention-days: 30
