# =============================================================================
# Release Pipeline - ProctiraERP Unified Platform
# =============================================================================
# Builds and pushes container images for affected services to a configurable
# OCI registry (GHCR by default). Gated on successful completion of the CI
# workflow for the same commit, so only commits that pass lint, type-check,
# unit tests, build, and integration tests produce release artifacts.
#
# Triggers:
#   - workflow_run: After CI completes successfully on main/develop/release/**
#   - workflow_dispatch: Manual release for any ref (with optional service list).
#     W1-OPS-23: manual dispatch still requires a successful same-SHA CI proof
#     (workflow_run or Checks API aggregate); fail closed if missing.
#
# Outputs:
#   - Container images under canonical name {registry}/{namespace}/proctira/<service>
#     tagged by:
#       * Full commit SHA (immutable, for traceability) — sha-<full>
#       * Short commit SHA (human-readable) — sha-<short>
#       * Branch name (moving tip for that branch; not used by prod Helm/kustomize)
#     W1-OPS-08: never tags mutable :latest.
# =============================================================================

name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, develop, 'release/**']
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to release (empty = affected only)'
        required: false
        type: string
      force-all:
        description: 'Build all services regardless of changes'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Registry is configurable. Defaults to GitHub Container Registry.
  # Override by setting the CONTAINER_REGISTRY repository variable.
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read
  packages: write
  id-token: write
  # W1-OPS-23: query workflow_runs / check-runs for manual same-SHA CI proof.
  actions: read
  checks: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Only proceed if CI succeeded for the exact release SHA.
  # - workflow_run: job runs only when the triggering CI conclusion is success.
  # - workflow_dispatch: enters the job, then require-same-sha-ci.mjs proves a
  #   successful CI workflow_run (or CI Aggregate check_run) for github.sha.
  #   Missing / failed / cancelled / in-progress → fail closed.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    # PRC-H061: a workflow_run must come from a successful CI *push* run whose
    # head repository is this repository. A fork PR from a branch named `main`
    # also triggers workflow_run with head_branch == 'main'; without these
    # checks it could build/migrate/deploy fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      head-branch: ${{ steps.resolve.outputs.head-branch }}
    steps:
      # PRC-M256: context values reach the shell only through env (never inline in script).
      - name: Resolve commit and branch
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            HEAD_SHA="${RUN_HEAD_SHA}"
            HEAD_BRANCH="${RUN_HEAD_BRANCH}"
          else
            HEAD_SHA="${PUSH_SHA}"
            HEAD_BRANCH="${PUSH_REF_NAME}"
          fi
          if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head SHA format"
            exit 1
          fi
          if ! [[ "${HEAD_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected branch name format"
            exit 1
          fi
          echo "head-sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "head-branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Releasing commit ${HEAD_SHA} from branch ${HEAD_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
      # Defense in depth for PRC-H061: fail (not skip) if the job-level guard
      # is ever weakened, and prove the SHA is on the protected branch.
      - name: Assert trusted push-triggered CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
          HEAD_BRANCH: ${{ steps.resolve.outputs.head-branch }}
        run: |
          if [ "${RUN_EVENT}" != "push" ]; then
            echo "::error::Refusing workflow_run from event '${RUN_EVENT}' (only 'push' may deploy/release)"
            exit 1
          fi
          if [ "${HEAD_REPO}" != "${THIS_REPO}" ]; then
            echo "::error::Refusing workflow_run from head repository '${HEAD_REPO}' (expected '${THIS_REPO}')"
            exit 1
          fi
          # Ancestor check: HEAD_SHA must be reachable from the protected branch.
          STATUS="$(gh api "repos/${THIS_REPO}/compare/${HEAD_BRANCH}...${HEAD_SHA}" --jq .status)"
          case "${STATUS}" in
            identical | behind) echo "${HEAD_SHA} is on ${HEAD_BRANCH}" ;;
            *)
              echo "::error::${HEAD_SHA} is not an ancestor of ${HEAD_BRANCH} (compare status: ${STATUS})"
              exit 1
              ;;
          esac

      # W1-OPS-23: manual release used to skip CI entirely. Require same-SHA proof.
      - name: Checkout gate script
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.head-sha }}
          sparse-checkout: |
            tools/scripts/require-same-sha-ci.mjs
          sparse-checkout-cone-mode: false

      - name: Require successful CI on same SHA (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: node tools/scripts/require-same-sha-ci.mjs --sha "${HEAD_SHA}"

  # ---------------------------------------------------------------------------
  # Detect which services have changed and need new container images.
  # Uses path-based detection against the previous commit on the same branch.
  # ---------------------------------------------------------------------------
  detect-services:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      services: ${{ steps.affected.outputs.services }}
      has-services: ${{ steps.affected.outputs.has-services }}
      record-base: ${{ steps.affected.outputs.record-base }}
    # #555 review #1: reads the recorded diff base (Deployments API).
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}
          fetch-depth: 0

      - name: Detect affected services
        id: affected
        env:
          MANUAL_SERVICES: ${{ inputs.services }}
          FORCE_ALL: ${{ inputs.force-all }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ needs.ci-gate.outputs.head-branch }}
          HEAD_SHA: ${{ needs.ci-gate.outputs.head-sha }}
        run: |
          set -euo pipefail

          # Master list of releasable images.
          # Canonical runtime: api-gateway (+ portals) + etl-worker (+ dr-tools).
          # institution…report are W1-OPS-16 NON-PROD / lab split-domain images
          # (still buildable; not the default deploy path).
          ALL_SERVICES="$(node -e 'import("./tools/scripts/detect-affected-services.mjs").then((m) => console.log(m.servicesInScope(m.loadManifest(), "release").join(",")))')"

          # Manual override via workflow_dispatch.
          if [ "${FORCE_ALL:-false}" = "true" ]; then
            echo "Force-all flag set: building all services"
            {
              echo "services=${ALL_SERVICES}"
              echo "has-services=true"
              echo "record-base=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${MANUAL_SERVICES:-}" ]; then
            # PRC-M256 / #555 review #7: format + services.json allowlist check
            # BEFORE anything reaches GITHUB_OUTPUT / build jobs.
            MANUAL_SERVICES=$(node tools/scripts/detect-affected-services.mjs validate --workflow release \
              --services "${MANUAL_SERVICES}")
            echo "Manual service list provided: ${MANUAL_SERVICES}"
            # A subset release must not advance the diff base for every image.
            {
              echo "services=${MANUAL_SERVICES}"
              echo "has-services=true"
              echo "record-base=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRC-M259 / #555 review #1: diff every commit since the SHA this branch
          # last fully released (recorded by record-diff-base; a workflow_run
          # headSha is the default-branch tip at trigger time, not what was
          # built), using the shared tools/scripts/services.json manifest. No
          # record, an API error or a non-ancestor base fails safe to a full release.
          SCOPE=$(node tools/scripts/deploy-diff-base.mjs scope-for-branch --prefix release --branch "${HEAD_BRANCH}")
          BASE_SHA=$(node tools/scripts/deploy-diff-base.mjs get --scope "${SCOPE}")
          echo "Diff base (${SCOPE}): ${BASE_SHA:-<none; full release>}"
          SERVICES=$(node tools/scripts/detect-affected-services.mjs affected --workflow release \
            --base "${BASE_SHA:-}" --head "$HEAD_SHA")
          if [ -z "$SERVICES" ]; then
            echo "No service changes detected; skipping image builds"
            HAS_SERVICES=false
          else
            echo "Affected services: ${SERVICES}"
            HAS_SERVICES=true
          fi
          {
            echo "services=${SERVICES}"
            echo "has-services=${HAS_SERVICES}"
            echo "record-base=true"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Convert comma-separated service list into a matrix for parallel builds.
  # ---------------------------------------------------------------------------
  matrix-prep:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    needs: detect-services
    if: needs.detect-services.outputs.has-services == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Convert services to matrix JSON
        id: set-matrix
        env:
          SERVICES: ${{ needs.detect-services.outputs.services }}
        run: |
          JSON=$(echo "$SERVICES" | jq -R -c 'split(",")')
          echo "matrix={\"service\":${JSON}}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build and push container images. One job per service runs in parallel.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci-gate, detect-services, matrix-prep]
    if: needs.detect-services.outputs.has-services == 'true'
    # W1-OPS-14 / G-735 — provenance attestations + keyless cosign (fail-closed).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # GHCR uses GITHUB_TOKEN automatically; other registries require explicit
      # credentials. The choice is determined by REGISTRY at runtime.
      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to custom registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve Dockerfile and build args
        id: docker-config
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # PRC-M259: shared manifest (tools/scripts/services.json) — same mapping as deploy.yml.
          node tools/scripts/detect-affected-services.mjs docker-config --service "$SERVICE" >> "$GITHUB_OUTPUT"
      # docker/metadata-action computes the canonical set of tags and labels
      # following OCI and OpenContainers conventions. Tags include:
      #   - branch name (e.g. develop, main)
      #   - short SHA (e.g. sha-abc1234)
      #   - full SHA (immutable digest reference)
      # W1-OPS-08 — no mutable :latest; repository path is proctira/<service>.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/proctira/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.ci-gate.outputs.head-branch }},enable=${{ needs.ci-gate.outputs.head-branch != '' }}
            type=raw,value=sha-${{ needs.ci-gate.outputs.head-sha }}
            type=sha,format=short,prefix=sha-,sha=${{ needs.ci-gate.outputs.head-sha }}
          labels: |
            org.opencontainers.image.title=proctira/${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.ci-gate.outputs.head-sha }}
            org.opencontainers.image.version=${{ needs.ci-gate.outputs.head-branch }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ steps.docker-config.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.docker-config.outputs.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
          # W1-OPS-14 — SLSA provenance + BuildKit SBOM attestations (required; never disable).
          provenance: mode=max
          sbom: true

      # W1-OPS-14 / G-735 — keyless cosign required on every released image (no opt-out variable).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image digest (keyless)
        env:
          COSIGN_YES: 'true'
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/proctira/${{ matrix.service }}
        run: |
          cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/proctira/${{ matrix.service }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}" | head -c 2000
          echo "signed ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record image digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${SERVICE}"
            echo ""
            echo '```'
            echo "Tags:"
            echo "${IMAGE_TAGS}"
            echo "Digest: ${IMAGE_DIGEST}"
            echo "Provenance: mode=max + BuildKit SBOM + cosign (required)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Aggregate result so downstream workflows (deploy.yml) can depend on the
  # whole release matrix succeeding.
  # ---------------------------------------------------------------------------
  # #555 review #1 (PRC-M259): record the SHA whose images were all built, so
  # the next release diffs from it. Skipped for manual subsets and failures.
  record-diff-base:
    name: Record release diff base
    runs-on: ubuntu-latest
    needs: [ci-gate, detect-services, build-and-push]
    if: >-
      always() && needs.ci-gate.result == 'success' && needs.detect-services.result == 'success' &&
      needs.detect-services.outputs.record-base == 'true' &&
      (needs.build-and-push.result == 'success' ||
      (needs.detect-services.outputs.has-services == 'false' && needs.build-and-push.result == 'skipped'))
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ci-gate.outputs.head-sha }}
          sparse-checkout: |
            tools/scripts/deploy-diff-base.mjs
          sparse-checkout-cone-mode: false
      - name: Record diff base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ needs.ci-gate.outputs.head-branch }}
          HEAD_SHA: ${{ needs.ci-gate.outputs.head-sha }}
        run: |
          set -euo pipefail
          SCOPE=$(node tools/scripts/deploy-diff-base.mjs scope-for-branch --prefix release --branch "${HEAD_BRANCH}")
          node tools/scripts/deploy-diff-base.mjs record --scope "${SCOPE}" --sha "${HEAD_SHA}"

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ci-gate, detect-services, build-and-push]
    if: always() && needs.ci-gate.result == 'success'
    steps:
      - name: Summarize
        env:
          HEAD_SHA: ${{ needs.ci-gate.outputs.head-sha }}
          HEAD_BRANCH: ${{ needs.ci-gate.outputs.head-branch }}
          SERVICES: ${{ needs.detect-services.outputs.services || 'none' }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Branch: \`${HEAD_BRANCH}\`"
            echo "- Services: \`${SERVICES}\`"
            echo "- Build status: \`${BUILD_RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any image build failed
        if: needs.build-and-push.result == 'failure'
        run: exit 1
