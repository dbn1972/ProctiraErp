# =============================================================================
# G-403 — Visual regression (Playwright toHaveScreenshot)
# =============================================================================
# Runs desktop Chromium screenshot baselines for top ungated screens.
# Does not require E2E_BACKEND_READY (login / redirect shells only).
# =============================================================================

name: Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/src/app/(auth)/**'
      - 'apps/web/e2e/24-visual-regression.spec.ts'
      - 'apps/web/e2e/24-visual-regression.spec.ts-snapshots/**'
      - 'apps/web/playwright.config.ts'
      - '.github/workflows/visual-regression.yml'
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read

jobs:
  visual-regression:
    name: Playwright screenshot baselines (G-403)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @proctira/web exec playwright install --with-deps chromium

      - name: Run visual regression specs
        run: |
          pnpm --filter @proctira/web exec playwright test \
            e2e/24-visual-regression.spec.ts \
            --project=chromium
        env:
          CI: '1'
          PLAYWRIGHT_ALL_BROWSERS: ''

      - name: Upload screenshot diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
