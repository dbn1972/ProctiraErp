# =============================================================================
# G-403 / G-723 — Visual regression (Playwright toHaveScreenshot)
# =============================================================================
# Runs Chromium desktop + iPad tablet + Pixel 5 mobile screenshot baselines
# for top ungated screens. Does not require E2E_BACKEND_READY (login / redirect
# shells only).
# =============================================================================

name: Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/src/app/(auth)/**'
      - 'apps/web/e2e/24-visual-regression.spec.ts'
      - 'apps/web/e2e/24-visual-regression.spec.ts-snapshots/**'
      - 'apps/web/playwright.config.ts'
      - '.github/workflows/visual-regression.yml'
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read

jobs:
  visual-regression:
    name: Playwright screenshot baselines (G-403 / G-723)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @proctira/web exec playwright install --with-deps chromium

      - name: Run visual regression specs (desktop + tablet + mobile)
        run: |
          pnpm --filter @proctira/web exec playwright test \
            e2e/24-visual-regression.spec.ts \
            --project=chromium \
            --project=tablet \
            --project=mobile-chrome
        env:
          CI: '1'
          PLAYWRIGHT_ALL_BROWSERS: ''

      - name: Upload screenshot diff artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-diffs
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
