# actionlint configuration for ProctiraERP Unified Platform.
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

self-hosted-runner:
  labels: []

# Configurable runner labels are not in use; default GitHub-hosted runners only.
config-variables:
  - TURBO_TEAM
  - CONTAINER_REGISTRY
  - IMAGE_NAMESPACE
  - PROCTIRA_CODEOWNERS_TEAMS_READY
  - PROCTIRA_CODEOWNERS_ALLOW_PERSONAL_INTERIM
  # Per-environment ClusterSecretStore name consumed by deploy.yml (PRC-H062).
  - EXTERNAL_SECRET_STORE
  # Pre-created cluster Secret (ESO/sealed-secrets) the proctira-platform chart's
  # DR CronJobs + workers read via existingSecret (PRC-H062).
  - PLATFORM_EXISTING_SECRET
